<html lang="vi">

<title>HỌC ENGLISH - 3 Thì Cơ Bản</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 20%,#ff00cc55,transparent 30%),
        radial-gradient(circle at 90% 20%,#00e5ff55,transparent 30%),
        radial-gradient(circle at 50% 100%,#7c3aed77,transparent 40%),
        linear-gradient(135deg,#09001f,#101044,#001b36);
}

header{
    text-align:center;
    padding:40px 15px 25px;
}

.logo{
    font-size:55px;
}

header h1{
    font-size:42px;
    margin:8px 0;
    background:linear-gradient(90deg,#00e5ff,#fff,#ff4ecd);
    -webkit-background-clip:text;
    color:transparent;
}

header p{
    color:#d9e7ff;
}

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
}

.glass{
    background:#ffffff10;
    border:1px solid #ffffff25;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:25px;
    box-shadow:0 20px 60px #0005;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px;
    margin-bottom:20px;
}

.tab{
    border:0;
    padding:16px 10px;
    border-radius:18px;
    color:white;
    background:#ffffff0d;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:.2s;
}

.tab:hover{
    transform:translateY(-2px);
    background:#ffffff20;
}

.tab.active{
    background:linear-gradient(135deg,#00c6ff,#7c3aed,#ff2fb3);
    box-shadow:0 8px 25px #7c3aed55;
}

.lesson{
    padding:28px;
    margin-bottom:20px;
}

.lesson h2{
    font-size:27px;
    margin-bottom:10px;
}

.lesson h3{
    color:#70eaff;
    margin:23px 0 10px;
}

.formula{
    background:#0005;
    padding:16px;
    margin:9px 0;
    border-radius:15px;
    border-left:4px solid #00e5ff;
    line-height:1.6;
}

.signs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.sign{
    background:linear-gradient(135deg,#ffffff12,#ffffff05);
    border:1px solid #ffffff20;
    padding:11px 15px;
    border-radius:14px;
}

.example{
    background:#0005;
    padding:17px;
    border-radius:15px;
    line-height:1.7;
}

.start{
    text-align:center;
    padding:30px;
    margin-bottom:20px;
}

.start h2{
    margin-bottom:8px;
}

.btn{
    border:0;
    padding:14px 28px;
    margin-top:18px;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#00c6ff,#7c3aed,#ff2fb3);
    box-shadow:0 8px 25px #7c3aed55;
    transition:.2s;
}

.btn:hover{
    transform:scale(1.04);
}

#quiz{
    display:none;
    padding:28px;
    margin-bottom:25px;
}

.quiz-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.progress{
    height:10px;
    background:#0006;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00e5ff,#ff2fb3);
    transition:.3s;
}

.number{
    margin-top:18px;
    color:#aeeeff;
    font-weight:bold;
}

.question{
    font-size:24px;
    line-height:1.5;
    font-weight:bold;
    margin:15px 0 20px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    padding:17px;
    border:1px solid #ffffff25;
    border-radius:17px;
    background:#ffffff0d;
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.answer:hover{
    background:#ffffff20;
    transform:translateY(-2px);
}

.answer.correct{
    background:#16a34acc!important;
    border-color:#4ade80;
}

.answer.wrong{
    background:#dc2626cc!important;
    border-color:#f87171;
}

.answer:disabled{
    cursor:default;
}

.feedback{
    min-height:28px;
    margin-top:15px;
    font-weight:bold;
}

.next{
    display:none;
    border:0;
    padding:13px 25px;
    border-radius:25px;
    background:#fff;
    color:#351064;
    font-weight:bold;
    cursor:pointer;
}

.result{
    display:none;
    text-align:center;
    padding:25px 0 5px;
}

.score{
    font-size:60px;
    font-weight:bold;
    color:#ffe66d;
    margin:15px;
}

footer{
    text-align:center;
    padding:30px;
    color:#aebde0;
}

@media(max-width:700px){
    header h1{
        font-size:32px;
    }

    .tabs{
        grid-template-columns:1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .lesson,#quiz{
        padding:20px;
    }

    .question{
        font-size:20px;
    }
}
</style>
</head>

/* ==================================================
   QUIZ ENGINE
================================================== */

let currentTense="past";
let quizQuestions=[];
let currentQuestion=0;
let score=0;


/* HIỂN THỊ BÀI HỌC */

function changeTense(tense,button){

    currentTense=tense;

    document.querySelectorAll(".tab")
        .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("lesson").innerHTML=
        lessons[tense];

    document.getElementById("startBox").style.display=
        "block";

    document.getElementById("quiz").style.display=
        "none";
}


/* BẮT ĐẦU QUIZ */

function startQuiz(){

    quizQuestions=[
        ...questions[currentTense]
    ];

    /*
    Trộn câu hỏi
    */
    quizQuestions.sort(
        ()=>Math.random()-0.5
    );

    currentQuestion=0;
    score=0;

    document.getElementById("startBox")
        .style.display="none";

    document.getElementById("lesson")
        .style.display="none";

    document.getElementById("quiz")
        .style.display="block";

    document.getElementById("result")
        .style.display="none";

    document.getElementById("question")
        .style.display="block";

    document.getElementById("answers")
        .style.display="grid";

    document.getElementById("questionNumber")
        .style.display="block";

    document.getElementById("feedback")
        .style.display="block";

    document.getElementById("score")
        .textContent="0";

    renderQuestion();
}


/* HIỂN THỊ CÂU */

function renderQuestion(){

    const q=
        quizQuestions[currentQuestion];

    document.getElementById("questionNumber")
        .textContent=
        "Câu "+(currentQuestion+1)+
        " / "+quizQuestions.length;

    document.getElementById("question")
        .textContent=q[0];

    const answers=
        document.getElementById("answers");

    answers.innerHTML="";

    q[1].forEach((option,index)=>{

        const button=
            document.createElement("button");

        button.className="answer";

        button.textContent=
            String.fromCharCode(65+index)
            +". "
            +option;

        button.onclick=()=>{
            chooseAnswer(index,button);
        };

        answers.appendChild(button);

    });

    document.getElementById("feedback")
        .textContent="";

    document.getElementById("nextBtn")
        .style.display="none";

    document.getElementById("progressBar")
        .style.width=
        (
            currentQuestion/
            quizQuestions.length*
            100
        )+"%";
}


/* CHỌN ĐÁP ÁN */

function chooseAnswer(selected,button){

    const q=
        quizQuestions[currentQuestion];

    const correct=
        q[2];

    document.querySelectorAll(".answer")
        .forEach(btn=>{
            btn.disabled=true;
        });

    if(selected===correct){

        score++;

        button.classList.add("correct");

        document.getElementById("feedback")
            .textContent=
            "🎉 Chính xác!";

    }else{

        button.classList.add("wrong");

        document.querySelectorAll(".answer")
            [correct]
            .classList.add("correct");

        document.getElementById("feedback")
            .textContent=
            "❌ Chưa đúng!";
    }

    document.getElementById("score")
        .textContent=score;

    document.getElementById("nextBtn")
        .style.display="inline-block";
}


/* CÂU TIẾP */

function nextQuestion(){

    currentQuestion++;

    if(
        currentQuestion>=
        quizQuestions.length
    ){

        finishQuiz();

        return;
    }

    renderQuestion();
}


/* KẾT QUẢ */

function finishQuiz(){

    document.getElementById("question")
        .style.display="none";

    document.getElementById("questionNumber")
        .style.display="none";

    document.getElementById("answers")
        .style.display="none";

    document.getElementById("feedback")
        .style.display="none";

    document.getElementById("nextBtn")
        .style.display="none";

    document.getElementById("progressBar")
        .style.width="100%";

    document.getElementById("result")
        .style.display="block";

    document.getElementById("finalScore")
        .textContent=score;

    let message="";

    if(score>=90){
        message=
        "🏆 Xuất sắc! Bạn nắm rất chắc thì này!";
    }
    else if(score>=80){
        message=
        "🔥 Rất tốt! Chỉ cần luyện thêm một chút!";
    }
    else if(score>=60){
        message=
        "👍 Khá ổn! Hãy ôn lại các câu sai.";
    }
    else if(score>=40){
        message=
        "💪 Cố lên! Bạn nên xem lại công thức.";
    }
    else{
        message=
        "📚 Hãy học lại phần lý thuyết rồi thử lại nhé!";
    }

    document.getElementById("resultText")
        .textContent=message;
}
