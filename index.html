
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HocEnglish</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 15% 15%,#ff00cc44,transparent 28%),
    radial-gradient(circle at 85% 15%,#00e5ff44,transparent 28%),
    radial-gradient(circle at 50% 100%,#703cff55,transparent 38%),
    #080b1c;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  text-align:center;
  padding:28px 15px 20px;
}

.logo{
  font-size:36px;
}

header h1{
  font-size:34px;
  margin-top:4px;
  background:linear-gradient(90deg,#00e5ff,#fff,#ff35c8);
  -webkit-background-clip:text;
  color:transparent;
}

header p{
  color:#9eacd0;
  font-size:13px;
  margin-top:6px;
}

.container{
  width:94%;
  max-width:950px;
  margin:auto;
}

.card{
  background:#ffffff09;
  border:1px solid #ffffff17;
  border-radius:18px;
  backdrop-filter:blur(18px);
  box-shadow:0 15px 50px #0005;
}

/* MENU */

.main-menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:7px;
  margin-bottom:10px;
}

.main-menu button{
  border:0;
  background:transparent;
  color:#aebbd8;
  padding:12px 5px;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
}

.main-menu button.active{
  color:white;
  background:linear-gradient(135deg,#00bfff,#7040e8,#ed2cae);
}

/* GRAMMAR */

.grammar{
  padding:10px;
  margin-bottom:10px;
}

.grammar-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.grammar-tabs button{
  border:1px solid #ffffff12;
  background:#ffffff07;
  color:#b9c6e1;
  padding:9px 4px;
  border-radius:10px;
  font-size:11px;
  font-weight:bold;
}

.grammar-tabs button.active{
  color:white;
  border-color:#00d9ff88;
  background:#00cfff20;
}

.lesson{
  padding:15px;
  margin-top:8px;
  display:none;
}

.lesson.show{
  display:block;
}

.lesson h2{
  font-size:19px;
  margin-bottom:7px;
}

.lesson p{
  color:#c0cbe1;
  font-size:13px;
  line-height:1.5;
}

.lesson h3{
  color:#69eaff;
  font-size:13px;
  margin:13px 0 6px;
}

.formula{
  background:#0004;
  border-radius:9px;
  padding:8px 10px;
  margin:5px 0;
  font-size:13px;
  line-height:1.5;
}

.signs{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.sign{
  padding:5px 8px;
  background:#ffffff09;
  border-radius:8px;
  color:#cbd7ed;
  font-size:11px;
}

/* START */

.start{
  padding:25px 15px;
  text-align:center;
}

.start h2{
  font-size:20px;
}

.start p{
  color:#aab8d5;
  font-size:13px;
  margin-top:6px;
}

.primary{
  border:0;
  color:white;
  font-weight:bold;
  padding:11px 23px;
  margin-top:15px;
  border-radius:22px;
  background:linear-gradient(135deg,#00bfff,#7040e8,#ed2cae);
}

/* QUIZ */

.quiz{
  display:none;
  padding:17px;
  margin-bottom:20px;
}

.quiz-top{
  display:flex;
  justify-content:space-between;
  color:#cbd7ed;
  font-size:12px;
}

.progress{
  height:6px;
  margin-top:9px;
  background:#0006;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00e5ff,#ff36c9);
  transition:.25s;
}

.question-number{
  color:#67eaff;
  font-size:12px;
  font-weight:bold;
  margin-top:13px;
}

.question{
  font-size:18px;
  font-weight:bold;
  line-height:1.5;
  margin:9px 0 14px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.answer{
  border:1px solid #ffffff16;
  background:#ffffff08;
  color:white;
  padding:12px;
  border-radius:11px;
  text-align:left;
  font-size:13px;
}

.answer:hover{
  background:#ffffff13;
}

.answer.correct{
  background:#16a34acc;
  border-color:#4ade80;
}

.answer.wrong{
  background:#dc2626cc;
  border-color:#fb7185;
}

.feedback{
  min-height:22px;
  margin:10px 0;
  font-size:13px;
  font-weight:bold;
}

.next{
  display:none;
  border:0;
  padding:9px 17px;
  border-radius:18px;
  font-weight:bold;
}

/* INPUT */

.input{
  width:100%;
  border:1px solid #ffffff20;
  outline:none;
  padding:12px;
  border-radius:11px;
  background:#0005;
  color:white;
  font-size:14px;
}

.input:focus{
  border-color:#00d9ff;
}

.check{
  border:0;
  margin-top:9px;
  padding:9px 17px;
  border-radius:18px;
  color:white;
  background:#009ed4;
  font-weight:bold;
}

/* DRAG */

.drag-title{
  color:#aebbd7;
  font-size:12px;
  margin-bottom:7px;
}

.word-area,
.drop-area{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  min-height:55px;
  padding:9px;
  border-radius:11px;
  margin-bottom:8px;
}

.word-area{
  background:#0004;
  border:1px dashed #ffffff20;
}

.drop-area{
  border:1px dashed #00e5ff77;
  background:#00e5ff08;
}

.word{
  padding:8px 10px;
  border-radius:8px;
  background:linear-gradient(135deg,#7040e8,#e82eae);
  font-size:12px;
  font-weight:bold;
  cursor:grab;
  user-select:none;
}

/* RESULT */

.result{
  display:none;
  text-align:center;
  padding:15px 0 5px;
}

.result-score{
  font-size:48px;
  font-weight:bold;
  color:#ffe66d;
  margin:8px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px;
  color:#667596;
  font-size:11px;
}

@media(max-width:650px){

  header h1{
    font-size:28px;
  }

  .main-menu{
    grid-template-columns:repeat(3,1fr);
  }

  .main-menu button{
    font-size:10px;
  }

  .grammar-tabs{
    grid-template-columns:repeat(3,1fr);
  }

  .answers{
    grid-template-columns:1fr;
  }

  .question{
    font-size:16px;
  }
}
</style>
</head>

/* =====================================================
   TẠO 100 CÂU MỖI THÌ
===================================================== */

function buildMC(tense){

  const base=questionBanks[tense];

  let result=[];

  for(let i=0;i<100;i++){

    const item=base[i%base.length];

    let options=[...item[2]];

    options.sort(()=>Math.random()-0.5);

    result.push({
      question:item[0],
      answer:item[1],
      options:options
    });
  }

  return result;
}

/* =====================================================
   BIẾN
===================================================== */

let mode="quiz";
let tense="past";

let gameData=[];
let current=0;
let score=0;

let draggedWord=null;


/* =====================================================
   CHỌN MODE
===================================================== */

function setMode(newMode,button){

  mode=newMode;

  document
    .querySelectorAll(".main-menu button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("start").style.display="block";
  document.getElementById("quiz").style.display="none";

  if(mode==="quiz"){
    document.getElementById("startTitle").textContent="🎯 Trắc nghiệm";
    document.getElementById("startDescription").textContent=
      "100 câu trắc nghiệm theo thì đang chọn.";
  }

  if(mode==="verb"){
    document.getElementById("startTitle").textContent="✏️ Chia động từ";
    document.getElementById("startDescription").textContent=
      "50 câu — tự nhập dạng đúng của động từ.";
  }

  if(mode==="join"){
    document.getElementById("startTitle").textContent="🔗 Nối câu";
    document.getElementById("startDescription").textContent=
      "50 câu — kéo thả hoặc bấm các từ để sắp xếp.";
  }
}


/* =====================================================
   CHỌN THÌ
===================================================== */

function setTense(newTense,button){

  tense=newTense;

  document
    .querySelectorAll(".grammar-tabs button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("lesson").innerHTML=
    lessons[tense];

  document.getElementById("lesson")
    .classList.add("show");

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  current=0;
  score=0;

  if(mode==="quiz"){
    gameData=buildMC(tense);
  }

  if(mode==="verb"){
    gameData=[...verbQuestions];
  }

  if(mode==="join"){
    gameData=[...joinQuestions];
  }

  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";

  document.getElementById("score").textContent="0";

  document.getElementById("result").style.display="none";

  document.getElementById("question").style.display="block";
  document.getElementById("questionNumber").style.display="block";
  document.getElementById("feedback").style.display="block";

  renderQuestion();
}


/* =====================================================
   RENDER
===================================================== */

function renderQuestion(){

  const total=gameData.length;

  document.getElementById("questionNumber").textContent=
    `Câu ${current+1} / ${total}`;

  document.getElementById("progressBar").style.width=
    `${current/total*100}%`;

  document.getElementById("feedback").textContent="";
  document.getElementById("nextButton").style.display="none";

  document.getElementById("answers").style.display="none";
  document.getElementById("verbBox").style.display="none";
  document.getElementById("joinBox").style.display="none";


  /* MC */

  if(mode==="quiz"){

    const q=gameData[current];

    document.getElementById("question").textContent=q.question;

    document.getElementById("answers").style.display="grid";

    const box=document.getElementById("answers");

    box.innerHTML="";

    q.options.forEach((option,i)=>{

      const button=document.createElement("button");

      button.className="answer";

      button.textContent=
        `${String.fromCharCode(65+i)}. ${option}`;

      button.onclick=()=>answerMC(option,button);

      box.appendChild(button);

    });
  }


  /* VERB */

  if(mode==="verb"){

    document.getElementById("question").textContent=
      gameData[current][0];

    document.getElementById("verbBox").style.display="block";

    document.getElementById("verbInput").value="";
    document.getElementById("verbInput").disabled=false;
  }


  /* JOIN */

  if(mode==="join"){

    document.getElementById("question").textContent=
      "Sắp xếp các từ thành câu đúng:";

    document.getElementById("joinBox").style.display="block";

    setupJoin(gameData[current]);

  }

}


/* =====================================================
   MC
===================================================== */

function answerMC(selected,button){

  const q=gameData[current];

  document
    .querySelectorAll(".answer")
    .forEach(b=>b.disabled=true);

  if(selected===q.answer){

    score++;

    button.classList.add("correct");

    document.getElementById("feedback").textContent=
      "🎉 Chính xác!";
  }
  else{

    button.classList.add("wrong");

    document
      .querySelectorAll(".answer")
      .forEach(b=>{
        if(b.textContent.includes(q.answer)){
          b.classList.add("correct");
        }
      });

    document.getElementById("feedback").textContent=
      "❌ Sai! Đáp án đúng: "+q.answer;
  }

  document.getElementById("score").textContent=score;

  document.getElementById("nextButton").style.display="inline-block";
}


/* =====================================================
   VERB
===================================================== */

function checkVerb(){

  const input=
    document.getElementById("verbInput")
    .value
    .trim()
    .toLowerCase();

  const correct=
    gameData[current][1]
    .toLowerCase();

  document.getElementById("verbInput").disabled=true;

  if(input===correct){

    score++;

    document.getElementById("feedback").textContent=
      "🎉 Chính xác!";
  }
  else{

    document.getElementById("feedback").textContent=
      "❌ Đáp án đúng: "+gameData[current][1];
  }

  document.getElementById("score").textContent=score;

  document.getElementById("nextButton").style.display="inline-block";
}


/* =====================================================
   JOIN SETUP
===================================================== */

function setupJoin(sentence){

  const words=sentence
    .split(" / ")
    .sort(()=>Math.random()-.5);

  const wordArea=document.getElementById("wordArea");
  const dropArea=document.getElementById("dropArea");

  wordArea.innerHTML="";
  dropArea.innerHTML="";

  words.forEach(word=>{

    const el=document.createElement("div");

    el.className="word";
    el.textContent=word;
    el.draggable=true;

    el.addEventListener("dragstart",()=>{
      draggedWord=el;
    });

    el.addEventListener("click",()=>{
      dropArea.appendChild(el);
    });

    wordArea.appendChild(el);

  });

  dropArea.ondragover=e=>{
    e.preventDefault();
  };

  dropArea.ondrop=e=>{

    e.preventDefault();

    if(draggedWord){
      dropArea.appendChild(draggedWord);
    }
  };
}


/* =====================================================
   CHECK JOIN
===================================================== */

function checkJoin(){

  const answer=
    [...document.getElementById("dropArea").children]
      .map(x=>x.textContent)
      .join(" ");

  const correct=gameData[current];

  if(answer.toLowerCase()===correct.toLowerCase()){

    score++;

    document.getElementById("feedback").textContent=
      "🎉 Chính xác!";
  }
  else{

    document.getElementById("feedback").textContent=
      "❌ Chưa đúng! Đáp án: "+correct;
  }

  document.getElementById("score").textContent=score;

  document.getElementById("nextButton").style.display="inline-block";
}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

  current++;

  if(current>=gameData.length){

    finishGame();

    return;
  }

  renderQuestion();
}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

  document.getElementById("question").style.display="none";
  document.getElementById("questionNumber").style.display="none";
  document.getElementById("answers").style.display="none";
  document.getElementById("verbBox").style.display="none";
  document.getElementById("joinBox").style.display="none";
  document.getElementById("feedback").style.display="none";
  document.getElementById("nextButton").style.display="none";

  document.getElementById("progressBar").style.width="100%";

  document.getElementById("result").style.display="block";

  document.getElementById("finalScore").textContent=
    `${score} / ${gameData.length}`;

  const percent=
    score/gameData.length*100;

  let text;

  if(percent>=90)
    text="🏆 Xuất sắc!";

  else if(percent>=80)
    text="🔥 Rất tốt!";

  else if(percent>=60)
    text="👍 Khá tốt!";

  else if(percent>=40)
    text="💪 Hãy luyện tập thêm!";

  else
    text="📚 Ôn lại bài rồi thử lại nhé!";

  document.getElementById("resultText").textContent=text;
}


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

setTense(
  "past",
  document.querySelector(".grammar-tabs button")
);

</script>
