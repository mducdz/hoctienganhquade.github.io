<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#060912;
    --panel:#0d1424;
    --panel2:#111a2e;
    --border:#202c45;
    --text:#f5f7ff;
    --muted:#8794b2;
    --cyan:#21d4fd;
    --purple:#7857ff;
    --pink:#ed4bba;
    --green:#35e58b;
    --red:#ff5368;
    --yellow:#ffe66d;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 10% 0%,#14255b55,transparent 30%),
        radial-gradient(circle at 90% 10%,#65236b33,transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:250px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    padding:18px 13px;
    background:#080e1cdd;
    backdrop-filter:blur(20px);
    border-right:1px solid var(--border);
    z-index:20;
    overflow:auto;
}

.brand{
    padding:10px 10px 18px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border);
}

.brand-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:.5px;
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink)
    );
    -webkit-background-clip:text;
    color:transparent;
}

.brand-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.section-title{
    color:#53617e;
    font-size:10px;
    font-weight:800;
    margin:18px 9px 6px;
    letter-spacing:1px;
}

.nav{
    width:100%;
    border:0;
    background:transparent;
    color:#9ba8c5;
    padding:12px;
    border-radius:11px;
    text-align:left;
    margin:3px 0;
    transition:.15s;
}

.nav:hover{
    background:#ffffff09;
    color:white;
}

.nav.active{
    color:white;
    background:
        linear-gradient(
            90deg,
            #21d4fd18,
            #7857ff16
        );
    border:1px solid #21d4fd25;
    box-shadow:0 8px 25px #0003;
}

/* ================= MAIN ================= */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;
    padding:24px;
}

.topbar{
    max-width:1100px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.page-title{
    font-size:25px;
    font-weight:850;
}

.score-pill{
    display:flex;
    align-items:center;
    gap:7px;
    background:#111a2c;
    border:1px solid var(--border);
    padding:9px 15px;
    border-radius:999px;
    box-shadow:0 8px 25px #0003;
}

.score-pill span{
    color:var(--yellow);
    font-weight:800;
}

.page{
    max-width:1100px;
    margin:auto;
}

/* ================= CARDS ================= */

.card{
    background:
        linear-gradient(
            145deg,
            #111a2d,
            #0b1221
        );
    border:1px solid var(--border);
    border-radius:18px;
    padding:21px;
    margin-bottom:15px;
    box-shadow:
        0 15px 45px #0003,
        inset 0 1px #ffffff04;
}

.hero{
    position:relative;
    overflow:hidden;
    padding:45px 25px;
    text-align:center;
}

.hero:before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:#21d4fd18;
    filter:blur(80px);
    border-radius:50%;
    top:-100px;
    left:-80px;
}

.hero:after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:#ed4bba14;
    filter:blur(80px);
    border-radius:50%;
    right:-100px;
    bottom:-120px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-icon{
    font-size:65px;
}

.hero h1{
    font-size:38px;
    margin:10px 0;
    background:linear-gradient(
        90deg,
        #fff,
        #7deaff,
        #b899ff
    );
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#98a6c5;
    line-height:1.7;
    max-width:650px;
    margin:0 auto 20px;
}

h2{
    margin-top:0;
}

.muted{
    color:var(--muted);
    line-height:1.7;
}

/* ================= BUTTON ================= */

.primary,
.secondary{
    border-radius:11px;
    padding:11px 16px;
    border:0;
    transition:.15s;
    margin:3px;
}

.primary{
    color:white;
    font-weight:700;
    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple),
            var(--pink)
        );
    box-shadow:0 8px 25px #7857ff25;
}

.primary:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.secondary{
    color:#dce4f6;
    background:#ffffff08;
    border:1px solid #2b3854;
}

.secondary:hover{
    background:#ffffff10;
}

/* ================= GRID ================= */

.topic-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.topic{
    border:1px solid var(--border);
    border-radius:15px;
    background:#ffffff04;
    padding:18px;
    cursor:pointer;
    transition:.18s;
}

.topic:hover{
    transform:translateY(-3px);
    border-color:#21d4fd66;
    background:#21d4fd08;
}

.topic-icon{
    font-size:38px;
}

.topic h3{
    margin:9px 0 4px;
}

.topic p{
    color:var(--muted);
    font-size:12px;
}

/* ================= LEVEL ================= */

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.level{
    padding:20px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#ffffff04;
    cursor:pointer;
    transition:.18s;
}

.level:hover{
    transform:translateY(-3px);
}

.level-icon{
    font-size:35px;
}

.level h3{
    margin:9px 0 5px;
}

.level p{
    color:var(--muted);
    font-size:12px;
}

.level.easy:hover{
    border-color:#35e58b66;
}

.level.medium:hover{
    border-color:#21d4fd66;
}

.level.hard:hover{
    border-color:#ff9c4a66;
}

.level.expert:hover{
    border-color:#ff536866;
}

/* ================= VOCAB ================= */

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.vocab-card{
    padding:15px;
    border-radius:13px;
    border:1px solid var(--border);
    background:#ffffff04;
}

.vocab-card:hover{
    border-color:#21d4fd55;
}

.vocab-emoji{
    font-size:38px;
}

.vocab-word{
    font-weight:800;
    margin-top:7px;
}

.vocab-meaning{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* ================= QUIZ ================= */

.quiz-header{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
}

.progress{
    height:7px;
    background:#050912;
    border-radius:20px;
    overflow:hidden;
    margin:12px 0 22px;
}

.progress-bar{
    height:100%;
    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),
            var(--pink)
        );
}

.quiz-image{
    height:230px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#070c18;
    border:1px solid var(--border);
    border-radius:15px;
    margin-bottom:18px;
}

.quiz-image span{
    font-size:100px;
}

.question{
    text-align:center;
    font-size:22px;
    font-weight:850;
    margin:15px 0;
}

.question small{
    display:block;
    color:var(--muted);
    font-size:13px;
    font-weight:normal;
    margin-top:8px;
}

.input{
    width:100%;
    border:1px solid #2a3855;
    border-radius:11px;
    padding:13px;
    background:#070c18;
    color:white;
    outline:none;
}

.input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px #21d4fd10;
}

.feedback{
    min-height:24px;
    margin:13px 0;
    font-weight:700;
}

.correct{
    border-color:var(--green)!important;
    background:#35e58b12!important;
}

.wrong{
    border-color:var(--red)!important;
    background:#ff536812!important;
}

/* ================= MATCH ================= */

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.match-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:9px;
}

.match-item{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:60px;
    padding:10px;
    margin-bottom:8px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#ffffff04;
    cursor:pointer;
    transition:.12s;
}

.match-item:hover{
    background:#ffffff09;
}

.match-item.selected{
    border-color:var(--cyan);
    background:#21d4fd10;
}

.match-emoji{
    width:45px;
    text-align:center;
    font-size:30px;
}

/* ================= RESULT ================= */

.result{
    text-align:center;
    padding:45px 20px;
}

.result-icon{
    font-size:65px;
}

.result-score{
    font-size:55px;
    font-weight:900;
    color:var(--yellow);
    margin:12px;
}

/* ================= AUTH ================= */

.auth-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-card{
    width:430px;
    max-width:100%;
    padding:30px;
}

.auth-logo{
    text-align:center;
    font-size:55px;
}

.auth-title{
    text-align:center;
    font-size:29px;
    margin:10px 0;
}

.auth-sub{
    color:var(--muted);
    text-align:center;
    font-size:13px;
    margin-bottom:22px;
}

.auth-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:15px;
}

.auth-tabs button{
    margin:0;
}

.auth-form{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.auth-error{
    color:#ff6b7d;
    min-height:20px;
    font-size:13px;
}

/* ================= ACCOUNT ================= */

.profile{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:60px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple)
    );
    font-size:27px;
}

.profile-name{
    font-size:21px;
    font-weight:850;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    padding:18px;
    background:#ffffff05;
    border:1px solid var(--border);
    border-radius:13px;
}

.stat-number{
    font-size:25px;
    font-weight:900;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
    border:1px solid var(--border);
    background:#ffffff08;
    color:white;
    padding:8px 11px;
    border-radius:9px;
}

@media(max-width:1000px){

    .topic-grid,
    .level-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .vocab-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){

    .sidebar{
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:14px;
    }

    .mobile-menu{
        display:block;
    }

    .page-title{
        font-size:19px;
    }

    .vocab-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .match-grid{
        grid-template-columns:1fr;
    }

    .stat-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:480px){

    .topic-grid,
    .level-grid{
        grid-template-columns:1fr 1fr;
    }

    .hero h1{
        font-size:29px;
    }

    .card{
        padding:15px;
    }
}
</style>

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function escapeHTML(str){
    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {data,error} =
        await supabaseClient.auth.getSession();

    if(error){
        console.error(error);
        return null;
    }

    return data.session?.user || null;
}


async function loadProfile(){

    const user=await getCurrentUser();

    if(!user){
        profile=null;
        return null;
    }

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();

    if(error){
        console.error(error);
        return null;
    }

    profile=data;

    globalScore=data?.score || 0;

    return profile;
}


async function registerUser(){

    const username=
        document.getElementById("regUser").value.trim();

    const password=
        document.getElementById("regPass").value;

    const errorBox=
        document.getElementById("authError");

    errorBox.textContent="";

    if(username.length<3){
        errorBox.textContent=
        "Tên tài khoản phải có ít nhất 3 ký tự.";
        return;
    }

    if(password.length<6){
        errorBox.textContent=
        "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    const email=
        username.toLowerCase()+"@hocenglish.local";

    const {data,error}=
        await supabaseClient.auth.signUp({
            email,
            password
        });

    if(error){
        errorBox.textContent=error.message;
        return;
    }

    if(!data.user){
        errorBox.textContent=
        "Không thể tạo tài khoản.";
        return;
    }

    if(!data.session){

        errorBox.innerHTML=
        "Tài khoản đã tạo. Nếu chưa vào được web, hãy tắt <b>Email confirmation</b> trong Supabase Auth.";

        return;
    }

    const {data:created,error:profileError}=
        await supabaseClient
        .from("profiles")
        .insert({
            id:data.user.id,
            username,
            score:0,
            level:"easy"
        })
        .select()
        .single();

    if(profileError){

        console.error(profileError);

        errorBox.textContent=
        "Auth đã tạo nhưng profile chưa tạo được: "
        +profileError.message;

        return;
    }

    profile=created;
    globalScore=0;

    renderApp();
}


async function loginUser(){

    const username=
        document.getElementById("loginUser").value.trim();

    const password=
        document.getElementById("loginPass").value;

    const errorBox=
        document.getElementById("authError");

    errorBox.textContent="";

    if(!username || !password){
        errorBox.textContent=
        "Nhập đầy đủ tài khoản và mật khẩu.";
        return;
    }

    const email=
        username.toLowerCase()+"@hocenglish.local";

    const {data,error}=
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if(error){
        errorBox.textContent=
        "Sai tài khoản hoặc mật khẩu.";
        return;
    }

    await loadProfile();

    if(!profile){

        errorBox.textContent=
        "Đăng nhập được nhưng không tìm thấy profile.";

        return;
    }

    renderApp();
}


async function logoutUser(){

    await supabaseClient.auth.signOut();

    profile=null;
    globalScore=0;

    renderAuth();
}

async function addScore(points){

    globalScore+=points;

    updateScore();

    if(!profile)return;

    const {error}=
        await supabaseClient
        .from("profiles")
        .update({
            score:globalScore
        })
        .eq("id",profile.id);

    if(error){
        console.error(error);
    }

    profile.score=globalScore;
}

    </div>
    `;

    document
    .getElementById("answerInput")
    .focus();
}


async function checkWrite(){

    const item=currentData[quizIndex];

    const input=
        document.getElementById("answerInput");

    const value=
        input.value.trim().toLowerCase();

    input.disabled=true;

    document.getElementById("checkBtn").disabled=true;

    if(value===item[0].toLowerCase()){

        quizScore+=10;

        await addScore(10);

        document.getElementById(
            "quizFeedback"
        ).innerHTML=
        "🎉 Chính xác! +10 điểm";

        input.classList.add("correct");

    }else{

        document.getElementById(
            "quizFeedback"
        ).innerHTML=
        "❌ Đáp án đúng: <b>"+
        escapeHTML(item[0])+
        "</b>";

        input.classList.add("wrong");
    }

    document.getElementById(
        "nextBtn"
    ).style.display="inline-block";
}


function nextWrite(){

    quizIndex++;

    if(quizIndex>=10){

        showRound2Intro();

        return;
    }

    renderWriteQuiz();
}


/* =========================================================
   QUIZ 2
========================================================= */

function showRound2Intro(){

    setTitle("🔗 Quiz nối từ");

    document.getElementById("page").innerHTML=`

    <div class="card result">

        <div class="result-icon">
            🧠
        </div>

        <h2>
            Hoàn thành Quiz 1!
        </h2>

        <div class="result-score">
            ${quizScore}/100
        </div>

        <p class="muted">
            Quiz 2: nối hình ảnh với từ tiếng Anh.
        </p>

        <button
        class="primary"
        onclick="startMatching()">

            🔗 Bắt đầu Quiz nối từ

        </button>

    </div>
    `;
}


function startMatching(){

    selectedImage=null;
    selectedWord=null;

    const images=shuffle(currentData);
    const words=shuffle(currentData);

    setTitle("🔗 Quiz nối từ");

    document.getElementById("page").innerHTML=`

    <div class="card">

        <div class="quiz-header">

            <span>
                🔗 Quiz 2
            </span>

            <span>
                10 cặp
            </span>

        </div>

        <div class="match-grid">

            <div>

                <div class="match-title">
                    🖼️ Hình ảnh
                </div>

                <div id="imageList">

                ${images.map(item=>`

                    <div
                    class="match-item"
                    data-id="${escapeHTML(item[0])}"
                    onclick="selectImage(this)">

                        <div class="match-emoji">
                            ${item[2]}
                        </div>

                        <span>
                            Hình ảnh
                        </span>

                    </div>

                `).join("")}

                </div>

            </div>

            <div>

                <div class="match-title">
                    🇬🇧 Từ tiếng Anh
                </div>

                <div id="wordList">

                ${words.map(item=>`

                    <div
                    class="match-item"
                    data-id="${escapeHTML(item[0])}"
                    onclick="selectWord(this)">

                        ${escapeHTML(item[0])}

                    </div>

                `).join("")}

                </div>

            </div>

        </div>

        <div
        id="matchFeedback"
        class="feedback">
        </div>

    </div>
    `;
}


function selectImage(el){

    document
    .querySelectorAll("#imageList .match-item")
    .forEach(x=>
        x.classList.remove("selected")
    );

    el.classList.add("selected");

    selectedImage=el;

    tryMatch();
}


function selectWord(el){

    document
    .querySelectorAll("#wordList .match-item")
    .forEach(x=>
        x.classList.remove("selected")
    );

    el.classList.add("selected");

    selectedWord=el;

    tryMatch();
}


async function tryMatch(){

    if(!selectedImage || !selectedWord){
        return;
    }

    const imageId=
        selectedImage.dataset.id;

    const wordId=
        selectedWord.dataset.id;

    if(imageId===wordId){

        selectedImage.style.display="none";
        selectedWord.style.display="none";

        quizScore+=10;

        await addScore(10);

        document.getElementById(
            "matchFeedback"
        ).innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        document.getElementById(
            "matchFeedback"
        ).innerHTML=
        "❌ Hai lựa chọn chưa khớp.";

    }

    selectedImage=null;
    selectedWord=null;

    document
    .querySelectorAll(".match-item")
    .forEach(x=>
        x.classList.remove("selected")
    );

    checkMatchingFinished();
}


function checkMatchingFinished(){

    const left=[
        ...document.querySelectorAll(
            "#imageList .match-item"
        )
    ].filter(x=>x.style.display!=="none");

    if(left.length===0){

        setTimeout(
            showResult,
            500
        );
    }
}

        <div class="result-score">

        </p>

        <button
        class="primary"
        onclick="
        startVocab(

            🔄 Làm lại

        </button>

        <button
        class="secondary"
        onclick="
        chooseLevel(
            '${currentTopic}'
        )">

            📊 Đổi cấp độ

        </button>

    </div>
    `;
}

async function init(){

    const user=
        await getCurrentUser();

    if(user){

        await loadProfile();

        if(profile){

            renderApp();

            return;
        }
    }

    renderAuth();
}


supabaseClient.auth.onAuthStateChange(
    async (event,session)=>{

        if(event==="SIGNED_OUT"){
            profile=null;
            globalScore=0;
        }

    }
);


init();
