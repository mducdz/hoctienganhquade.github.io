<script>

/* =====================================================

const SUPABASE_URL =
"https://bfrdyblmhxftenhipeft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u704DIAbYElFlahcAcHLzQ_JTt4KTEX";

const supabaseClient =
window.supabase.createClient(

/* =====================================================
   GLOBAL
===================================================== */

let currentProfile = null;
let globalScore = 0;

let vocabLevel = "";

/* =====================================================
   UTILITY
===================================================== */

function $(id){
    return document.getElementById(id);
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function shuffle(array){
    return [...array].sort(
        () => Math.random() - .5
    );
}

function toast(message){
    const box = $("toast");

    box.textContent = message;
    box.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(
            () => box.classList.remove("show"),
            2800
        );
}

function codePoints(str){
    return [...str]
        .map(c => c.codePointAt(0).toString(16))
        .join("-");
}

function emojiImage(emoji){
    return (
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
        + codePoints(emoji)
        + ".png"
    );
}


/* =====================================================
   AUTH
===================================================== */

function renderLogin(){

    $("authForm").innerHTML = `
        <input
            id="loginEmail"
            class="input"
            type="email"
            placeholder="Email">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Mật khẩu">

        <div id="authError" class="auth-error"></div>

        <button
            id="loginBtn"
            class="primary full"
            onclick="login()">
            🔐 Đăng nhập
        </button>

        <br><br>

        <button
            class="secondary full"
            onclick="renderRegister()">
            📝 Tạo tài khoản
        </button>
    `;
}


function renderRegister(){

    $("authForm").innerHTML = `
        <input
            id="registerUsername"
            class="input"
            placeholder="Tên người dùng">

        <input
            id="registerEmail"
            class="input"
            type="email"
            placeholder="Email">

        <input
            id="registerPassword"
            class="input"
            type="password"
            placeholder="Mật khẩu">

        <div id="authError" class="auth-error"></div>

        <button
            id="registerBtn"
            class="primary full"
            onclick="register()">
            📝 Đăng ký
        </button>

        <br><br>

        <button
            class="secondary full"
            onclick="renderLogin()">
            🔐 Đã có tài khoản
        </button>
    `;
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const username =
        $("registerUsername").value.trim();

    const email =
        $("registerEmail").value.trim();

    const password =
        $("registerPassword").value;

    const error =
        $("authError");

    error.textContent = "";

    if(username.length < 3){
        error.textContent =
            "Tên người dùng phải có ít nhất 3 ký tự.";
        return;
    }

    if(!email.includes("@")){
        error.textContent =
            "Email không hợp lệ.";
        return;
    }

    if(password.length < 6){
        error.textContent =
            "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    $("registerBtn").disabled = true;

    const {
        data,
        error: signError
    } =
    await supabaseClient.auth.signUp({
        email:email,
        password:password,
        options:{
            data:{
                username:username
            }
        }
    });

    $("registerBtn").disabled = false;

    if(signError){
        error.textContent =
            signError.message;
        return;
    }

    if(!data.user){
        error.textContent =
            "Không tạo được tài khoản.";
        return;
    }

    /*
       Profile được tạo bởi trigger Supabase.
       Không insert profile trực tiếp nữa.
    */

    if(data.session){

        await loadProfile();

    }else{

        error.textContent =
            "Đăng ký thành công! Hãy xác nhận email rồi đăng nhập.";
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        $("loginEmail").value.trim();

    const password =
        $("loginPassword").value;

    const error =
        $("authError");

    error.textContent = "";

    if(!email || !password){
        error.textContent =
            "Hãy nhập email và mật khẩu.";
        return;
    }

    $("loginBtn").disabled = true;

    const {
        error:loginError
    } =
    await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
    });

    $("loginBtn").disabled = false;

    if(loginError){
        error.textContent =
            loginError.message;
        return;
    }

    await loadProfile();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentProfile = null;
    globalScore = 0;

    $("app").classList.add("hidden");
    $("authScreen").classList.remove("hidden");

    renderLogin();
}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();

    if(!user){
        renderLogin();
        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();

    if(error){

        console.error(error);

        $("authError").textContent =
            "Không đọc được profile: "
            + error.message;

        return;
    }

    if(!data){

        $("authError").textContent =
            "Profile chưa được tạo. Hãy đăng xuất rồi đăng ký lại.";

        return;
    }

    currentProfile = data;

    globalScore =
        Number(data.score || 0);

    renderApp();
}

   APP
===================================================== */

    $("authScreen").classList.add("hidden");

    $("app").innerHTML = `

                <div class="title">TỪ VỰNG</div>

            <main class="main">

                    </button>

                    <h2 id="pageTitle">

                    </h2>

                    <div class="score">

                        <b id="globalScore">
                            ${globalScore}
                        </b>
                    </div>

                </div>

                <div id="page" class="page"></div>

            </main>

    `;

    home(
        document.querySelector(".nav")

}


/* =====================================================
   NAV
===================================================== */

function activeNone(){

    document
        .querySelectorAll(".nav")
        .forEach(
            x => x.classList.remove("active")
        );
}

function setTitle(title){
    $("pageTitle").textContent = title;
}

function toggleMenu(){
    $("sidebar").classList.toggle("open");
}


/* =====================================================
   SCORE
===================================================== */

async function addGlobal(points){

    globalScore += points;

    $("globalScore").textContent =
        globalScore;

    if(!currentProfile){
        return;
    }

    currentProfile.score =
        globalScore;

    const {
        error
    } =
    await supabaseClient
        .from("profiles")
        .update({
            score:globalScore
        })
        .eq("id",currentProfile.id);

    if(error){
        console.error(error);
        toast("Không lưu được điểm.");
    }
}

/* =====================================================

===================================================== */

const lessons = {

past:{
name:"Quá khứ đơn",
icon:"⏪",

    $("page").innerHTML = `

                </span>

            </div>

            <input
                id="vocabInput"
                class="input"
                placeholder="Nhập từ tiếng Anh..."
                autocomplete="off">

            <div id="feedback" class="feedback"></div>

            <button
                id="checkButton"
                class="primary"
                onclick="checkVocabWrite()">
                ✓ Kiểm tra
            </button>

            <button
                id="nextButton"
                class="primary"
                style="display:none"
                onclick="nextVocabWrite()">
                Tiếp theo →
            </button>

        </div>
    `;
}


async function checkVocabWrite(){

    const item =
        vocabData[vocabIndex];

    const input =
        $("vocabInput");

    const value =
        input.value.trim().toLowerCase();

    input.disabled = true;
    $("checkButton").disabled = true;

    if(value === item[0].toLowerCase()){

        vocabScore += 10;

        await addGlobal(10);

        $("feedback").innerHTML =
            "🎉 Chính xác! +10 điểm";

    }else{

        $("feedback").innerHTML =
            "❌ Đáp án đúng: <b>"
            + escapeHTML(item[0])
            + "</b>";
    }

    $("nextButton").style.display =
        "inline-block";
}


function nextVocabWrite(){

    vocabIndex++;

    if(vocabIndex >= 10){
        showRound2Intro();
        return;
    }

    renderVocabWrite();
}

===================================================== */

function startMatching(){

    const images =
        shuffle(vocabData);

    const words =
        shuffle(vocabData);

    selectedImage = null;
    selectedWord = null;

    setTitle("🔗 Nối ảnh với từ");

    $("page").innerHTML = `

        <div class="card">

            <div class="match-grid">

                <div>

                    <h3>🖼️ Hình ảnh</h3>

                    <div id="imageList">

                        ${
                            images.map(
                                item => `
                                    <div
                                        class="match-item"
                                        data-id="${escapeHTML(item[0])}"
                                        onclick="selectImage(this,${JSON.stringify(item[0])})">

                                        <img
                                            class="match-img"
                                            src="${emojiImage(item[2])}"
                                            onerror="
                                                this.style.display='none'
                                            ">
                                    </div>
                                `
                            ).join("")
                        }

                    </div>

                </div>

                <div>

                    <h3>🇬🇧 Từ tiếng Anh</h3>

                    <div id="wordList">

                        ${
                            words.map(
                                item => `
                                    <div
                                        class="match-item"
                                        data-id="${escapeHTML(item[0])}"
                                        onclick="selectWord(this,${JSON.stringify(item[0])})">

                                        ${escapeHTML(item[0])}

                                    </div>
                                `
                            ).join("")
                        }

                    </div>

                </div>

            </div>

            <div
                id="matchFeedback"
                class="feedback">
            </div>

        </div>
    `;
}


function selectImage(el,id){

    document
        .querySelectorAll(
            "#imageList .match-item"
        )
        .forEach(
            x => x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedImage = {
        el:el,
        id:id
    };

    tryMatch();
}


function selectWord(el,id){

    document
        .querySelectorAll(
            "#wordList .match-item"
        )
        .forEach(
            x => x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedWord = {
        el:el,
        id:id
    };

    tryMatch();
}


async function tryMatch(){

    if(
        !selectedImage ||
        !selectedWord
    ){
        return;
    }

    if(
        selectedImage.id ===
        selectedWord.id
    ){

        selectedImage.el.style.display =
            "none";

        selectedWord.el.style.display =
            "none";

        vocabScore += 10;

        await addGlobal(10);

        $("matchFeedback").innerHTML =
            "🎉 Đúng! +10 điểm";

    }else{

        $("matchFeedback").innerHTML =
            "❌ Chưa đúng.";
    }

    selectedImage = null;
    selectedWord = null;

    document
        .querySelectorAll(".match-item")
        .forEach(
            x => x.classList.remove("selected")
        );

    checkMatchingFinished();
}


function checkMatchingFinished(){

    const remaining =
        [
            ...document.querySelectorAll(
                "#imageList .match-item"
            )
        ]
        .filter(
            x =>
            x.style.display !== "none"
        );

    if(remaining.length === 0){

        setTimeout(
            showVocabResult,
            500
        );
    }
}


/* =====================================================
   RESULT
===================================================== */

    const percent =
        Math.round(
            vocabScore / 200 * 100

    const names = {

        medium:"🔵 Trung bình",
        hard:"🟠 Khó",
        expert:"🔴 Siêu khó"
    };

    setTitle("🏆 Kết quả");

    $("page").innerHTML = `

        <div class="card result">

            <div style="font-size:60px">🏆</div>

            <h2>Hoàn thành!</h2>

            <p>
                ${vocab[vocabTopic].name}
                -
                ${names[vocabLevel]}
            </p>

            <div class="result-score">
                ${vocabScore}/200
            </div>

            <p class="muted">
                Độ chính xác:
                ${percent}%
            </p>

            <button
                class="primary"
                onclick="
                    startVocab(
                        '${vocabTopic}',
                        '${vocabLevel}'
                    )

                🔄 Làm lại

            <button

}

/* =====================================================
   ADMIN
===================================================== */

        currentProfile.role !== "admin"

    }

    activeNone();

    if(btn){
        btn.classList.add("active");

    setTitle("🛡️ Quản lý người dùng");

    $("page").innerHTML = `
        <div class="card">
            <h2>🛡️ Quản lý người dùng</h2>
            <p class="muted">Đang tải...</p>
        </div>
    `;

    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "admin_get_profiles"

/* =====================================================
   CHANGE ROLE
===================================================== */

async function changeRole(userId,newRole){

    if(
        !currentProfile ||
        currentProfile.role !== "admin"
    ){
        toast("Không có quyền.");
        return;
    }

    if(
        userId === currentProfile.id &&
        newRole !== "admin"
    ){
        toast("Không thể tự hạ quyền Admin.");
        return;
    }

    if(
        !confirm(
            "Đổi quyền tài khoản này thành "
            + newRole
            + "?"
        )
    ){
        return;
    }

    const {
        error
    } =
    await supabaseClient.rpc(
        "admin_change_role",
        {
            target_id:userId,
            new_role:newRole
        }
    );

    if(error){
        toast("Lỗi: " + error.message);
        return;
    }

    toast("Đã cập nhật role.");

    await adminPage();
}


/* =====================================================
   RESET SCORE
===================================================== */

async function resetScore(userId){

    if(
        !currentProfile ||
        currentProfile.role !== "admin"
    ){
        return;
    }

    if(
        !confirm(
            "Reset điểm tài khoản này về 0?"
        )
    ){
        return;
    }

    const {
        error
    } =
    await supabaseClient.rpc(
        "admin_reset_score",
        {
            target_id:userId
        }
    );

    if(error){
        toast("Lỗi: " + error.message);
        return;
    }

    if(userId === currentProfile.id){

        globalScore = 0;

        currentProfile.score = 0;

        $("globalScore").textContent = "0";
    }

    toast("Đã reset điểm.");

    await adminPage();
}


/* =====================================================
   STARTUP
===================================================== */

async function startup(){

    renderLogin();

    try{

        const {
            data:{
                session
            }
        } =
        await supabaseClient.auth.getSession();

        if(session){
            await loadProfile();
        }

    }catch(error){

        console.error(error);

        $("authForm").innerHTML = `
            <div class="auth-error">
                Không thể kết nối Supabase.<br><br>
                ${escapeHTML(error.message)}
            </div>

            <button
                class="secondary full"
                onclick="location.reload()">
                🔄 Thử lại
            </button>
        `;
    }

    supabaseClient.auth.onAuthStateChange(
        async(event,session) => {

            if(
                event === "SIGNED_OUT"
            ){
                return;
            }

            if(
                event === "SIGNED_IN" &&
                session
            ){
                await loadProfile();
            }
        }
    );
}

startup();

</script>
