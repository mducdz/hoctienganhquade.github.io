<style>
:root{

 --panel:#10162b;
 --panel2:#151d38;
 --line:#263252;
 --text:#f5f7ff;
 --muted:#9ba8c7;

*{box-sizing:border-box;margin:0;padding:0}

body{

}

button,input{font:inherit}

button{cursor:pointer}

.app{
 display:flex;

}

/* SIDEBAR */

.sidebar{
 width:245px;
 flex-shrink:0;
 background:#0b1021ee;

 padding:18px 12px;
 position:fixed;
 top:0;
 bottom:0;
 overflow-y:auto;
}

.brand{
 padding:8px 10px 18px;
 border-bottom:1px solid var(--line);
 margin-bottom:12px;
}

.brand h1{
 font-size:23px;
 background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));
 -webkit-background-clip:text;
 color:transparent;
}

.brand p{
 color:var(--muted);
 font-size:11px;
 margin-top:4px;
}

.section-title{
 color:#647394;
 font-size:10px;
 font-weight:bold;
 padding:12px 10px 5px;
 text-transform:uppercase;
}

.nav{
 width:100%;
 border:0;
 background:transparent;
 color:#aab6d1;
 text-align:left;
 padding:9px 10px;
 border-radius:9px;
 margin:2px 0;
 font-size:12px;
}

.nav:hover{
 background:#ffffff08;
 color:white;
}

.nav.active{
 background:linear-gradient(90deg,#19d9ff20,#815cff20);
 color:white;
 border-left:3px solid var(--cyan);
}

/* MAIN */

.main{
 margin-left:245px;
 width:calc(100% - 245px);
 padding:28px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}

.top h2{
 font-size:25px;
}

.points{
 background:#ffffff08;
 border:1px solid var(--line);
 padding:8px 13px;
 border-radius:20px;
 font-size:12px;
}

.points b{
 color:#ffe66d;
}

/* PAGE */

.page{
 max-width:1000px;
 margin:auto;
}

.card{
 background:#ffffff07;
 border:1px solid var(--line);
 border-radius:16px;
 padding:18px;
 margin-bottom:12px;
 backdrop-filter:blur(15px);
}

.hero{
 padding:30px;
 text-align:center;
}

.hero .emoji{
 font-size:48px;
}

.hero h2{
 font-size:28px;
 margin-top:8px;
}

.hero p{
 color:var(--muted);
 margin:8px 0;
 font-size:13px;
 line-height:1.5;
}

/* GRAMMAR */

.tense-tabs{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 margin-bottom:10px;
}

.tense-tabs button{
 border:1px solid var(--line);
 background:#ffffff05;
 color:#aab6d1;
 border-radius:9px;
 padding:9px 4px;
 font-size:11px;
 font-weight:bold;
}

.tense-tabs button.active{
 background:#19d9ff18;
 border-color:#19d9ff88;
 color:white;
}

.formula{
 background:#050814aa;
 border:1px solid #ffffff0b;
 padding:10px;
 border-radius:9px;
 margin:6px 0;
 font-size:13px;
}

.lesson h3{
 color:var(--cyan);
 font-size:13px;
 margin:13px 0 6px;
}

.lesson p{
 color:#c4cee2;
 font-size:13px;
 line-height:1.55;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 background:#ffffff09;
 padding:6px 8px;
 border-radius:7px;
 color:#cbd6eb;
 font-size:11px;
}

/* GAME */

.game-head{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 color:var(--muted);
}

.progress{
 height:6px;
 background:#050814;
 border-radius:20px;
 margin:9px 0 15px;
 overflow:hidden;
}

.progress div{
 height:100%;
 width:0;
 background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
 transition:.3s;
}

.q{
 font-size:19px;
 font-weight:bold;
 line-height:1.5;
 margin-bottom:14px;
}

.answers{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}

.answer{
 border:1px solid var(--line);
 background:#ffffff07;
 color:white;
 padding:12px;
 border-radius:10px;
 text-align:left;
}

.answer:hover{
 background:#ffffff12;
}

.answer.correct{
 background:#39e58c22;
 border-color:var(--green);
}

.answer.wrong{
 background:#ff526822;
 border-color:var(--red);
}

.feedback{
 min-height:22px;
 margin:10px 0;
 font-size:13px;
 font-weight:bold;
}

.primary{
 border:0;
 color:white;
 background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));
 padding:10px 19px;
 border-radius:20px;
 font-weight:bold;
}

.secondary{
 border:1px solid var(--line);
 color:white;
 background:#ffffff08;
 padding:9px 16px;
 border-radius:18px;
}

/* INPUT */

.input{
 width:100%;
 padding:12px;
 border-radius:10px;
 border:1px solid var(--line);
 background:#050814;
 color:white;
 outline:none;
}

.input:focus{
 border-color:var(--cyan);
}

/* VOCAB */

.vocab-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.vocab-card{
 border:1px solid var(--line);
 background:#ffffff06;
 padding:15px;
 border-radius:12px;
 cursor:pointer;
}

.vocab-card:hover{
 background:#ffffff0d;
 border-color:#19d9ff66;
}

.vocab-card .big{
 font-size:28px;
}

.vocab-card h3{
 margin-top:6px;
 font-size:13px;
}

.vocab-card p{
 color:var(--muted);
 font-size:11px;
 margin-top:3px;
}

/* VOCAB GAME */

.vocab-image{
 height:220px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#050814;
 border-radius:13px;
 overflow:hidden;
 margin-bottom:13px;
}

.vocab-image img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.vocab-placeholder{
 font-size:80px;
}

.vocab-word{
 text-align:center;
 font-size:21px;
 font-weight:bold;
 margin-bottom:12px;
}

.vocab-mode{
 text-align:center;

 font-size:12px;
 margin-bottom:10px;
}

.result{

.result-score{

}

.hidden{display:none!important}

.mobile-menu{

}

@media(max-width:750px){

["tennis","Quần vợt","🎾"],
["swimming","Bơi lội","🏊"],
["running","Chạy bộ","🏃"],
["cycling","Đạp xe","🚴"],
["boxing","Quyền Anh","🥊"],
["volleyball","Bóng chuyền","🏐"],
["badminton","Cầu lông","🏸"],
["baseball","Bóng chày","⚾"]
]}

};


/* =====================================================
   STATE
===================================================== */

let currentTense="past";
let mode="";
let questions=[];
let index=0;
let score=0;

let vocabTopic="";
let vocabRound=1;
let vocabIndex=0;
let vocabScore=0;


/* =====================================================
   HELPERS
===================================================== */

function pageTitle(text){
 document.getElementById("pageTitle").textContent=text;
}

function clearActive(){
 document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
}

function showPage(html){
 document.getElementById("page").innerHTML=html;
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}


/* =====================================================
   HOME
===================================================== */

function home(btn){

 clearActive();
 btn.classList.add("active");
 pageTitle("Trang chủ");

 showPage(`
 <div class="card hero">
   <div class="emoji">📚✨</div>
   <h2>HOC ENGLISH</h2>
   <p>
   Học ngữ pháp, luyện Quiz, chia động từ,
   nối câu và học từ vựng bằng hình ảnh.
   </p>
   <button class="primary" onclick="grammar('past',null)">
   🚀 Bắt đầu học
   </button>
 </div>

 <div class="card">
   <h3>📖 Nội dung</h3>
   <p style="color:var(--muted);font-size:13px;line-height:1.7;margin-top:7px">
   ⏪ Quá khứ đơn<br>
   ☀️ Hiện tại đơn<br>
   🔄 Hiện tại tiếp diễn<br>
   🚀 Hiện tại hoàn thành<br>
   🔮 Tương lai đơn<br>
   🎯 Quiz • ✏️ Chia động từ • 🔗 Nối câu<br>
   🧠 10 chủ đề từ vựng
   </p>
 </div>
 `);
}


/* =====================================================
   GRAMMAR
===================================================== */

function grammar(t,btn){

 currentTense=t;

 if(btn){
  clearActive();
  btn.classList.add("active");
 }

 pageTitle(lessons[t].title);

 let l=lessons[t];

 showPage(`
 <div class="card lesson">

 <h2>${l.title}</h2>

 <p>${l.desc}</p>

 <h3>📌 Công thức</h3>

 ${l.formula.map(x=>`
 <div class="formula">${x}</div>
 `).join("")}

 <h3>🔎 Dấu hiệu nhận biết</h3>

 <div class="tags">
 ${l.signs.map(x=>`<span class="tag">${x}</span>`).join("")}
 </div>

 <h3>💡 Ví dụ</h3>

 <div class="formula">${l.example}</div>

 </div>

 <div class="card">
 <h3>🎯 Luyện tập</h3>
 <p style="color:var(--muted);font-size:12px;margin:6px 0 12px">
 Chọn một dạng bài để luyện thì này.
 </p>

 <button class="primary" onclick="practiceTense('quiz')">
 🎯 Quiz
 </button>

 <button class="secondary" onclick="practiceTense('verb')">
 ✏️ Chia động từ
 </button>

 <button class="secondary" onclick="practiceTense('join')">
 🔗 Nối câu
 </button>
 </div>
 `);
}


/* =====================================================
   PRACTICE MENU
===================================================== */

function openPractice(type,btn){

 mode=type;

 clearActive();
 btn.classList.add("active");

 pageTitle(
 type==="quiz"?"🎯 Quiz":
 type==="verb"?"✏️ Chia động từ":
 "🔗 Nối câu"
 );

 showPage(`
 <div class="card hero">
   <div class="emoji">
   ${type==="quiz"?"🎯":type==="verb"?"✏️":"🔗"}
   </div>

   <h2>
   ${type==="quiz"?"Quiz":
     type==="verb"?"Chia động từ":
     "Nối câu"}
   </h2>

   <p>
   Thì đang luyện: <b>${lessons[currentTense].title}</b>
   </p>

   <button class="primary" onclick="startPractice('${type}')">
   🚀 Bắt đầu
   </button>
 </div>
 `);
}


function practiceTense(type){
 startPractice(type);
}


/* =====================================================
   START PRACTICE
===================================================== */

function startPractice(type){

 mode=type;
 index=0;
 score=0;

 if(type==="quiz"){

  let base=mcBase[currentTense];

  questions=[];

  for(let i=0;i<10;i++){

   let q=base[i%base.length];

   questions.push({
    q:q[0],
    a:q[1],
    options:shuffle(q[2])
   });

  }
 }

 if(type==="verb"){
  questions=shuffle(verbs).slice(0,10);
 }

 if(type==="join"){
  questions=shuffle(joins).slice(0,10);
 }

 renderPractice();
}


/* =====================================================
   RENDER PRACTICE
===================================================== */

function renderPractice(){

 pageTitle(
 mode==="quiz"?"🎯 Quiz":
 mode==="verb"?"✏️ Chia động từ":
 "🔗 Nối câu"
 );

 showPage(`
 <div class="card">

 <div class="game-head">
 <span>Câu ${index+1} / ${questions.length}</span>
 <span>⭐ ${score}</span>
 </div>

 <div class="progress">
 <div style="width:${index/questions.length*100}%"></div>
 </div>

 <div id="gameContent"></div>

 </div>
 `);

 const box=document.getElementById("gameContent");

 if(mode==="quiz"){

  let q=questions[index];

  box.innerHTML=`
  <div class="q">${q.q}</div>

  <div class="answers">

  ${q.options.map((x,i)=>`
   <button class="answer"
   onclick="answerQuiz('${escapeAttr(x)}',this)">
   ${String.fromCharCode(65+i)}. ${x}
   </button>
  `).join("")}

  </div>

  <div id="feedback" class="feedback"></div>
  <button id="next" class="primary hidden"
  onclick="nextPractice()">Câu tiếp theo →</button>
  `;

 }

 if(mode==="verb"){

  let q=questions[index];

  box.innerHTML=`
   <div class="q">${q[0]}</div>

   <input
   id="verbInput"
   class="input"
   placeholder="Nhập đáp án..."
   autocomplete="off"
   >

   <div id="feedback" class="feedback"></div>

   <button id="check"
   class="primary"
   onclick="checkVerb()">✓ Kiểm tra</button>

   <button id="next"
   class="primary hidden"
   onclick="nextPractice()">Câu tiếp theo →</button>
  `;
 }

 if(mode==="join"){

  let words=shuffle(questions[index].split(" / "));

  box.innerHTML=`
   <div class="q">Sắp xếp thành câu đúng:</div>

   <div id="words"
   style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>

   <div id="answerArea"
   style="min-height:55px;border:1px dashed #19d9ff66;border-radius:10px;padding:9px;display:flex;flex-wrap:wrap;gap:6px">
   </div>

   <div id="feedback" class="feedback"></div>

   <button class="primary" onclick="checkJoin()">✓ Kiểm tra</button>

   <button id="next" class="primary hidden"
   onclick="nextPractice()">Câu tiếp theo →</button>
  `;

  let wordsBox=document.getElementById("words");

  words.forEach(word=>{

   let b=document.createElement("button");

   b.className="secondary";
   b.style.padding="7px 10px";
   b.textContent=word;

   b.onclick=()=>{
    document.getElementById("answerArea").appendChild(b);
   };

   wordsBox.appendChild(b);

  });
 }
}


/* =====================================================
   QUIZ
===================================================== */

function escapeAttr(text){
 return text.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function answerQuiz(selected,button){

 let q=questions[index];

 document.querySelectorAll(".answer")
 .forEach(x=>x.disabled=true);

 if(selected===q.a){

  score++;

  button.classList.add("correct");

  document.getElementById("feedback").textContent=
   "🎉 Chính xác!";
 }
 else{

  button.classList.add("wrong");

  document.querySelectorAll(".answer")
  .forEach(x=>{
   if(x.textContent.includes(q.a))
    x.classList.add("correct");
  });

  document.getElementById("feedback").textContent=
   "❌ Sai! Đáp án: "+q.a;
 }

 document.getElementById("next").classList.remove("hidden");
}


/* =====================================================
   VERB
===================================================== */

function checkVerb(){

 let input=document.getElementById("verbInput")
 .value.trim().toLowerCase();

 let answer=questions[index][1].toLowerCase();

 document.getElementById("verbInput").disabled=true;
 document.getElementById("check").disabled=true;

 if(input===answer){

  score++;

  document.getElementById("feedback").textContent=
   "🎉 Chính xác!";
 }
 else{

  document.getElementById("feedback").textContent=
   "❌ Đáp án đúng: "+questions[index][1];
 }

 document.getElementById("next").classList.remove("hidden");
}


/* =====================================================
   JOIN
===================================================== */

function checkJoin(){

 let answer=[
  ...document.getElementById("answerArea").children
 ].map(x=>x.textContent).join(" ");

 let correct=questions[index].replaceAll(" / "," ");

 if(answer.toLowerCase()===correct.toLowerCase()){

  score++;

  document.getElementById("feedback").textContent=
   "🎉 Chính xác!";
 }
 else{

  document.getElementById("feedback").textContent=
   "❌ Đáp án: "+correct;
 }

 document.getElementById("next").classList.remove("hidden");
}


/* =====================================================
   NEXT
===================================================== */

function nextPractice(){

 index++;

 if(index>=questions.length){

  showResult(score,questions.length);
  return;
 }

 renderPractice();
}


/* =====================================================
   RESULT
===================================================== */

function showResult(points,total){

 pageTitle("🏆 Kết quả");

 let percent=Math.round(points/total*100);

 let message=
 percent>=90?"🏆 Xuất sắc!":
 percent>=70?"🔥 Rất tốt!":
 percent>=50?"👍 Khá tốt!":
 "💪 Hãy luyện tập thêm!";

 showPage(`
 <div class="card result">

 <div style="font-size:45px">🎉</div>

 <h2>Hoàn thành!</h2>

 <div class="result-score">
 ${points}/${total}
 </div>

 <p style="color:var(--muted)">
 ${message}<br>
 Độ chính xác: ${percent}%
 </p>

 <br>

 <button class="primary"
 onclick="startPractice('${mode}')">
 🔄 Làm lại
 </button>

 </div>
 `);

}


/* =====================================================
   VOCAB LIST
===================================================== */

function vocabList(btn){

 clearActive();

 if(btn)btn.classList.add("active");

 pageTitle("🧠 Từ vựng");

 showPage(`
 <div class="card">
 <h2>🧠 Chọn chủ đề</h2>

 <p>10 từ • 2 lượt</p>

 </div>

 `).join("")}

 </div>
 </div>
 `);
}


/* =====================================================
   VOCAB GAME
===================================================== */

function startVocab(topic){

 vocabTopic=topic;
 vocabRound=1;
 vocabIndex=0;
 vocabScore=0;

 renderVocab();
}


function renderVocab(){

 let data=vocab[vocabTopic];
 let item=data.items[vocabIndex];

 pageTitle("🧠 "+data.name);

 showPage(`
 <div class="card">

 <div class="game-head">
 <span>Lượt ${vocabRound}/2</span>
 <span>Từ ${vocabIndex+1}/10</span>
 <span>⭐ ${vocabScore}</span>
 </div>

 <div class="progress">
 <div style="width:${vocabIndex/10*100}%"></div>
 </div>

 <div class="vocab-image">
   <div class="vocab-placeholder">${item[2]}</div>
 </div>

 <div class="vocab-mode">
 ${vocabRound===1
 ? "👀 Nhìn hình và đoán từ tiếng Anh"
 : "🧠 Lượt 2 — nhớ lại từ"}
 </div>

 <input
 id="vocabInput"
 class="input"
 placeholder="Nhập từ tiếng Anh..."
 autocomplete="off"
 >

 <div id="vocabFeedback"
 class="feedback"></div>

 <button id="vocabCheck"
 class="primary"
 onclick="checkVocab()">
 ✓ Kiểm tra
 </button>

 </div>
 `);

}


/* =====================================================
   VOCAB CHECK
===================================================== */

function checkVocab(){

 let data=vocab[vocabTopic];
 let item=data.items[vocabIndex];

 let input=document.getElementById("vocabInput")
 .value.trim().toLowerCase();

 let answer=item[0].toLowerCase();

 document.getElementById("vocabInput").disabled=true;
 document.getElementById("vocabCheck").disabled=true;

 if(input===answer){

  vocabScore+=10;

  document.getElementById("vocabFeedback").innerHTML=
   "🎉 Đúng! <b>+10 điểm</b>";
 }
 else{

  document.getElementById("vocabFeedback").innerHTML=
   `❌ Đáp án: <b>${item[0]}</b> — ${item[1]}`;
 }

 setTimeout(()=>{

  vocabIndex++;

  if(vocabIndex>=10){

   if(vocabRound===1){

    vocabRound=2;
    vocabIndex=0;

    showPage(`
    <div class="card result">

    <div style="font-size:50px">🧠</div>

    <h2>Lượt 1 hoàn thành!</h2>

    <div class="result-score">
    ${vocabScore}/100
    </div>

    <p style="color:var(--muted)">
    Bây giờ sang lượt 2.<br>
    Hãy nhớ lại 10 từ vừa học!
    </p>

    <button class="primary"
    onclick="renderVocab()">
    🚀 Bắt đầu lượt 2
    </button>

    </div>
    `);

   }
   else{

    showVocabResult();

   }

  }
  else{

   renderVocab();

  }

 },900);

}


/* =====================================================
   VOCAB RESULT
===================================================== */

function showVocabResult(){

 pageTitle("🏆 Kết quả từ vựng");

 let percent=Math.round(vocabScore/200*100);

 showPage(`
 <div class="card result">

 <div style="font-size:50px">🏆</div>

 <h2>Hoàn thành 2 lượt!</h2>

 <div class="result-score">
 ${vocabScore}/200
 </div>

 <p style="color:var(--muted)">
 Độ chính xác: ${percent}%
 </p>

 <br>

 <button class="primary"
 onclick="startVocab('${vocabTopic}')">
 🔄 Học lại
 </button>

 <button class="secondary"
 onclick="vocabList(null)">
 📚 Chủ đề khác
 </button>

 </div>
 `);

}


/* =====================================================
   INIT
===================================================== */

home(document.querySelector(".nav"));

</script>

</body>
</html>
