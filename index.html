<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;

}

body{

button,input{

}

button{

}

.hidden{

}

/* =========================
   AUTH
========================= */

#authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:

}

.auth-card{
    width:100%;
    max-width:430px;
    padding:30px;

    border-radius:22px;
    background:#10172d;

}

.auth-logo{
    text-align:center;
    font-size:55px;
}

.auth-title{
    text-align:center;
    margin:10px 0 5px;
    font-size:28px;
    background:linear-gradient(90deg,#20dcff,#8c5cff,#ff4db8);
    -webkit-background-clip:text;
    color:transparent;
}

.auth-sub{
    text-align:center;
    color:#8794b5;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:13px 14px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #293654;
    outline:none;
    background:#080d1d;
    color:#fff;
}

.input:focus{
    border-color:#20dcff;
}

.auth-error{
    min-height:22px;
    color:#ff6678;
    font-size:13px;
    margin:5px 0;
}

/* =========================
   BUTTON
========================= */

.primary{
    border:0;
    color:#fff;
    border-radius:12px;
    padding:11px 17px;
    background:linear-gradient(135deg,#17d8ff,#765bff,#ff3fae);
}

.secondary{
    color:#fff;
    border:1px solid #34405e;
    background:#ffffff0b;
    border-radius:12px;
    padding:11px 17px;
}

.primary:hover,
.secondary:hover{

}

.full{
    width:100%;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    background:#0d1328;

}

.logo{

    margin-bottom:15px;

}

.logo h1{

}

}

}

.nav.active{

}

.main{

}

.top{

.score{

========================= */

.hero h1{

}

.muted{

}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.topic-card,

    padding:18px;
    border:1px solid #293654;

.topic-card{

.topic-card:hover,

.topic-card h3,

    color:#cbd5e9;

/* =========================

========================= */

.vocab-grid{

    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.vocab-card{

    border-radius:12px;

.vocab-card .icon{

.vocab-card h3{

    margin:8px 0;

.vocab-card p{
    font-size:12px;

}

.vocab-image{

    border-radius:13px;
    background:#080d1d;

}

.vocab-image img{

/* =========================

.progress{

.match-item:hover{

<script>

/* =====================================================

"sb_publishable_u704DIAbYElFlahcAcHLzQ_JTt4KTEX";

/* =====================================================
   UTILITY
===================================================== */

function $(id){
    return document.getElementById(id);
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function shuffle(array){
    return [...array].sort(
        () => Math.random() - .5
    );
}

function codePoints(str){
    return [...str]
        .map(c =>
            c.codePointAt(0).toString(16)
        )
        .join("-");
}

function emojiImage(emoji){
    return (
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
        + codePoints(emoji)
        + ".png"
    );
}

function showError(message){
    console.error(message);
    alert(message);
}


/* =====================================================
   AUTH UI
===================================================== */

function renderLogin(){

            class="secondary full"
            onclick="renderRegister()">
            📝 Tạo tài khoản
        </button>
    `;
}

function renderRegister(){

    $("authForm").innerHTML = `

        <input
            id="registerUsername"

            placeholder="Tên người dùng">

        <input
            id="registerEmail"

        <div

        <button
            class="primary full"
            onclick="register()">
            📝 Đăng ký
        </button>

            🔐 Đã có tài khoản
        </button>
    `;
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const username =
        $("registerUsername").value.trim();

    const email =
        $("registerEmail").value.trim();

    const password =
        $("registerPassword").value;

    const error =
        $("authError");

    error.textContent = "";

    if(username.length < 3){
        error.textContent =
            "Tên người dùng phải có ít nhất 3 ký tự.";
        return;
    }

    if(!email.includes("@")){
        error.textContent =
            "Email không hợp lệ.";
        return;
    }

    if(password.length < 6){
        error.textContent =
            "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    const {
        data,
        error: signError
    } = await supabaseClient.auth.signUp({
        email,
        password
    });

    if(signError){
        error.textContent =
            signError.message;
        return;
    }

    if(!data.user){
        error.textContent =
            "Không tạo được tài khoản.";
        return;
    }

    const {
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .insert({
            id:data.user.id,
            username:username,
            role:"user",
            score:0
        });

    if(profileError){

        console.error(profileError);

        error.textContent =
            "Tài khoản Auth đã tạo nhưng profile lỗi: "
            + profileError.message;

        return;
    }

    if(data.session){

        await loadProfile();

    }else{

        error.textContent =
            "Đăng ký thành công. Nếu Supabase yêu cầu xác nhận email, hãy xác nhận email rồi đăng nhập.";
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        $("loginEmail").value.trim();

    const password =
        $("loginPassword").value;

    const error =
        $("authError");

    error.textContent = "";

    const {
        error: loginError
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if(loginError){

        error.textContent =
            loginError.message;

        return;
    }

    await loadProfile();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentProfile = null;

    globalScore = 0;

    $("app").classList.add("hidden");
    $("authScreen").classList.remove("hidden");

    renderLogin();
}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    const {
        data:{
            user
        }
    } = await supabaseClient.auth.getUser();

    if(!user){
        renderLogin();
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();

    if(error){

        console.error(error);

        alert(
            "Đăng nhập được nhưng không đọc được profiles.\n\n"
            + error.message
        );

        return;
    }

    if(!data){

        alert(
            "Tài khoản chưa có profile trong bảng profiles."
        );

        return;
    }

    currentProfile = data;

    globalScore =
        Number(data.score || 0);

    renderApp();
}

   NAV

function activeNone(){

    document
        .querySelectorAll(".nav")
        .forEach(
            x => x.classList.remove("active")
        );

function setTitle(title){
    $("pageTitle").textContent = title;
}

function toggleMenu(){
    $("sidebar").classList.toggle("open");
}


/* =====================================================
   SCORE
===================================================== */

async function addGlobal(points){

    globalScore += points;

    $("globalScore").textContent =
        globalScore;

    if(!currentProfile){
        return;
    }

    currentProfile.score =
        globalScore;

    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update({
            score:globalScore
        })
        .eq("id",currentProfile.id);

    if(error){
        console.error(error);
    }
}

            <button
                id="checkButton"
                class="primary"
                onclick="checkVocabWrite()">
                ✓ Kiểm tra
            </button>

            <button
                id="nextButton"
                class="primary"
                style="display:none"
                onclick="nextVocabWrite()">
                Tiếp theo →
            </button>

        </div>
    `;
}

async function checkVocabWrite(){

    const item =
        vocabData[vocabIndex];

    const input =
        $("vocabInput");

    const value =
        input.value
        .trim()
        .toLowerCase();

    input.disabled = true;

    $("checkButton").disabled = true;

    if(
        value ===
        item[0].toLowerCase()
    ){

        vocabScore += 10;

        await addGlobal(10);

        $("feedback").innerHTML =
            "🎉 Chính xác! +10 điểm";

    }else{

        $("feedback").innerHTML =
            "❌ Đáp án đúng: <b>"
            + escapeHTML(item[0])
            + "</b>";
    }

    $("nextButton").style.display =
        "inline-block";
}

function nextVocabWrite(){

    vocabIndex++;

    if(vocabIndex >= 10){

        showRound2Intro();

        return;
    }

    renderVocabWrite();
}

                    </div>

                </div>

                <div>

                    <h3>
                        🇬🇧 Từ tiếng Anh
                    </h3>

                    <div id="wordList">

                        ${
                            words
                            .map(
                                item => `

                                <div
                                    class="match-item"
                                    data-id="${escapeHTML(item[0])}"
                                    onclick="
                                        selectWord(
                                            this,
                                            '${item[0].replaceAll("'","\\'")}'
                                        )
                                    ">

                                    ${escapeHTML(item[0])}

                                </div>
                                `
                            )
                            .join("")
                        }

                    </div>

                </div>

            </div>

            <div
                id="matchFeedback"
                class="feedback">
            </div>

        </div>
    `;
}

function selectImage(el,id){

    document
        .querySelectorAll(
            "#imageList .match-item"
        )
        .forEach(
            x => x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedImage = {
        el:el,
        id:id
    };

    tryMatch();
}

function selectWord(el,id){

    document
        .querySelectorAll(
            "#wordList .match-item"
        )
        .forEach(
            x => x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedWord = {
        el:el,
        id:id
    };

    tryMatch();
}

async function tryMatch(){

    if(
        !selectedImage ||
        !selectedWord
    ){
        return;
    }

    if(
        selectedImage.id ===
        selectedWord.id
    ){

        selectedImage.el.style.display =
            "none";

        selectedWord.el.style.display =
            "none";

        vocabScore += 10;

        await addGlobal(10);

        $("matchFeedback").innerHTML =
            "🎉 Đúng! +10 điểm";

    }else{

        $("matchFeedback").innerHTML =
            "❌ Chưa đúng.";
    }

    selectedImage = null;
    selectedWord = null;

    document
        .querySelectorAll(".match-item")
        .forEach(
            x =>
            x.classList.remove("selected")
        );

    checkMatchingFinished();
}

function checkMatchingFinished(){

    const remaining =
        [
            ...document
            .querySelectorAll(
                "#imageList .match-item"
            )
        ]
        .filter(
            x =>
            x.style.display !== "none"
        );

    if(remaining.length === 0){

        setTimeout(
            showVocabResult,
            500
        );
    }
}

/* =====================================================
   CHANGE ROLE
===================================================== */

async function changeRole(userId,newRole){

    if(
        !currentProfile ||
        currentProfile.role !== "admin"
    ){
        alert(
            "Không có quyền."
        );
        return;
    }

    if(
        userId ===
        currentProfile.id &&
        newRole !== "admin"
    ){

        alert(
            "Không nên tự hạ quyền admin của chính mình."
        );

        return;
    }

    const ok =
        confirm(
            "Bạn có chắc muốn đổi role thành "
            + newRole
            + "?"
        );

    if(!ok){
        return;
    }

    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update({
            role:newRole
        })
        .eq("id",userId);

    if(error){

        alert(
            "Lỗi: "
            + error.message
        );

        return;
    }

    alert(
        "Đã cập nhật role."
    );

    adminPage();
}


/* =====================================================
   RESET SCORE
===================================================== */

async function resetScore(userId){

    if(
        !currentProfile ||
        currentProfile.role !== "admin"
    ){
        return;
    }

    const ok =
        confirm(
            "Reset điểm tài khoản này về 0?"
        );

    if(!ok){
        return;
    }

    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update({
            score:0
        })
        .eq("id",userId);

    if(error){

        alert(
            "Lỗi: "
            + error.message
        );

        return;
    }

    if(
        userId ===
        currentProfile.id
    ){

        globalScore = 0;

        $("globalScore").textContent = 0;
    }

    alert(
        "Đã reset điểm."
    );

    adminPage();
}
