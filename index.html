<head>

<title>English Galaxy - Học 3 Thì</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:white;

    background:
    linear-gradient(
        135deg,
        #6d28d9,
        #2563eb,
        #0891b2,
        #db2777
    );

    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header{
    text-align:center;
    padding:50px 20px 30px;
}

.logo{
    font-size:55px;
}

header h1{
    font-size:48px;
    margin:10px 0;
    text-shadow:0 5px 20px rgba(0,0,0,.3);
}

header p{
    font-size:18px;
    opacity:.9;
}

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
}

.glass{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:12px;
    margin-bottom:20px;
}

.tab{
    border:0;
    border-radius:18px;
    padding:18px 10px;
    color:white;
    background:rgba(255,255,255,.1);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.tab:hover{
    transform:translateY(-3px);
    background:white;
    color:#5b21b6;
}

.tab.active{
    background:white;
    color:#5b21b6;
}

.lesson{
    padding:30px;
    margin-bottom:20px;
}

.lesson h2{
    font-size:32px;
    color:#ffe66d;
    margin-bottom:15px;
}

.lesson h3{
    color:#8fffff;
    margin:24px 0 12px;
}

.lesson p{
    line-height:1.7;
}

.formula{
    background:rgba(0,0,0,.22);
    border-left:5px solid #ffe66d;
    border-radius:12px;
    padding:17px;
    margin:10px 0;
    line-height:1.7;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.card{
    padding:17px;
    background:rgba(255,255,255,.1);
    border-radius:16px;
    line-height:1.5;
}

.example{
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.1);
    margin:10px 0;
}

.start{
    text-align:center;
    padding:30px;
    margin-bottom:20px;
}

.start h2{
    color:#ffe66d;
    margin-bottom:10px;
}

.main-btn{
    border:0;
    padding:15px 30px;
    margin-top:18px;
    border-radius:50px;
    background:#ffe66d;
    color:#32175f;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.main-btn:hover{
    transform:scale(1.06);
    box-shadow:0 10px 30px rgba(255,230,109,.35);
}

#quiz{
    display:none;
    padding:30px;
    margin-bottom:20px;
}

.quiz-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.progress{
    height:10px;
    margin:18px 0;
    background:rgba(0,0,0,.25);
    border-radius:20px;
    overflow:hidden;
}

#progressBar{
    width:0;
    height:100%;
    background:#ffe66d;
    transition:.3s;
}

#questionNumber{
    opacity:.8;
}

#question{
    font-size:24px;
    font-weight:bold;
    line-height:1.5;
    margin:20px 0;
}

.answers{
    display:grid;
    gap:12px;
}

.answer{
    width:100%;
    padding:16px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.1);
    color:white;
    font-size:16px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.answer:hover{
    background:rgba(255,255,255,.25);
    transform:translateX(4px);
}

.answer.correct{
    background:rgba(22,163,74,.85);
}

.answer.wrong{
    background:rgba(220,38,38,.85);
}

.answer:disabled{
    cursor:default;
}

#feedback{
    min-height:28px;
    margin-top:16px;
    font-weight:bold;
}

#nextBtn{
    display:none;
    border:0;
    padding:13px 25px;
    margin-top:15px;
    border-radius:50px;
    background:#ffe66d;
    color:#32175f;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    text-align:center;
    padding:30px 10px;
}

.final-score{
    font-size:55px;
    font-weight:bold;
    color:#ffe66d;
    margin:15px;
}

footer{
    text-align:center;
    padding:35px;
    opacity:.8;
}

@media(max-width:650px){

    header h1{
        font-size:35px;
    }

    .tabs{
        grid-template-columns:1fr;
    }

    .lesson{
        padding:20px;
    }

    #question{
        font-size:20px;
    }
}
</style>
</head>

<header>
    <div class="logo">📚✨🧠</div>
    <h1>ENGLISH GALAXY</h1>

        <button

    </div>

            </span>

        </div>

        </div>

        <div id="questionNumber">

        </div>

        <div id="question"></div>

        <div

        ></div>

        <div id="feedback"></div>

        <button
            id="nextBtn"
            onclick="nextQuestion()"
        >
            Câu tiếp theo ➜
        </button>


        <!-- KẾT QUẢ -->

        <div id="result">

            <h2>🎉 HOÀN THÀNH!</h2>

            <div class="final-score">
                <span id="finalScore">0</span>/100
            </div>

            <p id="resultText"></p>

            <button
                class="main-btn"
                onclick="startQuiz()"
            >
                🔄 Làm lại
            </button>

        </div>

    </div>

</div>


<footer>
    📚 ENGLISH GALAXY
    <br><br>
    Học • Luyện tập • Tiến bộ 🚀
</footer>

/* =====================================================
   BIẾN QUIZ
===================================================== */

let currentTense = "past";

let currentQuestion = 0;

let score = 0;

let quizQuestions = [];


/* =====================================================
   CHỌN THÌ
===================================================== */

function selectTense(tense,button){

    currentTense = tense;

    document
        .querySelectorAll(".tab")
        .forEach(function(tab){
            tab.classList.remove("active");
        });

    button.classList.add("active");

    document
        .getElementById("lesson")
        .innerHTML = lessons[tense];

}


/* =====================================================
   BẮT ĐẦU QUIZ
===================================================== */

function startQuiz(){

    quizQuestions =
        [...questions[currentTense]];

    quizQuestions.sort(
        () => Math.random() - 0.5
    );

    currentQuestion = 0;

    score = 0;

    document
        .getElementById("startBox")
        .style.display = "none";

    document
        .getElementById("lesson")
        .style.display = "none";

    document
        .getElementById("quiz")
        .style.display = "block";

    document
        .getElementById("result")
        .style.display = "none";

    document
        .getElementById("question")
        .style.display = "block";

    document
        .getElementById("questionNumber")
        .style.display = "block";

    document
        .getElementById("feedback")
        .style.display = "block";

    document
        .getElementById("score")
        .textContent = "0";

    renderQuestion();

}


/* =====================================================
   HIỂN THỊ CÂU HỎI
===================================================== */

function renderQuestion(){

    const q =
        quizQuestions[currentQuestion];

    document
        .getElementById("questionNumber")
        .textContent =
        "Câu "
        +
        (currentQuestion + 1)
        +
        " / "
        +
        quizQuestions.length;

    document
        .getElementById("question")
        .textContent =
        q.q;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.options.forEach(function(option,index){

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent =
            String.fromCharCode(65 + index)
            +
            ". "
            +
            option;

        button.onclick = function(){

            chooseAnswer(
                index,
                button
            );

        };

        answers.appendChild(button);

    });

    document
        .getElementById("feedback")
        .textContent = "";

    document
        .getElementById("nextBtn")
        .style.display = "none";

    document
        .getElementById("progressBar")
        .style.width =
        (
            currentQuestion
            /
            quizQuestions.length
            *
            100
        )
        + "%";

}


/* =====================================================
   CHỌN ĐÁP ÁN
===================================================== */

function chooseAnswer(selected,button){

    const q =
        quizQuestions[currentQuestion];

    document
        .querySelectorAll(".answer")
        .forEach(function(btn){

            btn.disabled = true;

        });

    if(selected === q.answer){

        score++;

        button.classList.add("correct");

        document
            .getElementById("feedback")
            .textContent =
            "🎉 Chính xác!";

    }else{

        button.classList.add("wrong");

        document
            .querySelectorAll(".answer")
            [q.answer]
            .classList.add("correct");

        document
            .getElementById("feedback")
            .textContent =
            "❌ Chưa đúng!";

    }

    document
        .getElementById("score")
        .textContent = score;

    document
        .getElementById("nextBtn")
        .style.display = "inline-block";

}


/* =====================================================
   CÂU TIẾP THEO
===================================================== */

function nextQuestion(){

    currentQuestion++;

    if(
        currentQuestion >=
        quizQuestions.length
    ){

        finishQuiz();

        return;

    }

    renderQuestion();

}


/* =====================================================
   KẾT QUẢ
===================================================== */

function finishQuiz(){

    document
        .getElementById("question")
        .style.display = "none";

    document
        .getElementById("questionNumber")
        .style.display = "none";

    document
        .getElementById("answers")
        .innerHTML = "";

    document
        .getElementById("feedback")
        .style.display = "none";

    document
        .getElementById("nextBtn")
        .style.display = "none";

    document
        .getElementById("progressBar")
        .style.width = "100%";

    document
        .getElementById("result")
        .style.display = "block";

    document
        .getElementById("finalScore")
        .textContent = score;

    let text;

    if(score >= 90){

        text =
            "🏆 Xuất sắc! Bạn nắm kiến thức rất tốt!";

    }else if(score >= 70){

        text =
            "🔥 Rất tốt! Hãy luyện thêm để đạt điểm cao hơn.";

    }else if(score >= 50){

        text =
            "💪 Khá ổn! Hãy xem lại phần cấu trúc.";

    }else{

        text =
            "📚 Hãy ôn lại bài học và thử lại nhé!";

    }

    document
        .getElementById("resultText")
        .textContent = text;

}


/* =====================================================
   KHỞI TẠO
===================================================== */

document
    .getElementById("lesson")
    .innerHTML =
    lessons.past;

</script>
