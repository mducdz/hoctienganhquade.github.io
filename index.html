*{box-sizing:border-box}

}

.logo{

}
.logo h1{
    margin:0;

    background:linear-gradient(90deg,#20dcff,#8c5cff,#ff4db8);
    -webkit-background-clip:text;
    color:transparent;
}
.logo small{color:#8794b5}

.title{
    color:#667394;
    font-size:10px;
    font-weight:bold;
    margin:15px 8px 6px;
}

.nav{

    border:0;
    background:transparent;
    color:#aeb9d1;
    padding:10px;
    border-radius:9px;
    text-align:left;
    margin:2px 0;

}
.nav:hover{background:#ffffff0a;color:white}
.nav.active{
    color:white;
    background:linear-gradient(90deg,#20dcff20,#875cff20);
    border-left:3px solid #20dcff;
}

.main{
    margin-left:235px;
    width:calc(100% - 235px);
    padding:25px;
}

.top{

    justify-content:space-between;

}
.top h2{margin:0;font-size:24px}

.score{

    padding:8px 14px;

}

.page{max-width:1050px;margin:auto}

.card{

    border:1px solid #263252;

    padding:20px;

}

.hero{

}
.hero .emoji{font-size:55px}
.hero h1{font-size:30px}
.hero p{color:#9ca9c7;line-height:1.6}

.primary,.secondary{
    border:0;
    border-radius:20px;
    padding:10px 17px;
    cursor:pointer;
    margin:3px;
}
.primary{
    color:white;
    background:linear-gradient(135deg,#17d8ff,#765bff,#ff3fae);
}
.secondary{
    color:white;
    background:#ffffff0b;
    border:1px solid #34405e;
}

.formula{
    background:#080d1d;
    border:1px solid #202c49;
    border-radius:9px;
    padding:11px;

}

.lesson h3{
    color:#20dcff;
    font-size:14px;
    margin-top:18px;
}
.lesson p{color:#bdc8df;line-height:1.6}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.tag{
    background:#ffffff0b;
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
    color:#cbd5e9;
}

.exercise-tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.progress{
    height:6px;
    background:#050915;
    border-radius:20px;
    overflow:hidden;
    margin:9px 0 18px;
}
.progress div{
    height:100%;
    background:linear-gradient(90deg,#20dcff,#765bff,#ff3fae);
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:15px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.answer{
    border:1px solid #293654;
    background:#ffffff07;
    color:white;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    text-align:left;
}
.answer:hover{background:#ffffff12}
.correct{border-color:#39e58c!important;background:#39e58c18!important}
.wrong{border-color:#ff5268!important;background:#ff526818!important}

.feedback{
    min-height:22px;
    margin:12px 0;
    font-weight:bold;
}

.input{
    width:100%;
    padding:12px;
    background:#070c1b;
    color:white;
    border:1px solid #293654;
    border-radius:9px;

}

    display:flex;

    gap:7px;
    margin:12px 0;
}
.word{
    padding:9px 12px;
    border:1px solid #33415f;
    background:#ffffff08;
    color:white;
    border-radius:9px;
    cursor:pointer;
}
.word.used{opacity:.3}

.answer-area{
    min-height:60px;
    padding:10px;
    border:1px dashed #20dcff66;
    border-radius:10px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}
.vocab-card{
    padding:15px;

    border-radius:12px;
    cursor:pointer;
}
.vocab-card:hover{border-color:#20dcff}

.vocab-card p{font-size:11px;color:#8794b5}

.vocab-image{
    height:230px;
    background:#080d1d;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:14px;
}
.vocab-image img{
    width:190px;
    height:190px;
    object-fit:contain;
}
.vocab-image .fallback{font-size:100px}

.info-word{
    text-align:center;
    margin-bottom:13px;
}
.info-word strong{font-size:24px}
.info-word span{
    display:block;
    color:#9ca9c7;
    margin-top:5px;
}

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.match-item{
    border:1px solid #293654;
    background:#ffffff06;
    border-radius:10px;
    padding:10px;
    margin-bottom:7px;
    cursor:pointer;
}
.match-item.selected{
    border-color:#20dcff;
    background:#20dcff15;
}
.match-img{
    width:55px;
    height:55px;
    object-fit:contain;
    vertical-align:middle;
    margin-right:8px;
}

.result{
    text-align:center;
    padding:35px;

.result-score{

.mobile{

</head>

function startExercise(type){

        questions=shuffle(joins[currentTense]);

function renderExercise(){

    let total=questions.length;

    if(currentExercise==="verb")renderVerb();

/* =========================================================
   QUIZ
========================================================= */

function renderQuiz(){

    let q=questions[questionIndex];

    document.getElementById("exercise").innerHTML=`

    <div class="question">${q[0]}</div>

    <div class="answers">

    ${shuffle(q[2]).map(x=>`
        <button class="answer"
        onclick="quizAnswer(this,'${safe(x)}')">
        ${x}
        </button>
    `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>

    <button id="next" class="primary" style="display:none"
    onclick="nextExercise()">
    Câu tiếp theo →
    </button>
    `;
}

function safe(x){
    return x.replace(/'/g,"\\'");
}

function quizAnswer(btn,value){

    let q=questions[questionIndex];

    document.querySelectorAll(".answer")
    .forEach(x=>x.disabled=true);

    if(value===q[1]){

        btn.classList.add("correct");
        exerciseScore++;
        addGlobal(10);

        document.getElementById("feedback").innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        btn.classList.add("wrong");

        document.getElementById("feedback").innerHTML=
        "❌ Sai! Đáp án đúng: <b>"+q[1]+"</b>";

        document.querySelectorAll(".answer").forEach(x=>{
            if(x.textContent.trim()===q[1])
                x.classList.add("correct");
        });
    }

    document.getElementById("next").style.display="inline-block";
}

function checkVerb(){

    }

    document.getElementById("next").style.display="inline-block";
}


/* =========================================================
   NỐI CÂU
========================================================= */

function renderJoin(){

    let correct=questions[questionIndex];
    let words=shuffle(correct.split(" / "));

    document.getElementById("exercise").innerHTML=`

    <div class="question">
    🔗 Hãy bấm các từ theo đúng thứ tự để tạo câu.
    </div>

    <div id="wordBox" class="word-box"></div>

    <div id="answerArea" class="answer-area"></div>

    <div id="feedback" class="feedback"></div>

    <button class="primary"
    onclick="checkJoin()">
    ✓ Kiểm tra
    </button>

    <button id="next"
    class="primary"
    style="display:none"
    onclick="nextExercise()">
    Câu tiếp theo →
    </button>
    `;

    let box=document.getElementById("wordBox");

    words.forEach((word,i)=>{

        let b=document.createElement("button");

        b.className="word";
        b.textContent=word;

        b.onclick=function(){

            if(b.classList.contains("used"))return;

            b.classList.add("used");

            let clone=document.createElement("button");
            clone.className="word";
            clone.textContent=word;

            clone.onclick=function(){
                clone.remove();
                b.classList.remove("used");
            };

            document.getElementById("answerArea").appendChild(clone);
        };

        box.appendChild(b);
    });
}

function checkJoin(){

    let correct=questions[questionIndex]
        .replaceAll(" / "," ")
        .trim()
        .toLowerCase();

    let chosen=[...document
        .getElementById("answerArea")
        .children]
        .map(x=>x.textContent)
        .join(" ")
        .trim()
        .toLowerCase();

    if(chosen===correct){

        exerciseScore++;
        addGlobal(10);

        document.getElementById("feedback").innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        document.getElementById("feedback").innerHTML=
        "❌ Chưa đúng! Đáp án: <b>"+correct+"</b>";
    }

    document.getElementById("next").style.display="inline-block";
}

function codePoints(str){

    return [...str]
        .map(c=>c.codePointAt(0).toString(16))
        .join("-");
}

function emojiImage(emoji){

    return "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
        +codePoints(emoji)+".png";
}

function startMatching(){

    vocabRound=2;

    let data=vocab[vocabTopic];

    let images=shuffle(data.items);
    let words=shuffle(data.items);

    selectedImage=null;
    selectedWord=null;

    setTitle("🔗 Nối ảnh với từ");

    document.getElementById("page").innerHTML=`

    <div class="card">

        <div style="display:flex;justify-content:space-between">
            <span>🔗 Lượt 2 — Nối từ</span>
            <span>10 cặp</span>
        </div>

        <p style="color:#9ca9c7">
        Bấm một hình ảnh, sau đó bấm từ tiếng Anh tương ứng.
        </p>

        <div class="match-grid">

            <div>
                <h3>🖼️ Hình ảnh</h3>

                <div id="imageList">

                ${images.map((item,i)=>`

                    <div class="match-item"
                    data-id="${item[0]}"
                    onclick="selectImage(this,'${safe(item[0])}')">

                        <img
                        class="match-img"
                        src="${emojiImage(item[2])}"
                        onerror="this.style.display='none'">

                    </div>

                `).join("")}

                </div>
            </div>

            <div>
                <h3>🇬🇧 Từ tiếng Anh</h3>

                <div id="wordList">

                ${words.map(item=>`

                    <div class="match-item"
                    data-id="${item[0]}"
                    onclick="selectWord(this,'${safe(item[0])}')">

                        ${item[0]}

                    </div>

                `).join("")}

                </div>
            </div>

        </div>

        <div id="matchFeedback" class="feedback"></div>

    </div>
    `;
}


function selectImage(el,id){

    document.querySelectorAll("#imageList .match-item")
    .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");

    selectedImage={el,id};

    tryMatch();
}


function selectWord(el,id){

    document.querySelectorAll("#wordList .match-item")
    .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");

    selectedWord={el,id};

    tryMatch();
}


function tryMatch(){

    if(!selectedImage || !selectedWord)return;

    if(selectedImage.id===selectedWord.id){

        selectedImage.el.style.display="none";
        selectedWord.el.style.display="none";

        vocabScore+=10;
        addGlobal(10);

        document.getElementById("matchFeedback").innerHTML=
        "🎉 Đúng! +10 điểm";

    }else{

        document.getElementById("matchFeedback").innerHTML=
        "❌ Hai mục chưa khớp.";

    }

    selectedImage=null;
    selectedWord=null;

    document.querySelectorAll(".match-item")
    .forEach(x=>x.classList.remove("selected"));

    checkMatchingFinished();
}


function checkMatchingFinished(){

    let remaining=[...
        document.querySelectorAll("#imageList .match-item")
    ].filter(x=>x.style.display!=="none");

    if(remaining.length===0){

        setTimeout(showVocabResult,500);
    }
}

        </button>

        <button class="secondary"
        onclick="vocabList(null)">
        🧠 Chủ đề khác
        </button>

    </div>
    `;
}
