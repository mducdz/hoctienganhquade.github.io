<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#070b16;
    --panel:#10182b;
    --panel2:#0c1324;
    --line:#263555;
    --text:#eef4ff;
    --muted:#91a0bf;
    --cyan:#20dcff;
    --purple:#795cff;
    --pink:#ff4eae;
    --green:#36e69a;
    --red:#ff6678;
    --yellow:#ffd84d;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 10% 0%,#182856 0,#070b16 35%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.6;
}

.hide{
    display:none!important;
}

.center{
    text-align:center;
}

.muted{
    color:var(--muted);
    line-height:1.6;
}

.logo{
    font-size:28px;
    font-weight:900;
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink)
    );
    color:transparent;
    background-clip:text;
    -webkit-background-clip:text;
}

/* AUTH */

#auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.auth-box{
    width:min(440px,100%);
    background:rgba(16,24,43,.96);
    border:1px solid var(--line);
    border-radius:24px;
    padding:30px;
    box-shadow:0 30px 100px #0009;
}

.auth-icon{
    font-size:65px;
}

.input{
    width:100%;
    border:1px solid var(--line);
    background:#080d1b;
    color:white;
    padding:13px;
    border-radius:11px;
    margin:6px 0;
    outline:none;
}

.input:focus{
    border-color:var(--cyan);
}

.btn{
    border:0;
    border-radius:11px;
    padding:11px 16px;
    color:white;
    background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple),
        var(--pink)
    );
    margin:4px 0;
}

.btn2{
    border:1px solid var(--line);
    background:#ffffff08;
    color:white;
    border-radius:11px;
    padding:11px 16px;
    margin:4px 0;
}

.full{
    width:100%;
}

.error{
    color:#ff8996;
    font-size:13px;
    min-height:20px;
    margin:5px 0;
}

/* APP */

#app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:255px;
    padding:15px;
    background:#0d1426;
    border-right:1px solid var(--line);
    overflow:auto;
    z-index:20;
}

.brand{
    padding:12px 8px 16px;
    border-bottom:1px solid var(--line);
}

.group-title{
    color:#697796;
    font-size:10px;
    font-weight:900;
    margin:18px 7px 7px;
}

.nav{
    width:100%;
    border:0;
    background:transparent;
    color:#aab7d0;
    text-align:left;
    padding:11px;
    border-radius:10px;
    margin:2px 0;
}

.nav:hover,
.nav.active{
    background:#ffffff09;
    color:white;
}

.nav.active{
    border-left:3px solid var(--cyan);
}

.main{
    margin-left:255px;
    padding:22px;
}

.topbar{
    max-width:1150px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.topbar h2{
    margin:0;
}

.score-box{
    background:#111b31;
    border:1px solid var(--line);
    border-radius:20px;
    padding:9px 15px;
}

.mobile-menu{
    display:none;
    border:1px solid var(--line);
    background:#ffffff08;
    color:white;
    border-radius:9px;
    padding:8px 11px;
}

.page{
    max-width:1150px;
    margin:auto;
}

.card{
    background:rgba(16,24,43,.94);
    border:1px solid var(--line);
    border-radius:17px;
    padding:20px;
    margin-bottom:14px;
}

.hero{
    text-align:center;
    padding:55px 20px;
}

.hero-icon{
    font-size:70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.tile{
    border:1px solid var(--line);
    border-radius:14px;
    background:#ffffff06;
    padding:17px;
    cursor:pointer;
    transition:.18s;
}

.tile:hover{
    border-color:var(--cyan);
    transform:translateY(-2px);
}

.tile h3{
    margin:8px 0;
}

.tile p{
    margin:0;
    color:var(--muted);
    font-size:13px;
}

.tag{
    display:inline-block;
    padding:6px 9px;
    margin:3px;
    border-radius:8px;
    background:#ffffff09;
    color:#ccd6eb;
    font-size:12px;
}

/* PROGRESS */

.progress{
    width:100%;
    height:8px;
    background:#050914;
    border-radius:99px;
    overflow:hidden;
    margin:12px 0 22px;
}

.progress-bar{
    height:100%;
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--purple),
        var(--pink)
    );
    transition:.25s;
}

/* EXERCISE */

.question{
    font-size:24px;
    line-height:1.5;
    margin:22px 0;
}

.option{
    width:100%;
    text-align:left;
    border:1px solid var(--line);
    background:#ffffff06;
    color:white;
    padding:14px;
    border-radius:11px;
    margin:6px 0;
}

.option:hover{
    border-color:var(--cyan);
}

.option.correct{
    border-color:var(--green);
    background:#36e69a18;
}

.option.wrong{
    border-color:var(--red);
    background:#ff667818;
}

.feedback{
    min-height:28px;
    color:var(--muted);
    margin-top:10px;
}

.result{
    text-align:center;
    padding:45px 20px;
}

.result-score{
    font-size:50px;
    font-weight:900;
}

/* VOCAB */

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.level-card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    background:#ffffff06;
    cursor:pointer;
    transition:.18s;
}

.level-card:hover{
    border-color:var(--cyan);
    transform:translateY(-2px);
}

.level-icon{
    font-size:45px;
}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.vocab-card{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:15px;
    background:#ffffff06;
}

.vocab-card img{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    display:block;
}

.vocab-content{
    padding:13px;
}

.vocab-word{
    font-size:22px;
    font-weight:900;
}

.vocab-vi{
    color:var(--muted);
    margin-top:4px;
}

.vocab-tools{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.vocab-tools button{
    flex:1;
}

.big-vocab-image{
    width:min(500px,100%);
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:16px;
    display:block;
    margin:0 auto 18px;
}

.answer-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.answer{
    min-height:55px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#ffffff06;
    color:white;
    padding:12px;
    font-weight:700;
}

.answer:hover{
    border-color:var(--cyan);
}

/* MATCH */

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.match-item{
    border:1px solid var(--line);
    border-radius:11px;
    background:#ffffff06;
    padding:9px;
    margin:7px 0;
    cursor:pointer;
}

.match-item:hover{
    border-color:var(--cyan);
}

.match-item.selected{
    border-color:var(--cyan);
    background:#20dcff12;
}

.match-item.done{
    opacity:.25;
    pointer-events:none;
}

.match-item img{
    width:70px;
    height:52px;
    object-fit:cover;
    border-radius:8px;
    vertical-align:middle;
    margin-right:8px;
}

/* TABLE */

.table-scroll{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:10px;
    border-bottom:1px solid var(--line);
    text-align:left;
}

th{
    color:#8c9ab8;
    font-size:12px;
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        padding:14px;
    }

    .mobile-menu{
        display:block;
    }

    .grid,
    .level-grid,
    .vocab-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:560px){

    .grid,
    .level-grid,
    .vocab-grid,
    .answer-grid,
    .match-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:15px;
    }

    .question{
        font-size:20px;
    }
}
</style>
</head>

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    }[char]));

}

function shuffle(array){

    const result = [...array];

    for(let i=result.length-1;i>0;i--){

        const j =
        Math.floor(Math.random()*(i+1));

        [result[i],result[j]] =
        [result[j],result[i]];

    }

    return result;
}

function unique(array){

    return [...new Set(array)];

}

function speak(text){

    if(!("speechSynthesis" in window)){

        alert("Trình duyệt không hỗ trợ đọc tiếng Anh.");

        return;
    }

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(text);

    utterance.lang="en-US";
    utterance.rate=.85;

    speechSynthesis.speak(utterance);

}

/* ======================================================
   REGISTER
====================================================== */

async function register(){

    const username =
    $("reg-username").value.trim();

    const email =
    $("reg-email").value.trim();

    const password =
    $("reg-password").value;

    const errorBox =
    $("auth-error");

    errorBox.textContent="";

    if(username.length<3){

        errorBox.textContent =
        "Tên người dùng phải có ít nhất 3 ký tự.";

        return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

        errorBox.textContent =
        "Email không hợp lệ.";

        return;
    }

    if(password.length<6){

        errorBox.textContent =
        "Mật khẩu phải có ít nhất 6 ký tự.";

        return;
    }


    const {data,error} =
    await db.auth.signUp({
        email,
        password
    });


    if(error){

        if(
            error.message
            .toLowerCase()
            .includes("email signups are disabled")
        ){

            errorBox.innerHTML =
            "Supabase đang <b>tắt đăng ký Email</b>. " +
            "Hãy bật Email provider/Signups trong Authentication của Supabase.";

        }else{

            errorBox.textContent =
            error.message;

        }

        return;
    }


    if(!data.user){

        errorBox.textContent =
        "Không tạo được tài khoản.";

        return;
    }


    /*
       Profile được tạo sau khi Auth thành công.

       Nếu project của bạn có RLS chặn INSERT,
       hãy dùng SQL policy ở phần hướng dẫn bên dưới.
    */

    const {error:profileError} =
    await db
    .from("profiles")
    .insert({

        id:data.user.id,
        username,
        role:"user",
        score:0,
        banned:false

    });


    if(profileError){

        errorBox.innerHTML =
        "Tài khoản Auth đã được tạo nhưng profile chưa tạo được.<br>" +
        esc(profileError.message);

        return;
    }


    if(data.session){

        await loadProfile();

    }else{

        errorBox.innerHTML =
        "🎉 Đăng ký thành công!<br>" +
        "Hãy xác nhận email nếu Supabase yêu cầu.";

    }

}

/* ======================================================
   PROFILE
====================================================== */

async function loadProfile(){

    const {
        data:{user}
    } =
    await db.auth.getUser();


    if(!user){

        showLogin();

        return;
    }


    const {
        data,
        error
    } =
    await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();


    if(error){

        alert(
            "Không đọc được profile: "+
            error.message
        );

        return;
    }


    if(!data){

        alert(
            "Tài khoản chưa có profile."
        );

        return;
    }


    /*
       BANNED EMAIL / ACCOUNT
    */

    if(data.banned === true){

        await db.auth.signOut();

        $("auth-form").innerHTML = `

            <div class="error center">
                🚫 Tài khoản này đã bị khóa.
                <br><br>
                Email của tài khoản không được phép đăng nhập.
            </div>

            <button
                class="btn2 full"
                onclick="showLogin()"
            >
                ← Quay lại
            </button>

        `;

        return;
    }


    profile=data;

    totalScore=
    Number(data.score || 0);

    renderApp();

}

/* ======================================================
   CREATE QUIZ QUESTIONS
====================================================== */

function createQuizItems(tenseKey){

    const t=TENSES[tenseKey];

    const subjects=[
        "I",
        "You",
        "We",
        "They",
        "He",
        "She"
    ];

    const result=[];

    for(let round=0;round<9;round++){

        for(let i=0;i<t.verbs.length;i++){

            const v=t.verbs[i];

            const subject=
            subjects[
                (i+round)%subjects.length
            ];

            const sign=
            t.signs[
                (i+round)%t.signs.length
            ];


            let question="";
            let answer="";


            if(tenseKey==="past"){

                question=
                `${subject} ___ ${sign}. (${v[0]})`;

                answer=v[1];

            }


            else if(tenseKey==="present"){

                const third=
                subject==="He" ||
                subject==="She";

                answer=
                third?v[1]:v[0];

                question=
                `${subject} ___ ${sign}. (${v[0]})`;

            }


            else if(tenseKey==="continuous"){

                const be =
                subject==="I"
                ?"am"
                :
                (
                    subject==="He" ||
                    subject==="She"
                )
                ?"is"
                :"are";

                answer=
                `${be} ${v[1]}`;

                question=
                `${subject} ___ ${sign}. (${v[0]})`;

            }


            else if(tenseKey==="perfect"){

                const third=
                subject==="He" ||
                subject==="She";

                const have=
                third?"has":"have";

                answer=
                `${have} ${v[1]}`;

                question=
                `${subject} ___ ${sign}. (${v[0]})`;

            }


            else if(tenseKey==="future"){

                answer=
                `will ${v[0]}`;

                question=
                `${subject} ___ ${sign}. (${v[0]})`;

            }


            const candidates=[];

            candidates.push(answer);

            candidates.push(v[0]);
            candidates.push(v[1]);

            if(tenseKey==="continuous")
                candidates.push(
                    "is "+v[1]
                );

            else if(tenseKey==="future")
                candidates.push(
                    "will "+v[1]
                );

            else if(tenseKey==="perfect")
                candidates.push(
                    "have "+v[0]
                );

            else
                candidates.push(
                    "does "+v[0]
                );


            const options=
            unique(candidates)
            .filter(x =>
                x.toLowerCase() !==
                answer.toLowerCase()
                ||
                x===answer
            );


            const finalOptions =
            unique([
                answer,
                ...shuffle(
                    options.filter(
                        x =>
                        x.toLowerCase() !==
                        answer.toLowerCase()
                    )
                )
            ]).slice(0,4);


            while(finalOptions.length<4){

                finalOptions.push(
                    answer+"?"
                );

            }


            result.push({

                question,
                answer,
                options:
                shuffle(unique(finalOptions))

            });

        }

    }


    return result.slice(0,100);

}

    const result=[];


    for(let round=0;round<5;round++){

            ];

            const sign=
            t.signs[

            ];

            if(tenseKey==="past"){

                answer=v[1];

            }else if(tenseKey==="present"){

                answer=
                subject==="He" ||
                subject==="She"
                ?v[1]
                :v[0];

            }else if(tenseKey==="continuous"){

                const be=
                subject==="I"
                ?"am"
                :
                (
                    subject==="He" ||
                    subject==="She"
                )
                ?"is"
                :"are";

                answer=

/* ======================================================

function createNegativeItems(tenseKey){

    const t=TENSES[tenseKey];

    const subjects=[
        "I","You","We",
        "They","He","She"
    ];

    const result=[];


    for(let round=0;round<5;round++){

            ];

            ];

            }


            else if(tenseKey==="perfect"){

                answer=
                (
                    subject==="He" ||
                    subject==="She"
                )
                ?
                `has not ${v[1]}`
                :
                `have not ${v[1]}`;

            }


            else{

                answer=

            }


            result.push({

/* ======================================================
   MATCH QUESTIONS
====================================================== */

function createMatchItems(tenseKey){

    const t=TENSES[tenseKey];

    const subjects=[
        "I","You","We",
        "They","He","She"
    ];

    const result=[];


    for(let round=0;round<5;round++){

        for(let i=0;i<t.verbs.length;i++){

            const v=t.verbs[i];

            const subject=
            subjects[
                (i+round)%subjects.length
            ];

            const sign=
            t.signs[
                (i+round)%t.signs.length
            ];


            let sentence;


            if(tenseKey==="past"){

                sentence=
                `${subject} ${v[1]} ${sign}`;

            }

            else if(tenseKey==="present"){

                sentence=
                `${subject} ${
                    subject==="He" ||
                    subject==="She"
                    ?v[1]
                    :v[0]
                } ${sign}`;

            }

            else if(tenseKey==="continuous"){

                const be=
                subject==="I"
                ?"am"
                :
                (
                    subject==="He" ||
                    subject==="She"
                )
                ?"is"
                :"are";

                sentence=
                `${subject} ${be} ${v[1]} ${sign}`;

            }

            else if(tenseKey==="perfect"){

                const have=
                subject==="He" ||
                subject==="She"
                ?"has"
                :"have";

                sentence=
                `${subject} ${have} ${v[1]} ${sign}`;

            }

            else{

                sentence=
                `${subject} will ${v[0]} ${sign}`;

            }


            result.push({

                id:
                `${round}-${i}`,

                left:sentence,

                right:
                `${v[2]} • ${sign}`

            });

        }

    }


    return result.slice(0,60);

}


/* ======================================================
   START EXERCISE
====================================================== */

function startExercise(type,tenseKey){

    state.type=type;
    state.tense=tenseKey;
    state.index=0;
    state.correct=0;
    state.locked=false;


    if(type==="quiz"){

        state.items=
        createQuizItems(tenseKey);

        renderQuestion();

    }

    else if(type==="verb"){

        state.items=
        createVerbItems(tenseKey);

        renderQuestion();

    }

    else if(type==="negative"){

        state.items=
        createNegativeItems(tenseKey);

        renderQuestion();

    }

    else if(type==="match"){

        state.items=
        createMatchItems(tenseKey);

        renderMatch();

    }

}

async function answerQuiz(index){

    if(state.locked)
        return;

    state.locked=true;


    const item=
    state.items[state.index];

    const selected=
    item.options[index];

    const buttons=
    document.querySelectorAll(".option");


    buttons.forEach(
        button =>
        button.disabled=true
    );


    const ok=
    selected.toLowerCase() ===
    item.answer.toLowerCase();


    buttons[index]
    .classList
    .add(ok?"correct":"wrong");


    if(ok){

        state.correct++;

        await changeScore(10);

        $("feedback").innerHTML=
        "🎉 Chính xác! <b>+10 điểm</b>";

    }else{

        const correctIndex=
        item.options.findIndex(
            x =>
            x.toLowerCase() ===
            item.answer.toLowerCase()
        );

        if(correctIndex>=0)
            buttons[correctIndex]
            .classList
            .add("correct");


        await changeScore(-5);

        $("feedback").innerHTML=
        `❌ Sai! Đáp án đúng:
        <b>${esc(item.answer)}</b>
        <br>−5 điểm`;

    }


    setTimeout(nextQuestion,800);

}

/* ======================================================
   MATCH SELECT
====================================================== */

async function selectMatch(element,side,id){

    if(
        element.classList.contains("done")
    )
        return;


    const containerId=
    side==="left"
    ?"match-left"
    :"match-right";


    document
    .querySelectorAll(
        `#${containerId} .match-item`
    )
    .forEach(x =>
        x.classList.remove("selected")
    );


    element.classList.add("selected");


    if(side==="left"){

        state.matchLeft={
            element,
            id
        };

    }else{

        state.matchRight={
            element,
            id
        };

    }


    if(
        !state.matchLeft ||
        !state.matchRight
    )
        return;


    const left=
    state.matchLeft;

    const right=
    state.matchRight;


    if(left.id===right.id){

        left.element
        .classList
        .add("done");

        right.element
        .classList
        .add("done");


        state.matchDone++;


        await changeScore(10);


        $("match-feedback").innerHTML=
        "🎉 Chính xác! <b>+10 điểm</b>";

    }else{

        await changeScore(-5);


        $("match-feedback").innerHTML=
        "❌ Sai cặp! <b>−5 điểm</b>";

    }


    $("match-count").textContent=
    `${state.matchDone}/${state.items.length}`;


    $("match-progress")
    .style.width=
    `${state.matchDone/state.items.length*100}%`;


    state.matchLeft=null;
    state.matchRight=null;


    if(
        state.matchDone ===
        state.items.length
    ){

        setTimeout(
            showExerciseResult,
            700
        );

    }

}

/* ======================================================
   VOCAB START
====================================================== */

function startVocab(level,mode){

    state.vocabLevel=level;
    state.vocabMode=mode;
    state.index=0;
    state.correct=0;
    state.locked=false;


    const words=
    VOCAB_LEVELS[level].words;


    /*
       Mỗi từ được lặp lại để tạo bộ
       luyện ổn định.
    */

    state.items=[];


    for(let r=0;r<5;r++){

        for(const word of words){

            state.items.push({

                word:word[0],
                meaning:word[1],
                image:word[2]

            });

        }

    }


    state.items=
    shuffle(state.items);


    if(mode==="match"){

        renderVocabMatch();

    }else{

        renderVocabQuestion();

    }

}

        "❌ Sai cặp! <b>−5 điểm</b>";

    }


    $("vocab-match-count")
    .textContent=
    `${state.matchDone}/${VOCAB_LEVELS[state.vocabLevel].words.length}`;


    $("vocab-match-progress")
    .style.width=
    `${
        state.matchDone/
        VOCAB_LEVELS[state.vocabLevel].words.length*
        100
    }%`;


    state.matchLeft=null;
    state.matchRight=null;


    if(
        state.matchDone===
        VOCAB_LEVELS[
            state.vocabLevel
        ].words.length
    ){

        setTimeout(
            showVocabResult,
            700
        );

    }

}

/* ======================================================
   COMPARATIVE MENU
====================================================== */

function comparativeMenu(button){

        <div class="card">

            <h2>
                📈 So sánh hơn
            </h2>

            <div class="card"
                 style="background:#080d1b">

                <h3>
                    Công thức
                </h3>

                <p>
                    Tính từ ngắn:
                    <b>adjective + er + than</b>
                </p>

                <p>
                    Tính từ dài:
                    <b>more + adjective + than</b>
                </p>

                <p>
                    good → better
                    <br>
                    bad → worse
                    <br>
                    little → less
                    <br>
                    much/many → more
                </p>

            </div>


            <h3>
                Một số ví dụ
            </h3>

            <div class="grid">

                ${COMPARATIVES.map(x=>`

                    <div class="tile">

                        <b>
                            ${x[0]}
                        </b>

                        →
                        
                        <b>
                            ${x[1]}
                        </b>

                        <p>
                            ${x[2]}
                        </p>

                    </div>

                `).join("")}

            </div>


            <button
                class="btn"
                onclick="startComparative()"
            >
                📝 Làm 100 câu
            </button>

        </div>

    `;

}


/* ======================================================
   COMPARATIVE QUESTIONS
====================================================== */

function createComparativeItems(){

    const result=[];


    for(let round=0;round<4;round++){

        for(const x of COMPARATIVES){

            result.push({

                question:
                `This car is ___ than that one. (${x[0]})`,

                answer:x[1],

                options:
                shuffle(
                    unique([
                        x[1],
                        x[0],
                        x[0]+"er",
                        "more "+x[0]
                    ])
                ).slice(0,4)

            });

        }

    }


    return result.slice(0,100);

}


function startComparative(){

    state.type="comparative";
    state.tense=null;
    state.index=0;
    state.correct=0;
    state.locked=false;

    state.items=
    createComparativeItems();


    renderComparative();

}


function renderComparative(){

    const item=
    state.items[state.index];


    const total=
    state.items.length;


    $("page-title").textContent=
    "📈 So sánh hơn";


    $("page").innerHTML=`

        <div class="card">

            <div style="
                display:flex;
                justify-content:space-between;
            ">

                <b>
                    📈 So sánh hơn
                </b>

                <b>
                    ${state.index+1}/${total}
                </b>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    style="
                    width:${state.index/total*100}%
                    "
                ></div>

            </div>


            <div class="question">
                ${esc(item.question)}
            </div>


            ${item.options.map((x,i)=>`

                <button
                    class="option"
                    onclick="
                    comparativeAnswer(
                        ${i}
                    )
                    "
                >
                    ${esc(x)}
                </button>

            `).join("")}


            <div
                id="comparative-feedback"
                class="feedback"
            ></div>

        </div>

    `;

}


async function comparativeAnswer(index){

    if(state.locked)
        return;

    state.locked=true;


    const item=
    state.items[state.index];


    const buttons=
    document.querySelectorAll(".option");


    buttons.forEach(
        x=>x.disabled=true
    );


    const selected=
    item.options[index];


    const ok=
    selected.toLowerCase()===
    item.answer.toLowerCase();


    if(ok){

        buttons[index]
        .classList
        .add("correct");


        state.correct++;

        await changeScore(10);


        $("comparative-feedback")
        .innerHTML=
        "🎉 Chính xác! <b>+10 điểm</b>";

    }else{

        buttons[index]
        .classList
        .add("wrong");


        const correctIndex=
        item.options.findIndex(
            x =>
            x.toLowerCase()===
            item.answer.toLowerCase()
        );


        if(correctIndex>=0)
            buttons[correctIndex]
            .classList
            .add("correct");


        await changeScore(-5);


        $("comparative-feedback")
        .innerHTML=
        `❌ Sai! Đáp án:
        <b>${esc(item.answer)}</b>
        <br>−5 điểm`;

    }


    setTimeout(()=>{

        state.index++;
        state.locked=false;


        if(
            state.index>=
            state.items.length
        ){

            showExerciseResult();

        }else{

            renderComparative();

        }

    },800);

}

/* ======================================================
   BAN ACCOUNT / EMAIL
====================================================== */

async function toggleBan(id,banned){

    const action=
    banned
    ?"khóa"
    :"mở khóa";


    if(
        !confirm(
            `Bạn có chắc muốn ${action} tài khoản này?`
        )
    )
        return;


    const {error}=
    await db
    .from("profiles")
    .update({
        banned
    })
    .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    adminPage();

}


/* ======================================================
   ROLE
====================================================== */

async function changeRole(id,role){

    if(
        !confirm(
            "Đổi quyền thành "+role+"?"
        )
    )
        return;


    const {error}=
    await db
    .from("profiles")
    .update({
        role
    })
    .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    adminPage();

}
