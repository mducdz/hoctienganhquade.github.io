<script>

/* =====================================================
   TÀI KHOẢN - FIX
===================================================== */

const USERS_KEY = "hocenglish_users";
const LOGIN_KEY = "hocenglish_current";

/* Đọc tài khoản an toàn */
function getUsers(){

    try{

        const raw =
            localStorage.getItem(USERS_KEY);

        if(!raw){
            return [];
        }

        const users =
            JSON.parse(raw);

        if(!Array.isArray(users)){
            localStorage.removeItem(USERS_KEY);
            return [];
        }

        return users;

    }catch(error){

        console.error(
            "Lỗi dữ liệu tài khoản:",
            error
        );

        localStorage.removeItem(USERS_KEY);

        return [];
    }
}

/* Lưu tài khoản */
function saveUsers(users){

    try{

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(users)
        );

        return true;

    }catch(error){

        console.error(
            "Không thể lưu tài khoản:",
            error
        );

        return false;
    }
}

/* User đang đăng nhập */
function currentUser(){

    try{
        return localStorage.getItem(LOGIN_KEY);
    }catch{
        return null;
    }
}

/* =====================================================
   ĐĂNG KÝ
===================================================== */

function register(){

    const userInput =
        document.getElementById("regUser");

    const passInput =
        document.getElementById("regPass");

    const error =
        document.getElementById("authError");

    if(!userInput || !passInput || !error){
        return;
    }

    const username =
        userInput.value.trim();

    const password =
        passInput.value;

    error.textContent = "";

    if(username.length < 3){

        error.textContent =
            "Tên tài khoản phải có ít nhất 3 ký tự.";

        return;
    }

    if(username.length > 30){

        error.textContent =
            "Tên tài khoản tối đa 30 ký tự.";

        return;
    }

    if(password.length < 4){

        error.textContent =
            "Mật khẩu phải có ít nhất 4 ký tự.";

        return;
    }

    const users = getUsers();

    const exists =
        users.some(x =>
            String(x.username).toLowerCase() ===
            username.toLowerCase()
        );

    if(exists){

        error.textContent =
            "Tài khoản đã tồn tại.";

        return;
    }

    const newUser = {

        username: username,

        password: password,

        score: 0,

        createdAt: Date.now()
    };

    users.push(newUser);

    if(!saveUsers(users)){

        error.textContent =
            "Không thể lưu tài khoản.";

        return;
    }

    localStorage.setItem(
        LOGIN_KEY,
        username
    );

    renderApp();
}


/* =====================================================
   ĐĂNG NHẬP
===================================================== */

function login(){

    const userInput =
        document.getElementById("loginUser");

    const passInput =
        document.getElementById("loginPass");

    const error =
        document.getElementById("authError");

    if(!userInput || !passInput || !error){
        return;
    }

    const username =
        userInput.value.trim();

    const password =
        passInput.value;

    error.textContent = "";

    const users = getUsers();

    const user =
        users.find(x =>

            String(x.username).toLowerCase() ===
            username.toLowerCase() &&

            String(x.password) === password
        );

    if(!user){

        error.textContent =
            "Sai tài khoản hoặc mật khẩu.";

        return;
    }

    localStorage.setItem(
        LOGIN_KEY,
        user.username
    );

    renderApp();
}


/* =====================================================
   ĐĂNG XUẤT
===================================================== */

function logout(){

    try{
        localStorage.removeItem(LOGIN_KEY);
    }catch(error){
        console.error(error);
    }

    globalScore = 0;

    renderAuth();
}

function shuffle(arr){

        () => Math.random() - .5
    );
}

function toggleMenu(){

    const sidebar =
        document.getElementById("sidebar");

    if(sidebar){
        sidebar.classList.toggle("open");
    }
}

function activeNone(){

    document
        .querySelectorAll(".nav")
        .forEach(x =>
            x.classList.remove("active")
        );
}

function setTitle(x){

    const title =
        document.getElementById("pageTitle");

    if(title){
        title.textContent = x;
    }
}


/* =====================================================
   ĐIỂM
===================================================== */

function addGlobal(n){

    globalScore += Number(n) || 0;

    const score =
        document.getElementById("globalScore");

    if(score){
        score.textContent =
            globalScore;
    }

    saveUserScore();
}

function loadUserScore(){

    const name = currentUser();

    if(!name){

        globalScore = 0;

        return;
    }

    const users = getUsers();

    const user =
        users.find(x =>
            x.username === name
        );

    globalScore =
        Number(user?.score) || 0;

    const score =
        document.getElementById("globalScore");

    if(score){
        score.textContent =
            globalScore;
    }
}

function saveUserScore(){

    const name = currentUser();

    if(!name)return;

    const users = getUsers();

    const user =
        users.find(x =>
            x.username === name
        );

    if(!user)return;

    user.score =
        Number(globalScore) || 0;

    saveUsers(users);
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   EMOJI IMAGE
===================================================== */

function codePoints(str){

    return [...str]
        .map(c =>
            c.codePointAt(0)
             .toString(16)
        )
        .join("-");
}

function emojiImage(emoji){

    return (
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/" +
        codePoints(emoji) +
        ".png"
    );
}

function startVocab(topic,level){

    if(
        !vocab[topic] ||
        !vocab[topic].levels[level]
    ){
        return;
    }

    vocabTopic = topic;

    vocabLevel = level;

    vocabData =
        vocab[topic].levels[level];

    vocabIndex = 0;

    vocabRound = 1;

    vocabScore = 0;

    showVocabLearn();
}

/* =====================================================
   KIỂM TRA TỪ
===================================================== */

function checkVocabWrite(){

    const item =
        vocabData[vocabIndex];

    const input =
        document.getElementById("vocabInput");

    const check =
        document.getElementById("check");

    const next =
        document.getElementById("next");

    const feedback =
        document.getElementById("feedback");

    if(!item || !input)return;

    const value =
        input.value
            .trim()
            .toLowerCase();

    input.disabled = true;

    if(check){
        check.disabled = true;
    }

    if(
        value ===
        item[0].toLowerCase()
    ){

        vocabScore += 10;

        addGlobal(10);

        feedback.innerHTML =
            "🎉 Chính xác! +10 điểm";

    }else{

        feedback.innerHTML =
            "❌ Đáp án đúng: <b>" +
            escapeHTML(item[0]) +
            "</b>";
    }

    if(next){
        next.style.display =
            "inline-block";
    }
}

function nextVocabWrite(){

    vocabIndex++;

    if(vocabIndex >= vocabData.length){

        showRound2Intro();

        return;
    }

    renderVocabWrite();
}

                            this.style.display='none'">

                    </div>

                `).join("")}

                </div>

            </div>

            <div>

                <h3>
                    🇬🇧 Từ tiếng Anh
                </h3>

                <div id="wordList">

                ${words.map(item => `

                    <div
                        class="match-item"
                        data-id="${escapeHTML(item[0])}"
                        onclick="
                        selectWord(
                            this,
                            '${item[0].replace(/'/g,"\\'")}'
                        )">

                        ${escapeHTML(item[0])}

                    </div>

                `).join("")}

                </div>

            </div>

        </div>

        <div
            id="matchFeedback"
            class="feedback">
        </div>

    </div>
    `;
}

function selectImage(el,id){

    document
        .querySelectorAll(
            "#imageList .match-item"
        )
        .forEach(x =>
            x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedImage = {
        el:el,
        id:id
    };

    tryMatch();
}

function selectWord(el,id){

    document
        .querySelectorAll(
            "#wordList .match-item"
        )
        .forEach(x =>
            x.classList.remove("selected")
        );

    el.classList.add("selected");

    selectedWord = {
        el:el,
        id:id
    };

    tryMatch();
}

function tryMatch(){

    if(
        !selectedImage ||
        !selectedWord
    ){
        return;
    }

    const feedback =
        document.getElementById(
            "matchFeedback"
        );

    if(
        selectedImage.id ===
        selectedWord.id
    ){

        selectedImage.el.style.display =
            "none";

        selectedWord.el.style.display =
            "none";

        vocabScore += 10;

        addGlobal(10);

        if(feedback){

            feedback.innerHTML =
                "🎉 Đúng! +10 điểm";
        }

    }else{

        if(feedback){

            feedback.innerHTML =
                "❌ Chưa đúng.";
        }
    }

    selectedImage = null;

    selectedWord = null;

    document
        .querySelectorAll(".match-item")
        .forEach(x =>
            x.classList.remove("selected")
        );

    checkMatchingFinished();
}

function checkMatchingFinished(){

    const remaining =
        [
            ...document.querySelectorAll(
                "#imageList .match-item"
            )
        ].filter(
            x =>
            x.style.display !== "none"
        );

    if(remaining.length === 0){

        setTimeout(
            showVocabResult,
            500
        );
    }
}
