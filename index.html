function shuffle(arr){
 const a=[...arr];

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

}

/* =========================================================
   BAN CHECK
========================================================= */

async function isBanned(email){

 const clean=normalize(email);

 const {data,error}=await db
  .from("banned_emails")
  .select("email")
  .ilike("email",clean)
  .maybeSingle();

 if(error) return false;

 return !!data;
}


/* =========================================================
   REGISTER
========================================================= */

async function register(){

 const username=$("username").value.trim();
 const email=$("email").value.trim().toLowerCase();
 const password=$("pass").value;
 const password2=$("pass2").value;

 $("err").textContent="";

 if(username.length<3){
  $("err").textContent="Tên người dùng phải có ít nhất 3 ký tự.";
  return;
 }

 if(!email.includes("@")){
  $("err").textContent="Email không hợp lệ.";
  return;
 }

 if(password.length<6){
  $("err").textContent="Mật khẩu phải có ít nhất 6 ký tự.";
  return;
 }

 if(password!==password2){
  $("err").textContent="Hai mật khẩu không giống nhau.";
  return;
 }

 if(await isBanned(email)){
  $("err").textContent="Email này đã bị khóa.";
  return;
 }

 $("err").textContent="Đang tạo tài khoản...";

 const {data,error}=await db.auth.signUp({
  email,
  password,
  options:{
   data:{
    username
   }
  }
 });

 if(error){
  $("err").textContent=error.message;
  return;
 }

 if(!data.user){
  $("err").textContent="Không tạo được tài khoản.";
  return;
 }

 /*
   Nếu Supabase đang bật Email Confirmation,
   data.session có thể null.
 */

 if(data.session){

  await createProfile(
   data.user.id,
   username,
   email
  );

  await loadProfile();

 }else{

  /*
   Không báo lỗi giả.
   Người dùng chỉ cần xác nhận email.
  */

  $("err").innerHTML=
   "✅ Đăng ký thành công!<br>"+
   "Hãy kiểm tra email để xác nhận tài khoản.";

 }

}

async function createProfile(id,username,email){

 const {data:old}=await db
  .from("profiles")
  .select("id")
  .eq("id",id)
  .maybeSingle();

 if(old) return;

 const {error}=await db
  .from("profiles")
  .insert({
   id,
   username,
   email,
   role:"user",
   score:0
  });

 if(error){
  console.error("PROFILE ERROR:",error);
 }
}

async function login(){

 const email=$("email").value.trim().toLowerCase();
 const password=$("pass").value;

 $("err").textContent="";

 if(!email||!password){
  $("err").textContent="Nhập đầy đủ email và mật khẩu.";
  return;
 }

 if(await isBanned(email)){
  $("err").textContent=
   "🚫 Tài khoản này đã bị khóa.";
  return;
 }

 const {data,error}=await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  $("err").textContent=error.message;
  return;
 }

 await loadProfile();
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

 const {
  data:{user}
 }=await db.auth.getUser();

 if(!user){
  authLogin();
  return;
 }

 if(await isBanned(user.email)){
  await db.auth.signOut();

  $("auth").classList.remove("hide");
  $("app").classList.add("hide");

  authLogin();

  $("err").textContent=
   "🚫 Email này đã bị khóa.";

  return;
 }

 let {data,error}=await db
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(error){
  alert("Lỗi profile: "+error.message);
  return;
 }

 /*
   Tự sửa trường hợp tài khoản Auth đã tồn tại
   nhưng profile chưa được tạo.
 */

 if(!data){

  const username=
   user.user_metadata?.username ||
   user.email.split("@")[0];

  await createProfile(
   user.id,
   username,
   user.email
  );

  const result=await db
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

  data=result.data;
 }

 if(!data){
  alert("Không thể tạo profile.");
  return;
 }

 profile=data;
 score=Number(data.score||0);

 renderApp();
}

/* =========================================================
   QUESTION GENERATORS
========================================================= */

function subjectFor(i){
 return SUBJECTS[i % SUBJECTS.length];
}


function beFor(sub){

 if(sub==="I") return "am";

 if(sub==="He"||sub==="She")
  return "is";

 return "are";
}


function haveFor(sub){

 return (
  sub==="He"||
  sub==="She"
 )
 ?"has"
 :"have";
}


/* =========================================================
   QUIZ
========================================================= */

function makeQuiz(k){

 const t=TENSES[k];
 const items=[];

 for(let r=0;r<9;r++){

  t.verbs.forEach((v,i)=>{

   const sub=subjectFor(i+r);
   const sign=t.signs[(i+r)%t.signs.length];

   let q="";
   let answer="";

   if(k==="past"){

    q=`${sub} ___ ${sign}. (${v[0]})`;
    answer=v[1];

   }

   else if(k==="present"){

    q=`${sub} ___ ${sign}. (${v[0]})`;

    answer=
     (sub==="He"||sub==="She")
     ?v[1]
     :v[0];

   }

   else if(k==="continuous"){

    q=`${sub} ___ ${v[0]} ${sign}.`;

    answer=
     beFor(sub)+" "+v[1];

   }

   else if(k==="perfect"){

    q=`${sub} ___ ${v[2]} ${sign}. (${v[0]})`;

    answer=
     haveFor(sub)+" "+v[1];

   }

   else if(k==="future"){

    q=`${sub} ___ ${sign}. (${v[0]})`;

    answer=
     "will "+v[0];

   }

   const wrong=[
    v[0],
    v[1],
    "does",
    "did",
    "will "+v[0],
    "is "+v[1],
    "are "+v[1],
    "have "+v[1],
    "has "+v[1]
   ];

   const opts=unique(
    [answer,...wrong]
   ).filter(x=>x!==answer);

   const finalOpts=shuffle(
    [answer,...opts.slice(0,3)]
   );

   items.push({
    q,
    a:answer,
    opts:finalOpts
   });

  });

 }

 return shuffle(items).slice(0,100);
}


/* =========================================================
   VERB
========================================================= */

function makeVerb(k){

 const t=TENSES[k];
 const items=[];

 for(let r=0;r<5;r++){

  t.verbs.forEach((v,i)=>{

   const sub=subjectFor(i+r);
   const sign=t.signs[(i+r)%t.signs.length];

   let q="";
   let a="";

   if(k==="past"){

    q=`${sub} ___ (${v[0]}) ${sign}.`;
    a=v[1];

   }

   else if(k==="present"){

    q=`${sub} ___ (${v[0]}) ${sign}.`;

    a=
     (sub==="He"||sub==="She")
     ?v[1]
     :v[0];

   }

   else if(k==="continuous"){

    q=`${sub} ___ (${v[0]}) ${sign}.`;
    a=beFor(sub)+" "+v[1];

   }

   else if(k==="perfect"){

    q=`${sub} ___ (${v[0]}) ${sign}.`;
    a=haveFor(sub)+" "+v[1];

   }

   else{

    q=`${sub} ___ (${v[0]}) ${sign}.`;
    a="will "+v[0];

   }

   items.push({q,a});

  });

 }

 return shuffle(items).slice(0,50);
}


/* =========================================================
   NEGATIVE
========================================================= */

function makeNegative(k){

 const t=TENSES[k];
 const items=[];

 for(let r=0;r<5;r++){

  t.verbs.forEach((v,i)=>{

   const sub=subjectFor(i+r);
   const sign=t.signs[(i+r)%t.signs.length];

   let q="";
   let a="";

   if(k==="past"){

    q=`${sub} ___ ${v[0]} ${sign}.`;
    a=`did not ${v[0]}`;

   }

   else if(k==="present"){

    q=`${sub} ___ ${v[0]} ${sign}.`;

    a=
     (sub==="He"||sub==="She")
     ?`does not ${v[0]}`
     :`do not ${v[0]}`;

   }

   else if(k==="continuous"){

    q=`${sub} ___ ${v[1]} ${sign}.`;
    a=`${beFor(sub)} not ${v[1]}`;

   }

   else if(k==="perfect"){

    q=`${sub} ___ ${v[1]} ${sign}.`;
    a=`${haveFor(sub)} not ${v[1]}`;

   }

   else{

    q=`${sub} ___ ${v[0]} ${sign}.`;
    a=`will not ${v[0]}`;

   }

   items.push({q,a});

  });

 }

 return shuffle(items).slice(0,50);
}


/* =========================================================
   MATCH
========================================================= */

function makeMatch(k){

 const t=TENSES[k];
 const items=[];

 for(let r=0;r<5;r++){

  t.verbs.forEach((v,i)=>{

   const sub=subjectFor(i+r);
   const sign=t.signs[(i+r)%t.signs.length];

   let left="";

   if(k==="past")
    left=`${sub} ${v[1]} ${sign}.`;

   else if(k==="present")
    left=`${sub} ${
     (sub==="He"||sub==="She")?v[1]:v[0]
    } ${sign}.`;

   else if(k==="continuous")
    left=`${sub} ${beFor(sub)} ${v[1]} ${sign}.`;

   else if(k==="perfect")
    left=`${sub} ${haveFor(sub)} ${v[1]} ${sign}.`;

   else
    left=`${sub} will ${v[0]} ${sign}.`;

   items.push({
    id:`${r}-${i}`,
    left,
    right:`${v[2]} • ${sign}`
   });

  });

 }

 return shuffle(items).slice(0,60);
}


/* =========================================================

   Không mất bài khi chuyển menu
========================================================= */

function exerciseKey(){

 return "hocenglish_exercise_"+current.type+"_"+current.tense;
}


function saveExercise(){

 try{

  sessionStorage.setItem(
   exerciseKey(),
   JSON.stringify(current)
  );

 }catch(e){
  console.warn(e);
 }
}


function clearExercise(){

 try{
  sessionStorage.removeItem(exerciseKey());
 }catch(e){}
}


function restoreExercise(type,tense){

 try{

  const raw=sessionStorage.getItem(
   "hocenglish_exercise_"+type+"_"+tense
  );

  if(!raw)return false;

  const data=JSON.parse(raw);

  if(
   !data||
   !Array.isArray(data.items)||
   data.index>=data.items.length
  ){
   return false;
  }

  current=data;

  return true;

 }catch(e){

  return false;

 }
}


/* =========================================================
   START EXERCISE
========================================================= */

function startExercise(type,k){

 if(
  restoreExercise(type,k)
 ){

  if(type==="match")
   renderMatch();
  else
   renderQuestion();

  return;
 }

 let items=[];

 if(type==="quiz")
  items=makeQuiz(k);

 if(type==="verb")
  items=makeVerb(k);

 if(type==="negative")
  items=makeNegative(k);

 if(type==="match")
  items=makeMatch(k);

 current={
  type,
  tense:k,
  index:0,
  score:0,
  items,
  locked:false
 };

 saveExercise();

 if(type==="match")
  renderMatch();
 else
  renderQuestion();
}

  normalize(answer)===
  normalize(x.a);

}

/* =========================================================
   MATCH ANSWER
========================================================= */

async function pickMatch(el,side,id){

 if(el.classList.contains("done"))
  return;

 document
  .querySelectorAll(
   `#${side==="l"?"ml":"mr"} .matchItem`
  )
  .forEach(x=>
   x.classList.remove("sel")
  );

 el.classList.add("sel");

 if(side==="l")
  matchLeft={el,id};
 else
  matchRight={el,id};

 if(!matchLeft||!matchRight)
  return;

 if(matchLeft.id===matchRight.id){

  matchLeft.el.classList.add("done");
  matchRight.el.classList.add("done");

  if(!current.completedIds)
   current.completedIds=[];

  if(
   !current.completedIds.includes(
    matchLeft.id
   )
  ){

   current.completedIds.push(
    matchLeft.id
   );

   current.score++;

   matched++;

   await addScore(1);
  }

  $("mfb").textContent="🎉 Chính xác!";

 }else{

/* =========================================================
   100 COMPARATIVE QUESTIONS
========================================================= */

function startCompare(){

 if(restoreExercise("compare","main")){

  renderCompareQuestion();

  return;
 }

 const items=[];

 /*
   60+ từ được lặp theo các mẫu câu khác nhau
   để tạo đủ 100 câu.
 */

 const templates=[
  x=>`${x[2]}: This car is ___ than that car. (${x[0]})`,
  x=>`${x[2]}: My house is ___ than yours. (${x[0]})`,
  x=>`${x[2]}: This exercise is ___ than the previous one. (${x[0]})`,
  x=>`${x[2]}: Today is ___ than yesterday. (${x[0]})`,
  x=>`${x[2]}: This book is ___ than that book. (${x[0]})`
 ];

 for(let r=0;r<5;r++){

  COMPARATIVES.forEach((x,i)=>{

   const template=
    templates[(r+i)%templates.length];

   const correct=x[1];

   const wrongs=unique([
    x[0],
    x[0]+"er",
    "more "+x[0],
    "less "+x[0],
    "most "+x[0]
   ]).filter(v=>v!==correct);

   items.push({
    q:template(x),
    a:correct,
    opts:shuffle([
     correct,
     ...wrongs.slice(0,3)
    ])
   });

  });

 }

 current={
  type:"compare",
  tense:"main",
  index:0,
  score:0,
  items:shuffle(items).slice(0,100),
  locked:false
 };

 saveExercise();

 renderCompareQuestion();
}

  </div>

  `).join("")}

 </div>

 `;

/* =========================================================
   COMPARATIVE ANSWER
========================================================= */

async function answerCompare(el,index){

 if(current.locked)return;

 current.locked=true;

 const x=current.items[current.index];
 const answer=x.opts[index];

 const ok=
  normalize(answer)===
  normalize(x.a);

 el.classList.add(
  ok?"good":"bad"
 );

 if(ok){

  current.score++;

  await addScore(1);

  $("fb").textContent=
   "🎉 Chính xác!";

 }else{

  $("fb").innerHTML=
   `❌ Đáp án đúng:
    <b>${esc(x.a)}</b>`;

 }

 saveExercise();

 setTimeout(()=>{

  current.index++;
  current.locked=false;

  if(current.index>=100){

   clearExercise();

   result();

  }else{

   saveExercise();

   renderCompareQuestion();

  }

 },650);
}
