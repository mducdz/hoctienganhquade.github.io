/* =========================================================
   UTILS
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function codePoints(str){
  return [...str]
    .map(c=>c.codePointAt(0).toString(16))
    .join("-");
}

function emojiImage(emoji){
  return "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
    +codePoints(emoji)+".png";
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function setPageTitle(text){
  const el=$("pageTitle");
  if(el)el.textContent=text;
}

function closeMobile(){
  const s=$("sidebar");
  if(s)s.classList.remove("open");
}

function toggleMenu(){
  const s=$("sidebar");
  if(s)s.classList.toggle("open");
}

function setActive(btn){
  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active"));
  if(btn)btn.classList.add("active");
}

async function register(){

  const email=$("registerEmail")?.value.trim();
  const password=$("registerPassword")?.value;

  $("authError").textContent="";

  if(!email || !email.includes("@")){
    $("authError").textContent="Nhập email hợp lệ.";
    return;
  }

  if(password.length<6){
    $("authError").textContent="Mật khẩu phải có ít nhất 6 ký tự.";
    return;
  }

  const client=await loadSupabase();

  const {data,error}=await client.auth.signUp({
    email,
    password
  });

  if(error){
    $("authError").textContent=error.message;
    return;
  }

  if(data.user){

    await client.from("profiles").upsert({
      id:data.user.id,
      email:data.user.email,
      role:"user",
      score:0
    });

    if(data.session){
      await boot();
    }else{
      $("authError").textContent=
        "Đăng ký thành công. Hãy xác nhận email rồi đăng nhập.";
    }
  }
}

async function login(){

  const email=$("loginEmail")?.value.trim();
  const password=$("loginPassword")?.value;

  $("authError").textContent="";

  const client=await loadSupabase();

  const {data,error}=await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("authError").textContent=error.message;
    return;
  }

  user=data.user;
  await boot();
}

async function logout(){

  const client=await loadSupabase();

  await client.auth.signOut();

  user=null;
  profile=null;
  globalScore=0;

  renderAuth();
}

/* =========================================================
   PROFILE
   ========================================================= */

async function loadProfile(){

  const client=await loadSupabase();

  const {data,error}=await client
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  if(!data){

    const {data:newProfile,error:createError}=await client
      .from("profiles")
      .insert({
        id:user.id,
        email:user.email,
        role:"user",
        score:0
      })
      .select()
      .single();

    if(createError){
      console.error(createError);
      profile={
        id:user.id,
        email:user.email,
        role:"user",
        score:0
      };
    }else{
      profile=newProfile;
    }

  }else{
    profile=data;
  }

  globalScore=Number(profile?.score||0);
}


/* =========================================================
   SAVE SCORE
   ========================================================= */

async function saveScore(){

  if(!user)return;

  globalScore=Math.max(0,globalScore);

  const client=await loadSupabase();

  const {error}=await client
    .from("profiles")
    .update({score:globalScore})
    .eq("id",user.id);

  if(error)console.error(error);

  if(profile)profile.score=globalScore;

  const scoreEl=$("globalScore");
  if(scoreEl)scoreEl.textContent=globalScore;
}

async function addScore(points){

  globalScore+=points;

  const scoreEl=$("globalScore");
  if(scoreEl)scoreEl.textContent=globalScore;

  await saveScore();
}

async function checkVocabWrite(){

  const item=vocabData[vocabIndex];

  const input=$("vocabInput");

  if(!input)return;

  const value=input.value.trim().toLowerCase();

  if(!value){
    $("feedback").innerHTML=
      `<span class="error">Hãy nhập đáp án.</span>`;
    return;
  }

  input.disabled=true;
  $("checkBtn").disabled=true;

  if(value===item[0].toLowerCase()){

    vocabScore+=10;

    await addScore(10);

    $("feedback").innerHTML=
      `<span class="success">🎉 Chính xác! +10 điểm</span>`;

  }else{

    $("feedback").innerHTML=
      `❌ Đáp án đúng: <b>${escapeHTML(item[0])}</b>`;

  }

  $("nextBtn").style.display="inline-block";
}

function nextVocabWrite(){

  vocabIndex++;

  if(vocabIndex>=10){

    showRound2Intro();
    return;

  }

  renderVocabWrite();
}

function startMatching(){

  const images=shuffle(vocabData);
  const words=shuffle(vocabData);

  selectedImage=null;
  selectedWord=null;

  setPageTitle("🔗 Nối từ");

  $("page").innerHTML=`

  <div class="card">

    <div class="match">

      <div>

        <h3>🖼️ Hình ảnh</h3>

        <div id="imageList">

          ${images.map(item=>`

            <div class="match-item"
              data-id="${escapeHTML(item[0])}"
              onclick="selectImage(this,'${escapeHTML(item[0])}')">

              <img class="match-img"
                src="${emojiImage(item[2])}"
                onerror="this.style.display='none'">

            </div>

          `).join("")}

        </div>

      </div>

      <div>

        <h3>🇬🇧 Từ tiếng Anh</h3>

        <div id="wordList">

          ${words.map(item=>`

            <div class="match-item"
              data-id="${escapeHTML(item[0])}"
              onclick="selectWord(this,'${escapeHTML(item[0])}')">

              ${escapeHTML(item[0])}

            </div>

          `).join("")}

        </div>

      </div>

    </div>

    <div id="matchFeedback" class="feedback"></div>

  </div>
  `;
}

function selectImage(el,id){

  document.querySelectorAll("#imageList .match-item")
    .forEach(x=>x.classList.remove("selected"));

  el.classList.add("selected");

  selectedImage={el,id};

  tryMatch();
}

function selectWord(el,id){

  document.querySelectorAll("#wordList .match-item")
    .forEach(x=>x.classList.remove("selected"));

  el.classList.add("selected");

  selectedWord={el,id};

  tryMatch();
}

async function tryMatch(){

  if(!selectedImage || !selectedWord)return;

  const feedback=$("matchFeedback");

  if(selectedImage.id===selectedWord.id){

    selectedImage.el.classList.add("done");
    selectedWord.el.classList.add("done");

    vocabScore+=10;

    await addScore(10);

    feedback.innerHTML=
      `<span class="success">🎉 Chính xác! +10 điểm</span>`;

  }else{

    feedback.innerHTML=
      `<span class="error">❌ Chưa đúng.</span>`;

  }

  selectedImage=null;
  selectedWord=null;

  document.querySelectorAll(".match-item")
    .forEach(x=>x.classList.remove("selected"));

  const remaining=[
    ...document.querySelectorAll("#imageList .match-item")
  ].filter(x=>!x.classList.contains("done"));

  if(remaining.length===0){

    setTimeout(showVocabResult,600);

  }
}

      🚪 Đăng xuất
    </button>

  </div>
  `;
}


/* =========================================================
   ADMIN PANEL
   ========================================================= */

async function adminPage(btn){

  if(profile?.role!=="admin"){
    alert("Bạn không có quyền admin.");
    return;
  }

  setActive(btn);
  closeMobile();
  setPageTitle("👑 Admin Panel");

  $("page").innerHTML=`

  <div class="card">

    <h2>👑 Quản lý tài khoản</h2>

    <p class="muted">
      Chỉ tài khoản có role <b>admin</b> mới xem được trang này.
    </p>

    <div id="adminContent">
      Đang tải...
    </div>

  </div>
  `;

  await loadAdminUsers();
}

async function loadAdminUsers(){

  if(profile?.role!=="admin")return;

  const client=await loadSupabase();

  const {data,error}=await client
    .from("profiles")
    .select("id,email,role,score,created_at")
    .order("created_at",{ascending:false});

  if(error){

    $("adminContent").innerHTML=`
      <div class="error">
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  if(!data?.length){

    $("adminContent").innerHTML=
      `<p class="muted">Chưa có tài khoản.</p>`;

    return;
  }

  $("adminContent").innerHTML=`

  <div style="overflow:auto">

    <table class="admin-table">

      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Điểm</th>
          <th>Ngày tạo</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody>

        ${data.map(x=>`

          <tr>

            <td>${escapeHTML(x.email||"")}</td>

            <td>
              <span class="badge ${x.role==="admin"?"admin":""}">
                ${escapeHTML(x.role||"user")}
              </span>
            </td>

            <td>⭐ ${Number(x.score||0)}</td>

            <td>
              ${x.created_at
                ?new Date(x.created_at).toLocaleDateString("vi-VN")
                :"—"}
            </td>

            <td>

              ${
                x.id!==user.id
                ?`
                <button class="secondary"
                  onclick="changeRole('${x.id}','${x.role==="admin"?"user":"admin"}')">
                  ${x.role==="admin"
                    ?"⬇️ Hạ quyền"
                    :"⬆️ Cấp admin"}
                </button>
                `
                :`
                <span class="muted">Tài khoản hiện tại</span>
                `
              }

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>

  </div>
  `;
}

async function changeRole(id,newRole){

  if(profile?.role!=="admin"){
    alert("Không có quyền.");
    return;
  }

  if(id===user.id){
    alert("Không tự thay đổi role của chính mình.");
    return;
  }

  const ok=confirm(
    "Đổi role tài khoản này thành "+newRole+"?"
  );

  if(!ok)return;

  const client=await loadSupabase();

  const {error}=await client
    .from("profiles")
    .update({role:newRole})
    .eq("id",id);

  if(error){

    alert(error.message);
    return;

  }

  await loadAdminUsers();
}


/* =========================================================
   SESSION INIT
   ========================================================= */

async function init(){

  try{

    const client=await loadSupabase();

    const {data,error}=await client.auth.getSession();

    if(error){
      console.error(error);
      renderAuth();
      return;
    }

    if(data.session){

      user=data.session.user;

      await boot();

    }else{

      renderAuth();

    }

    client.auth.onAuthStateChange(
      async(event,session)=>{

        if(session && !user){

          user=session.user;

          await boot();

        }

        if(!session){

          user=null;
          profile=null;
        }

      }
    );

  }catch(err){

    console.error(err);

  }
}

init();

</script>
</body>
</html>
