<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOC ENGLISH</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#070b18;
    color:#fff;
}
button,input{font:inherit}
.app{display:flex;min-height:100vh}

.sidebar{
    width:225px;
    position:fixed;
    left:0;top:0;bottom:0;
    overflow:auto;
    padding:14px 10px;
    background:#0d1328;
    border-right:1px solid #263252;
}
.logo{
    padding:10px;
    margin-bottom:10px;
    border-bottom:1px solid #263252;
}
.logo h1{
    margin:0;
    font-size:21px;
    background:linear-gradient(90deg,#20dcff,#8c5cff,#ff4db8);
    -webkit-background-clip:text;
    color:transparent;
}
.logo small{color:#8794b5}

.title{
    color:#667394;
    font-size:10px;
    font-weight:bold;
    margin:14px 8px 5px;
}
.nav{
    width:100%;
    border:0;
    background:transparent;
    color:#aeb9d1;
    padding:9px;
    border-radius:8px;
    text-align:left;
    margin:2px 0;
    cursor:pointer;
}
.nav:hover{background:#ffffff0a;color:white}
.nav.active{
    color:white;
    background:#20dcff15;
    border-left:3px solid #20dcff;
}

.main{
    margin-left:225px;
    width:calc(100% - 225px);
    padding:20px;
}
.top{
    max-width:1080px;
    margin:auto auto 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.top h2{margin:0;font-size:22px}
.score{
    background:#111a32;
    border:1px solid #263252;
    padding:7px 13px;
    border-radius:20px;
}

.page{max-width:1080px;margin:auto}

.card{
    background:#10172d;
    border:1px solid #263252;
    border-radius:13px;
    padding:17px;
    margin-bottom:12px;
}

.hero{text-align:center;padding:35px 20px}
.hero .emoji{font-size:50px}
.hero h1{font-size:28px}
.hero p{color:#9ca9c7;line-height:1.6}

.primary,.secondary{
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    margin:3px;
}
.primary{
    color:white;
    border:0;
    background:linear-gradient(135deg,#17d8ff,#765bff,#ff3fae);
}
.secondary{
    color:white;
    background:#ffffff0b;
    border:1px solid #34405e;
}

.formula{
    background:#080d1d;
    border:1px solid #202c49;
    border-radius:8px;
    padding:10px;
    margin:5px 0;
    color:#dce4f5;
}
.lesson h3{color:#20dcff;font-size:14px}
.lesson p{color:#bdc8df;line-height:1.6}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.tag{
    background:#ffffff0b;
    padding:6px 9px;
    border-radius:7px;
    font-size:12px;
    color:#cbd5e9;
}

.exercise-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.progress{
    height:6px;
    background:#050915;
    border-radius:20px;
    overflow:hidden;
    margin:8px 0 17px;
}
.progress div{
    height:100%;
    background:linear-gradient(90deg,#20dcff,#765bff,#ff3fae);
}

.question{
    font-size:18px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:14px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}
.answer{
    border:1px solid #293654;
    background:#ffffff07;
    color:white;
    padding:12px;
    border-radius:9px;
    cursor:pointer;
    text-align:left;
}
.answer:hover{background:#ffffff12}
.correct{border-color:#39e58c!important;background:#39e58c18!important}
.wrong{border-color:#ff5268!important;background:#ff526818!important}

.feedback{
    min-height:22px;
    margin:10px 0;
    font-weight:bold;
}

.input{
    width:100%;
    padding:11px;
    background:#070c1b;
    color:white;
    border:1px solid #293654;
    border-radius:8px;
    outline:none;
}

.input:focus{border-color:#20dcff}

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}
.level-card{
    border:1px solid #293654;
    background:#ffffff06;
    border-radius:12px;
    padding:15px;
    cursor:pointer;
    transition:.15s;
}
.level-card:hover{
    transform:translateY(-2px);
    border-color:#20dcff;
}
.level-card .big{font-size:30px}
.level-card h3{margin:8px 0 5px}
.level-card p{
    color:#8794b5;
    font-size:11px;
    margin:0;
}

.topic-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}
.topic{
    border:1px solid #263252;
    background:#ffffff06;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
}
.topic:hover{border-color:#20dcff}
.topic-icon{font-size:28px}
.topic h3{font-size:13px;margin:6px 0}
.topic p{font-size:11px;color:#8794b5;margin:0}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}
.vocab-card{
    padding:11px;
    background:#ffffff06;
    border:1px solid #263252;
    border-radius:10px;
    text-align:center;
}
.vocab-card img{
    width:65px;
    height:65px;
    object-fit:contain;
}
.vocab-card .emoji{
    font-size:48px;
    height:65px;
}
.vocab-card h3{
    font-size:13px;
    margin:5px 0;
}
.vocab-card p{
    font-size:11px;
    color:#8794b5;
    margin:0;
}

.vocab-image{
    height:210px;
    background:#080d1d;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:13px;
}
.vocab-image img{
    width:175px;
    height:175px;
    object-fit:contain;
}
.vocab-image .fallback{font-size:90px}

.info-word{
    text-align:center;
    margin-bottom:12px;
}
.info-word strong{font-size:23px}
.info-word span{
    display:block;
    color:#9ca9c7;
    margin-top:4px;
}

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}
.match-item{
    border:1px solid #293654;
    background:#ffffff06;
    border-radius:9px;
    padding:8px;
    margin-bottom:6px;
    cursor:pointer;
}
.match-item.selected{
    border-color:#20dcff;
    background:#20dcff15;
}
.match-img{
    width:48px;
    height:48px;
    object-fit:contain;
    vertical-align:middle;
}

.result{
    text-align:center;
    padding:32px;
}
.result-score{
    font-size:48px;
    color:#ffe66d;
    font-weight:bold;
    margin:10px;
}

.mobile{display:none}

@media(max-width:900px){
    .level-grid{grid-template-columns:1fr 1fr}
    .topic-grid{grid-template-columns:1fr 1fr}
    .vocab-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
    .sidebar{
        transform:translateX(-100%);
        transition:.2s;
        z-index:10;
    }
    .sidebar.open{transform:translateX(0)}
    .main{
        margin-left:0;
        width:100%;
        padding:12px;
    }
    .mobile{
        display:block;
        background:#ffffff08;
        border:1px solid #293654;
        color:white;
        border-radius:8px;
        padding:6px 9px;
    }
    .answers{grid-template-columns:1fr}
    .vocab-grid{grid-template-columns:1fr 1fr}
    .match-grid{grid-template-columns:1fr}
}
</style>
</head>

function activeNone(){

function toggleMenu(){

function setTitle(x){

}

function addGlobal(n){

}

function safe(x){

}

/* =========================================================
   EXERCISE
========================================================= */

function startExercise(type){

    currentExercise=type;
    questionIndex=0;
    exerciseScore=0;

    if(type==="quiz")questions=shuffle(quiz[currentTense]);
    if(type==="verb")questions=shuffle(verbs[currentTense]);
    if(type==="join")questions=shuffle(joins[currentTense]);

    renderExercise();
}

function renderExercise(){

    let total=questions.length;

    setTitle(
        currentExercise==="quiz"?"🎯 Quiz":
        currentExercise==="verb"?"✏️ Chia động từ":
        "🔗 Nối câu"
    );

    document.getElementById("page").innerHTML=`

    <div class="card">

        <div style="display:flex;justify-content:space-between;color:#9ca9c7;font-size:12px">
            <span>Câu ${questionIndex+1}/${total}</span>
            <span>⭐ ${exerciseScore}</span>
        </div>

        <div class="progress">
            <div style="width:${questionIndex/total*100}%"></div>
        </div>

        <div id="exercise"></div>

    </div>
    `;

    if(currentExercise==="quiz")renderQuiz();
    if(currentExercise==="verb")renderVerb();
    if(currentExercise==="join")renderJoin();
}


/* =========================================================
   QUIZ
========================================================= */

function renderQuiz(){

    let q=questions[questionIndex];

    document.getElementById("exercise").innerHTML=`

    <div class="question">${q[0]}</div>

    <div class="answers">

    ${shuffle(q[2]).map(x=>`
        <button class="answer"
        onclick="quizAnswer(this,'${safe(x)}')">
        ${x}
        </button>
    `).join("")}

    </div>

    <div id="feedback" class="feedback"></div>

    <button id="next" class="primary" style="display:none"
    onclick="nextExercise()">
    Câu tiếp theo →
    </button>
    `;
}

function quizAnswer(btn,value){

    let q=questions[questionIndex];

    document.querySelectorAll(".answer")
    .forEach(x=>x.disabled=true);

    if(value===q[1]){

        btn.classList.add("correct");
        exerciseScore++;
        addGlobal(10);

        document.getElementById("feedback").innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        btn.classList.add("wrong");

        document.getElementById("feedback").innerHTML=
        "❌ Sai! Đáp án đúng: <b>"+q[1]+"</b>";

        document.querySelectorAll(".answer").forEach(x=>{
            if(x.textContent.trim()===q[1])
                x.classList.add("correct");
        });
    }

    document.getElementById("next").style.display="inline-block";
}


/* =========================================================
   CHIA ĐỘNG TỪ
========================================================= */

function renderVerb(){

    let q=questions[questionIndex];

    document.getElementById("exercise").innerHTML=`

    <div class="question">${q[0]}</div>

    <input id="verbInput"
    class="input"
    placeholder="Nhập đáp án..."
    autocomplete="off">

    <div id="feedback" class="feedback"></div>

    <button id="check" class="primary"
    onclick="checkVerb()">
    ✓ Kiểm tra
    </button>

    <button id="next" class="primary"
    style="display:none"
    onclick="nextExercise()">
    Câu tiếp theo →
    </button>
    `;
}

function checkVerb(){

    let input=document.getElementById("verbInput");
    let value=input.value.trim().toLowerCase();
    let answer=questions[questionIndex][1].toLowerCase();

    input.disabled=true;
    document.getElementById("check").disabled=true;

    if(value===answer){

        exerciseScore++;
        addGlobal(10);

        document.getElementById("feedback").innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        document.getElementById("feedback").innerHTML=
        "❌ Đáp án đúng: <b>"+questions[questionIndex][1]+"</b>";
    }

    document.getElementById("next").style.display="inline-block";
}


/* =========================================================
   NỐI CÂU
========================================================= */

function renderJoin(){

    let correct=questions[questionIndex];
    let words=shuffle(correct.split(" / "));

    document.getElementById("exercise").innerHTML=`

    <div class="question">
    🔗 Bấm các từ theo đúng thứ tự.
    </div>

    <div id="wordBox" class="word-box"></div>

    <div id="answerArea"
    style="min-height:55px;padding:9px;border:1px dashed #20dcff66;border-radius:9px;display:flex;flex-wrap:wrap;gap:5px">
    </div>

    <div id="feedback" class="feedback"></div>

    <button class="primary" onclick="checkJoin()">
    ✓ Kiểm tra
    </button>

    <button id="next" class="primary"
    style="display:none"
    onclick="nextExercise()">
    Câu tiếp theo →
    </button>
    `;

    let box=document.getElementById("wordBox");

    words.forEach(word=>{

        let b=document.createElement("button");
        b.className="word";
        b.textContent=word;

        b.onclick=function(){

            if(b.classList.contains("used"))return;

            b.classList.add("used");

            let clone=document.createElement("button");
            clone.className="word";
            clone.textContent=word;

            clone.onclick=function(){
                clone.remove();
                b.classList.remove("used");
            };

            document.getElementById("answerArea").appendChild(clone);
        };

        box.appendChild(b);
    });
}

function checkJoin(){

    let correct=questions[questionIndex]
    .replaceAll(" / "," ")
    .trim()
    .toLowerCase();

    let chosen=[...
        document.getElementById("answerArea").children
    ].map(x=>x.textContent)
    .join(" ")
    .trim()
    .toLowerCase();

    if(chosen===correct){

        exerciseScore++;
        addGlobal(10);

        document.getElementById("feedback").innerHTML=
        "🎉 Chính xác! +10 điểm";

    }else{

        document.getElementById("feedback").innerHTML=
        "❌ Chưa đúng! Đáp án: <b>"+correct+"</b>";
    }

    document.getElementById("next").style.display="inline-block";
}

function codePoints(str){

    .map(c=>c.codePointAt(0).toString(16))
    .join("-");
}

function emojiImage(emoji){
    return "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
    +codePoints(emoji)+".png";
}

        "❌ Đáp án đúng: <b>"+item[0]+"</b>";
    }

    document.getElementById("next").style.display="inline-block";
}

function nextVocabWrite(){

    vocabIndex++;

    if(vocabIndex>=10){

        vocabRound=2;
        vocabIndex=0;

        showRound2Intro();
        return;
    }

    renderVocabWrite();
}


/* =========================================================
   LƯỢT 2
========================================================= */

function showRound2Intro(){

    setTitle("🔗 Lượt 2");

    document.getElementById("page").innerHTML=`

    <div class="card result">

        <div style="font-size:55px">🧠</div>

        <h2>Hoàn thành lượt 1!</h2>

        <div class="result-score">
        ${vocabScore}/100
        </div>

        <p style="color:#9ca9c7">
        Bây giờ hãy nối hình ảnh với từ tiếng Anh.
        </p>

        <button class="primary"
        onclick="startMatching()">
        🔗 Bắt đầu nối từ
        </button>

    </div>
    `;
}


/* =========================================================
   MATCHING
========================================================= */

function startMatching(){

    vocabRound=2;

    let data=getVocabData();

    let images=shuffle(data.items);
    let words=shuffle(data.items);

    selectedImage=null;
    selectedWord=null;

    setTitle("🔗 Nối ảnh với từ");

    document.getElementById("page").innerHTML=`

    <div class="card">

        <div style="display:flex;justify-content:space-between">
            <span>🔗 Lượt 2 — Nối từ</span>
            <span>10 cặp</span>
        </div>

        <p style="color:#9ca9c7">
        Bấm một hình ảnh, sau đó bấm từ tiếng Anh tương ứng.
        </p>

        <div class="match-grid">

            <div>
                <h3>🖼️ Hình ảnh</h3>

                <div id="imageList">

                ${images.map(item=>`

                    <div class="match-item"
                    data-id="${safe(item[0])}"
                    onclick="selectImage(this,'${safe(item[0])}')">

                        <img
                        class="match-img"
                        src="${emojiImage(item[2])}"
                        onerror="this.style.display='none'">

                    </div>

                `).join("")}

                </div>
            </div>

            <div>
                <h3>🇬🇧 Từ tiếng Anh</h3>

                <div id="wordList">

                ${words.map(item=>`

                    <div class="match-item"
                    data-id="${safe(item[0])}"
                    onclick="selectWord(this,'${safe(item[0])}')">

                        ${item[0]}

                    </div>

                `).join("")}

                </div>
            </div>

        </div>

        <div id="matchFeedback" class="feedback"></div>

    </div>
    `;
}

function selectImage(el,id){

    document.querySelectorAll("#imageList .match-item")
    .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");

    selectedImage={el,id};

    tryMatch();
}

function selectWord(el,id){

    document.querySelectorAll("#wordList .match-item")
    .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");

    selectedWord={el,id};

    tryMatch();
}

function tryMatch(){

    if(!selectedImage || !selectedWord)return;

    if(selectedImage.id===selectedWord.id){

        selectedImage.el.style.display="none";
        selectedWord.el.style.display="none";

        vocabScore+=10;
        addGlobal(10);

        document.getElementById("matchFeedback").innerHTML=
        "🎉 Đúng! +10 điểm";

    }else{

        document.getElementById("matchFeedback").innerHTML=
        "❌ Chưa khớp, hãy thử lại.";

    }

    selectedImage=null;
    selectedWord=null;

    document.querySelectorAll(".match-item")
    .forEach(x=>x.classList.remove("selected"));

    checkMatchingFinished();
}

function checkMatchingFinished(){

    let remaining=[...
        document.querySelectorAll("#imageList .match-item")
    ].filter(x=>x.style.display!=="none");

    if(remaining.length===0){
        setTimeout(showVocabResult,500);
    }
}


/* =========================================================
   KẾT QUẢ VOCAB
========================================================= */

function showVocabResult(){

    let percent=Math.round(vocabScore/200*100);

    setTitle("🏆 Kết quả từ vựng");

    document.getElementById("page").innerHTML=`

    <div class="card result">

        <div style="font-size:55px">🏆</div>

        <h2>Hoàn thành 2 lượt!</h2>

        <p style="color:#9ca9c7">
        Cấp độ: ${vocabLevels[currentLevel].icon}
        ${vocabLevels[currentLevel].name}
        </p>

        <div class="result-score">
        ${vocabScore}/200
        </div>

        <p style="color:#9ca9c7">
        Độ chính xác: ${percent}%
        </p>

        <button class="primary"
        onclick="startVocab('${currentTopic}')">
        🔄 Học lại
        </button>

        <button class="secondary"
        onclick="selectLevel('${currentLevel}')">
        📚 Chủ đề khác
        </button>

        <button class="secondary"
        onclick="vocabList(null)">
        🧠 Đổi cấp độ
        </button>

    </div>
    `;
}


/* =========================================================
   KHỞI ĐỘNG
========================================================= */

home(document.querySelector(".nav"));

</script>
