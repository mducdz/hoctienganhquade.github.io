<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HỌC ENGLISH</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:#fff;
background:
radial-gradient(circle at 10% 10%,#ff00cc55,transparent 30%),
radial-gradient(circle at 90% 10%,#00e5ff55,transparent 30%),
radial-gradient(circle at 50% 100%,#7c3aed66,transparent 40%),
linear-gradient(135deg,#080019,#101044,#001d3d);
}

header{text-align:center;padding:35px 15px}

.logo{font-size:50px}

h1{
font-size:42px;
background:linear-gradient(90deg,#00e5ff,#fff,#ff3dcc);
-webkit-background-clip:text;
color:transparent;
}

header p{color:#cbd8f5;margin-top:8px}

.container{width:92%;max-width:1050px;margin:auto}

.glass{
background:#ffffff0d;
border:1px solid #ffffff20;
backdrop-filter:blur(18px);
border-radius:24px;
box-shadow:0 20px 60px #0005;
}

.menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
margin-bottom:20px;
}

.menu button{
border:0;
padding:16px 10px;
border-radius:17px;
background:#ffffff0b;
color:#fff;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.menu button:hover{transform:translateY(-2px)}

.menu button.active{
background:linear-gradient(135deg,#00c6ff,#7c3aed,#ff2fb3);
}

.lesson{
padding:28px;
margin-bottom:20px;
}

.lesson h2{margin-bottom:12px}

.lesson h3{
color:#6feaff;
margin:22px 0 10px;
}

.formula{
background:#0005;
padding:14px;
border-radius:14px;
margin:8px 0;
line-height:1.7;
}

.signs{
display:flex;
flex-wrap:wrap;
gap:9px;
}

.sign{
padding:10px 14px;
border-radius:14px;
background:#ffffff0d;
border:1px solid #ffffff18;
}

.start{
padding:30px;
text-align:center;
margin-bottom:20px;
}

.btn{
border:0;
padding:14px 27px;
border-radius:30px;
margin-top:17px;
font-weight:bold;
cursor:pointer;
color:#fff;
background:linear-gradient(135deg,#00c6ff,#7c3aed,#ff2fb3);
}

.quiz{
display:none;
padding:28px;
margin-bottom:25px;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.progress{
height:9px;
background:#0006;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0;
background:linear-gradient(90deg,#00e5ff,#ff3dcc);
transition:.3s;
}

.qnum{
margin-top:18px;
color:#91eaff;
font-weight:bold;
}

.question{
font-size:23px;
font-weight:bold;
line-height:1.5;
margin:15px 0 20px;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.answer{
padding:16px;
border-radius:16px;
border:1px solid #ffffff20;
background:#ffffff0b;
color:white;
cursor:pointer;
text-align:left;
font-size:16px;
}

.answer.correct{
background:#16a34acc;
border-color:#4ade80;
}

.answer.wrong{
background:#dc2626cc;
border-color:#f87171;
}

.answer:disabled{cursor:default}

.feedback{
min-height:28px;
margin:15px 0;
font-weight:bold;
}

.next{
display:none;
padding:12px 22px;
border:0;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}

.result{
display:none;
text-align:center;
padding-top:15px;
}

.bigscore{
font-size:60px;
font-weight:bold;
color:#ffe66d;
margin:15px;
}

/* INPUT QUIZ */

.inputBox{
width:100%;
padding:16px;
border-radius:15px;
border:2px solid #ffffff25;
background:#0005;
color:white;
font-size:18px;
outline:none;
}

.inputBox:focus{
border-color:#00e5ff;
}

.check{
border:0;
padding:13px 25px;
border-radius:25px;
background:#00c6ff;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.hint{
margin-top:12px;
color:#aebee0;
}

/* DRAG QUIZ */

.drag-area{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:18px;
min-height:75px;
border:2px dashed #ffffff35;
border-radius:18px;
margin-bottom:15px;
}

.word{
padding:12px 17px;
border-radius:14px;
background:linear-gradient(135deg,#7c3aed,#ff2fb3);
cursor:grab;
font-weight:bold;
user-select:none;
}

.drop{
min-height:75px;
padding:15px;
border:2px dashed #00e5ff77;
border-radius:18px;
display:flex;
flex-wrap:wrap;
gap:9px;
margin-bottom:15px;
}

.drop .word{cursor:grab}

footer{
text-align:center;
padding:30px;
color:#9eadd0;
}

@media(max-width:700px){
h1{font-size:31px}

.menu{
grid-template-columns:1fr;
}

.answers{
grid-template-columns:1fr;
}

.lesson,.quiz{
padding:20px;
}

.question{
font-size:20px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">📚✨</div>
<h1>HỌC ENGLISH</h1>
<p>Ngữ pháp • Quiz • Luyện tập</p>
</header>

<div class="container">

<!-- MENU -->

<div class="glass menu">

<button id="m1" class="active" onclick="showMode('mc')">
🎯 TRẮC NGHIỆM
</button>

<button id="m2" onclick="showMode('verb')">
✏️ CHIA ĐỘNG TỪ
</button>

<button id="m3" onclick="showMode('join')">
🔗 NỐI CÂU
</button>

</div>

<!-- LESSON -->

<div id="lesson" class="glass lesson"></div>

<!-- START -->

<div id="start" class="glass start">

<h2 id="startTitle">🎯 QUIZ TRẮC NGHIỆM</h2>

<p id="startText">
Chọn đáp án đúng trong 100 câu của thì đang học.
</p>

<button class="btn" onclick="startGame()">
🚀 BẮT ĐẦU
</button>

</div>

<!-- QUIZ -->

<div id="quiz" class="glass quiz">

<div class="top">
<b id="quizTitle"></b>
<span>🏆 <b id="score">0</b></span>
</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div id="qnum" class="qnum"></div>

<div id="question" class="question"></div>

<!-- MC -->

<div id="answers" class="answers"></div>

<!-- VERB -->

<div id="verbBox" style="display:none">

<input
id="verbInput"
class="inputBox"
placeholder="Nhập đáp án..."
autocomplete="off"
>

<br>

<button class="check" onclick="checkVerb()">
✅ KIỂM TRA
</button>

</div>

<!-- JOIN -->

<div id="joinBox" style="display:none">

<p style="margin-bottom:10px">
👉 Kéo các từ xuống ô bên dưới theo đúng thứ tự:
</p>

<div id="words" class="drag-area"></div>

<div id="drop" class="drop"></div>

<button class="check" onclick="checkJoin()">
✅ KIỂM TRA
</button>

</div>

<div id="feedback" class="feedback"></div>

<button id="next" class="next" onclick="nextGame()">
Câu tiếp theo ➜
</button>

<div id="result" class="result">

<h2>🎉 HOÀN THÀNH!</h2>

<div class="bigscore">
<span id="final">0</span>
</div>

<p id="resultText"></p>

<button class="btn" onclick="startGame()">
🔄 LÀM LẠI
</button>

</div>

</div>

</div>

<footer>
📚 HỌC ENGLISH • Luyện tập mỗi ngày 🚀
</footer>


<script>

/* =====================================================
   BÀI HỌC
===================================================== */

const lessons={

past:`
<h2>⏪ QUÁ KHỨ ĐƠN</h2>

<p>Dùng cho hành động đã xảy ra và kết thúc trong quá khứ.</p>

<h3>📌 CÔNG THỨC</h3>

<div class="formula">

`,

<h3>📌 CÔNG THỨC</h3>

<div class="formula">

He/She/It + V-s/es
</div>

<div class="formula">

</div>

<div class="formula">
<b>Nghi vấn:</b> Do/Does + S + V?
</div>

<h3>🔎 DẤU HIỆU</h3>

<div class="signs">
<span class="sign">always</span>
<span class="sign">usually</span>
<span class="sign">often</span>
<span class="sign">sometimes</span>
<span class="sign">never</span>
<span class="sign">every day</span>
</div>

<h3>💡 Ví dụ</h3>

<div class="formula">
She <b>goes</b> to school every day.
</div>
`,

perfect:`
<h2>🚀 HIỆN TẠI HOÀN THÀNH</h2>

<p>Dùng cho kinh nghiệm hoặc hành động có liên hệ với hiện tại.</p>

<h3>📌 CÔNG THỨC</h3>

<div class="formula">
<b>Khẳng định:</b> S + have/has + V3/V-ed
</div>

<div class="formula">
<b>Phủ định:</b> S + have/has not + V3/V-ed
</div>

<div class="formula">
<b>Nghi vấn:</b> Have/Has + S + V3?
</div>

<h3>🔎 DẤU HIỆU</h3>

<div class="signs">
<span class="sign">already</span>
<span class="sign">just</span>
<span class="sign">ever</span>
<span class="sign">never</span>
<span class="sign">yet</span>
<span class="sign">since</span>
<span class="sign">for</span>
<span class="sign">so far</span>
</div>

<h3>💡 Ví dụ</h3>

<div class="formula">
I <b>have finished</b> my homework.
</div>
`
};


/* =====================================================
   300 CÂU TRẮC NGHIỆM
===================================================== */

/*
Mỗi câu:
[
 câu hỏi,
 [A,B,C,D],
 đáp án đúng
]
*/

const mc={

past:[],

present:[],

perfect:[]

};


/* =====================================================
   TẠO CÂU TRẮC NGHIỆM
   Sinh thêm các câu luyện tập để đủ 100 câu / thì
===================================================== */

const pastData=[
["go","went","Yesterday, I ___ to school."],
["eat","ate","Yesterday, I ___ breakfast."],
["see","saw","Yesterday, I ___ my teacher."],
["buy","bought","Last week, I ___ a book."],
["take","took","Yesterday, I ___ a bus."],
["write","wrote","Last night, I ___ a letter."],
["make","made","Yesterday, she ___ a cake."],
["come","came","He ___ home late yesterday."],
["have","had","We ___ dinner last night."],
["do","did","I ___ my homework yesterday."]
];

const presentData=[
["go","goes","She ___ to school every day."],
["play","plays","He ___ football every Sunday."],
["watch","watches","She ___ TV every evening."],
["study","studies","He ___ English every day."],
["read","reads","My sister ___ books every night."],
["drink","drinks","He ___ coffee every morning."],
["eat","eats","She ___ breakfast at 7."],
["work","works","My father ___ every day."],
["live","lives","She ___ in Hanoi."],
["like","likes","He ___ music."]
];

const perfectData=[
["have finished","has finished","She ___ her homework."],
["have visited","has visited","He ___ Hanoi before."],
["have eaten","has eaten","She ___ lunch already."],
["have seen","has seen","He ___ this movie before."],
["have read","has read","She ___ the book."],
["have written","has written","He ___ three emails."],
["have bought","has bought","She ___ a new phone."],
["have lost","has lost","He ___ his keys."],
["have completed","has completed","She ___ the task."],
["have learned","has learned","He ___ English for years."]
];

function makeMC(data,type){

let arr=[];

for(let i=0;i<100;i++){

let item=data[i%data.length];

let correct=item[1];

let options=[];

if(type==="past"){
options=[
correct,
item[0],
correct+"ing",
"will "+item[0]
];
}

else if(type==="present"){
options=[
item[0],
correct,
item[0]+"ed",
"will "+item[0]
];
}

else{
options=[
item[0],
correct,
item[0].replace("have ","")+"ed",
"had "+item[0].replace("have ","")
];
}

let shuffled=[...options];

shuffled.sort(()=>Math.random()-.5);

let answer=shuffled.indexOf(correct);

arr.push([
item[2],
shuffled,
answer
]);

}

return arr;
}

mc.past=makeMC(pastData,"past");
mc.present=makeMC(presentData,"present");
mc.perfect=makeMC(perfectData,"perfect");


/* =====================================================

===================================================== */

["He ___ never ___ sushi.","has tried"],

["They ___ here since 2021.","have worked"],

["I ___ coffee every morning.","drink"],
["He ___ a movie last night.","watched"],
["She ___ already ___ the work.","has completed"],
["We ___ our teacher yesterday.","visited"],
["They ___ football on Sundays.","play"],
["I ___ never ___ this song.","have heard"],
["He ___ his homework yesterday.","did"],
["She ___ English for three years.","has studied"],
["We ___ dinner last night.","ate"],
["They ___ to Japan before.","have been"]
];


/* =====================================================
   50 CÂU NỐI / SẮP XẾP CÂU
===================================================== */

const joinQuestions=[

["I / go / to school / every day","I go to school every day"],
["She / likes / English","She likes English"],
["He / played / football / yesterday","He played football yesterday"],
["They / visited / Hanoi / last week","They visited Hanoi last week"],
["We / have finished / our homework","We have finished our homework"],

["He / has eaten / breakfast","He has eaten breakfast"],
["They / play / football / on Sundays","They play football on Sundays"],
["We / went / to the park / yesterday","We went to the park yesterday"],

["She / has lived / here / for five years","She has lived here for five years"],
["I / studied / English / yesterday","I studied English yesterday"],
["He / drinks / coffee / every morning","He drinks coffee every morning"],
["They / have seen / this movie / before","They have seen this movie before"],
["We / cleaned / the room / yesterday","We cleaned the room yesterday"],
["She / reads / books / every night","She reads books every night"],
["I / have visited / Hanoi / twice","I have visited Hanoi twice"],
["He / bought / a new phone / last week","He bought a new phone last week"],

/* =====================================================
   BIẾN GAME
===================================================== */

let mode="mc";
let tense="past";

let data=[];
let index=0;
let points=0;

let dragged=null;


/* =====================================================
   MENU
===================================================== */

function showMode(newMode){

mode=newMode;

document.querySelectorAll(".menu button")
.forEach(x=>x.classList.remove("active"));

if(newMode==="mc"){
document.getElementById("m1").classList.add("active");
}

if(newMode==="verb"){
document.getElementById("m2").classList.add("active");
}

if(newMode==="join"){
document.getElementById("m3").classList.add("active");
}

document.getElementById("quiz").style.display="none";
document.getElementById("start").style.display="block";

if(mode==="mc"){

document.getElementById("lesson").style.display="block";

document.getElementById("startTitle")
.textContent="🎯 QUIZ TRẮC NGHIỆM";

document.getElementById("startText")
.textContent="Chọn đáp án đúng trong 100 câu.";

}

if(mode==="verb"){

document.getElementById("lesson").style.display="block";

document.getElementById("startTitle")
.textContent="✏️ CHIA ĐỘNG TỪ";

document.getElementById("startText")
.textContent="Tự nhập dạng đúng của động từ. 50 câu.";

}

if(mode==="join"){

document.getElementById("lesson").style.display="none";

document.getElementById("startTitle")
.textContent="🔗 NỐI / SẮP XẾP CÂU";

document.getElementById("startText")
.textContent="Kéo các từ vào đúng thứ tự. 50 câu.";

}

}


/* =====================================================
   ĐỔI THÌ
===================================================== */

function changeTense(){

if(mode!=="mc")return;

}


/* =====================================================
   START
===================================================== */

function startGame(){

index=0;
points=0;

if(mode==="mc"){

data=[...mc[tense]];

document.getElementById("quizTitle")
.textContent="🎯 Trắc nghiệm";

}

if(mode==="verb"){

data=[...verbQuestions];

document.getElementById("quizTitle")
.textContent="✏️ Chia động từ";

}

if(mode==="join"){

data=[...joinQuestions];

document.getElementById("quizTitle")
.textContent="🔗 Nối câu";

}

document.getElementById("start").style.display="none";

document.getElementById("quiz").style.display="block";

document.getElementById("result").style.display="none";

document.getElementById("question").style.display="block";

document.getElementById("qnum").style.display="block";

document.getElementById("feedback").style.display="block";

render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

let q=data[index];

document.getElementById("qnum")
.textContent=
"Câu "+(index+1)+" / "+data.length;

document.getElementById("bar")
.style.width=(index/data.length*100)+"%";

document.getElementById("feedback").textContent="";

document.getElementById("next").style.display="none";


if(mode==="mc"){

document.getElementById("question")
.textContent=q[0];

document.getElementById("answers").style.display="grid";

document.getElementById("verbBox").style.display="none";

document.getElementById("joinBox").style.display="none";

let box=document.getElementById("answers");

box.innerHTML="";

q[1].forEach((x,i)=>{

let b=document.createElement("button");

b.className="answer";

b.textContent=
String.fromCharCode(65+i)+". "+x;

b.onclick=()=>answerMC(i,b);

box.appendChild(b);

});

}


if(mode==="verb"){

document.getElementById("question")
.textContent=q[0];

document.getElementById("answers").style.display="none";

document.getElementById("verbBox").style.display="block";

document.getElementById("joinBox").style.display="none";

document.getElementById("verbInput").value="";

document.getElementById("verbInput").disabled=false;

}


if(mode==="join"){

document.getElementById("question")
.textContent="Sắp xếp các từ thành câu đúng:";

document.getElementById("answers").style.display="none";

document.getElementById("verbBox").style.display="none";

document.getElementById("joinBox").style.display="block";

setupDrag(q[0]);

}

}


/* =====================================================
   TRẮC NGHIỆM
===================================================== */

function answerMC(selected,button){

let correct=data[index][2];

document.querySelectorAll(".answer")
.forEach(x=>x.disabled=true);

if(selected===correct){

points++;

button.classList.add("correct");

document.getElementById("feedback")
.textContent="🎉 Chính xác!";

}else{

button.classList.add("wrong");

document.querySelectorAll(".answer")
[correct].classList.add("correct");

document.getElementById("feedback")
.textContent="❌ Sai rồi!";

}

document.getElementById("score")
.textContent=points;

document.getElementById("next")
.style.display="inline-block";

}


/* =====================================================
   CHIA ĐỘNG TỪ
===================================================== */

function checkVerb(){

let input=
document.getElementById("verbInput")
.value
.trim()
.toLowerCase();

let correct=
data[index][1]
.toLowerCase();

if(input===correct){

points++;

document.getElementById("feedback")
.textContent="🎉 Chính xác!";

}else{

document.getElementById("feedback")
.textContent=
"❌ Đáp án đúng: "+data[index][1];

}

document.getElementById("verbInput")
.disabled=true;

document.getElementById("score")
.textContent=points;

document.getElementById("next")
.style.display="inline-block";

}


/* =====================================================
   KÉO THẢ
===================================================== */

function setupDrag(sentence){

let words=
sentence
.split(" / ")
.sort(()=>Math.random()-.5);

let area=
document.getElementById("words");

let drop=
document.getElementById("drop");

area.innerHTML="";
drop.innerHTML="";

words.forEach(word=>{

let el=document.createElement("div");

el.className="word";

el.textContent=word;

el.draggable=true;

el.addEventListener("dragstart",()=>{
dragged=el;
});

el.addEventListener("click",()=>{

drop.appendChild(el);

});

area.appendChild(el);

});

drop.addEventListener("dragover",e=>{
e.preventDefault();
});

drop.addEventListener("drop",e=>{

e.preventDefault();

if(dragged){
drop.appendChild(dragged);
}

});

}


/* =====================================================
   KIỂM TRA NỐI CÂU
===================================================== */

function checkJoin(){

let drop=
document.getElementById("drop");

let answer=
[...drop.children]
.map(x=>x.textContent)
.join(" ");

let correct=
data[index][1];

if(answer.toLowerCase()===correct.toLowerCase()){

points++;

document.getElementById("feedback")
.textContent="🎉 Chính xác!";

}else{

document.getElementById("feedback")
.textContent=
"❌ Chưa đúng. Đáp án: "+correct;

}

document.getElementById("score")
.textContent=points;

document.getElementById("next")
.style.display="inline-block";

}


/* =====================================================
   NEXT
===================================================== */

function nextGame(){

index++;

if(index>=data.length){

finish();

return;

}

render();

}


/* =====================================================
   FINISH
===================================================== */

function finish(){

document.getElementById("question").style.display="none";

document.getElementById("answers").style.display="none";

document.getElementById("verbBox").style.display="none";

document.getElementById("joinBox").style.display="none";

document.getElementById("qnum").style.display="none";

document.getElementById("feedback").style.display="none";

document.getElementById("next").style.display="none";

document.getElementById("bar").style.width="100%";

document.getElementById("result").style.display="block";

document.getElementById("final")
.textContent=points+" / "+data.length;

let percent=points/data.length*100;

let text="";

if(percent>=90)
text="🏆 Xuất sắc!";

else if(percent>=80)
text="🔥 Rất tốt!";

else if(percent>=60)
text="👍 Khá tốt!";

else if(percent>=40)
text="💪 Hãy luyện tập thêm!";

else
text="📚 Ôn lại kiến thức và thử lại nhé!";

document.getElementById("resultText")
.textContent=text;

}


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

document.getElementById("lesson")
.innerHTML=lessons.past;

</script>
