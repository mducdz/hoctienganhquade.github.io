*{box-sizing:border-box}

:root{

 --panel:#10182b;
 --panel2:#0c1324;

 --text:#eef4ff;

body{

button,input{

button{

.hide{

.center{
 text-align:center

.muted{
 color:var(--muted);

}

.card{
 background:var(--panel);

 padding:20px;
 margin-bottom:15px

.btn2{

.full{
 width:100%

.inp{
 width:100%;

 color:white;
 outline:none;
 margin:5px 0
}

.inp:focus{

/* AUTH */

.tile:hover{

.questionImg{

.good{

.bad{

 gap:18px

.matchItem{

.matchItem.selected{

table{

async function register(){

 const username =
 $("username").value.trim();

 const email =
 $("email").value.trim();

 const password =
 $("pass").value;

 const errorBox =
 $("authError");

 errorBox.textContent="";

 if(username.length<3){
  errorBox.textContent=
  "Tên người dùng phải có ít nhất 3 ký tự.";
  return;
 }

 if(password.length<6){
  errorBox.textContent=
  "Mật khẩu phải có ít nhất 6 ký tự.";
  return;
 }

 if(!email.includes("@")){
  errorBox.textContent=
  "Email không hợp lệ.";
  return;
 }

 const {
  data,
  error
 } =
 await db.auth.signUp({
  email,
  password
 });

 if(error){

  if(
   error.message
   .toLowerCase()
   .includes("signups are disabled")
  ){

   errorBox.innerHTML=
   "❌ Supabase đang tắt đăng ký tài khoản.<br><br>"+
   "Vào Supabase → Authentication → "+
   "Sign In / Providers → Email → bật cho phép đăng ký.";

  }else{

   errorBox.textContent=
   error.message;

  }

  return;
 }

 if(!data.user){

  errorBox.textContent=
  "Không tạo được tài khoản.";

  return;
 }


 const {
  error:profileError
 } =
 await db
 .from("profiles")
 .insert({
  id:data.user.id,
  username,
  role:"user",
  score:0
 });


 if(profileError){

  errorBox.textContent=
  "Tài khoản Auth đã tạo nhưng profiles lỗi: "+
  profileError.message;

  return;
 }


 if(data.session){

  loadProfile();

 }else{

  errorBox.textContent=
  "Đăng ký thành công! Hãy kiểm tra email để xác nhận tài khoản.";

 }

}


async function login(){

 const email =
 $("email").value.trim();

 const password =
 $("pass").value;

 const {
  error
 } =
 await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  $("authError").textContent=
  error.message;

  return;
 }

 loadProfile();

}


async function logout(){

 await db.auth.signOut();

 location.reload();

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

 const {
  data:{user}
 } =
 await db.auth.getUser();

 if(!user){

  authLogin();

  return;
 }


 const {
  data,
  error
 } =
 await db
 .from("profiles")
 .select("*")
 .eq("id",user.id)
 .maybeSingle();


 if(error || !data){

  alert(
   error?.message ||
   "Không tìm thấy profile."
  );

  return;
 }


 profile=data;

 score=Number(data.score||0);

 renderApp();

}


async function changeScore(value){

 score += value;

 if(score<0)
  score=0;

 $("score").textContent=score;

 await db
 .from("profiles")
 .update({
  score
 })
 .eq("id",profile.id);

}

function makeVocabItems(type,key){

 const words=
 TOPICS[key].words;

 return words.map(
 (w,index)=>{

  if(type==="match"){

   return {
    word:w[0],
    meaning:w[1],
    image:realImage(w[0]),
    id:index
   };

  }

  if(type==="choice"){

   let others=
   words
   .filter((_,i)=>i!==index)
   .sort(()=>Math.random()-.5)
   .slice(0,3);

   let opts=[
    w[0],
    ...others.map(x=>x[0])
   ];

   opts=
   [...new Set(opts)]
   .sort(()=>Math.random()-.5);

   return {
    word:w[0],
    meaning:w[1],
    image:realImage(w[0]),
    answer:w[0],
    opts
   };

  }

  return {
   word:w[0],
   meaning:w[1],
   image:realImage(w[0]),
   answer:w[0]
  };

 });

}

async function choiceAnswer(el,value){

 if(current.locked)
  return;

 current.locked=true;

 const answer=
 current.items[current.index].answer;

 const ok=
 value.toLowerCase()===
 answer.toLowerCase();

 if(ok){

  el.classList.add("good");

  current.correct++;

  await changeScore(10);

  $("feedback").innerHTML=
  "🎉 Chính xác! <b>+10 điểm</b>";

 }else{

  el.classList.add("bad");

  await changeScore(-5);

  $("feedback").innerHTML=
  "❌ Sai! Đáp án đúng: <b>"+
  esc(answer)+
  "</b> <br>-5 điểm";

 }

 setTimeout(nextVocab,800);

}


async function fillAnswer(){

 if(current.locked)
  return;

 current.locked=true;

 const value=
 $("answerInput")
 .value
 .trim()
 .toLowerCase();

 const answer=
 current.items[current.index].answer
 .toLowerCase();

 if(value===answer){

  current.correct++;

  await changeScore(10);

  $("feedback").innerHTML=
  "🎉 Chính xác! <b>+10 điểm</b>";

 }else{

  await changeScore(-5);

  "❌ Sai! Đáp án: <b>"+
  esc(current.items[current.index].answer)+
  "</b> <br>-5 điểm";

 }

 setTimeout(nextVocab,800);

}

const TENSES={

 present:{

 },

 },

 future:{

/* =========================================================
   GRAMMAR QUESTION DATA
========================================================= */

const VERBS=[

 ["go","went","gone"],
 ["play","played","played"],
 ["watch","watched","watched"],
 ["visit","visited","visited"],
 ["eat","ate","eaten"],
 ["see","saw","seen"],
 ["buy","bought","bought"],
 ["write","wrote","written"],
 ["make","made","made"],
 ["take","took","taken"],
 ["come","came","come"],
 ["have","had","had"],
 ["study","studied","studied"],
 ["work","worked","worked"],
 ["read","read","read"],
 ["do","did","done"],
 ["run","ran","run"],
 ["swim","swam","swum"],
 ["speak","spoke","spoken"],
 ["drink","drank","drunk"]
];


function grammarItems(type){

 let arr=[];

 for(let r=0;r<5;r++){

  for(const v of VERBS){

   const subjects=
   ["I","You","We","They","He","She"];

   const sub=
   subjects[
    Math.floor(Math.random()*subjects.length)
   ];

   let q="";
   let a="";

   if(type==="quiz"){

    if(r%5===0){

     a=v[1];

     q=
     `Yesterday, ${sub} ___ to school. (${v[0]})`;

    }

    else if(r%5===1){

     a=
     ["He","She"].includes(sub)
     ?v[0]+(v[0]==="go"?"es":"s")
     :v[0];

     q=
     `${sub} ___ English every day. (${v[0]})`;

    }

    else if(r%5===2){

     a=v[0]+"ing";

     if(v[0]==="run")
      a="running";

     if(v[0]==="swim")
      a="swimming";

     q=
     `${sub} is/are ___ now. (${v[0]})`;

    }

    else if(r%5===3){

     a=v[2];

     q=
     `${sub} has/have ___ this before. (${v[0]})`;

    }

    else{

     a=v[0];

     q=
     `${sub} will ___ tomorrow. (${v[0]})`;

    }

    arr.push({
     q,
     a
    });

   }

   else if(type==="verb"){

    let ans;

    if(r%5===0)
     ans=v[1];

    else if(r%5===1)
     ans=
     ["He","She"].includes(sub)
     ?v[0]+(v[0]==="go"?"es":"s")
     :v[0];

    else if(r%5===2){

     ans=v[0]+"ing";

     if(v[0]==="run")
      ans="running";

     if(v[0]==="swim")
      ans="swimming";

    }

    else if(r%5===3)
     ans=v[2];

    else
     ans=v[0];

    arr.push({
     q:`${sub} ___ (${v[0]})`,
     a:ans
    });

   }

   else{

    let ans;

    if(r%5===0)
     ans=`did not ${v[0]}`;

    else if(r%5===1)
     ans=
     ["He","She"].includes(sub)
     ?`does not ${v[0]}`
     :`do not ${v[0]}`;

    else if(r%5===2){

     let aux=
     ["He","She"].includes(sub)
     ?"is not"
     :"are not";

     let ing=v[0]+"ing";

     if(v[0]==="run")
      ing="running";

     if(v[0]==="swim")
      ing="swimming";

     ans=`${aux} ${ing}`;

    }

    else if(r%5===3){

     ans=
     ["He","She"].includes(sub)
     ?`has not ${v[2]}`
     :`have not ${v[2]}`;

    }

    else
     ans=`will not ${v[0]}`;

    arr.push({
     q:`${sub} ___`,
     a:ans
    });

   }

  }

 }

 return arr;

}

  ${Object.entries(TENSES).map(
  ([k,t])=>`

   <div class="tile"
    onclick="startGrammar('negative','${k}')">

    <h3>
     ${t.name}
    </h3>

    <p>
     50 câu
    </p>

   </div>

  `).join("")}

  </div>

 </div>

 `;

}


/* =========================================================
   START GRAMMAR
========================================================= */

function startGrammar(type,tense){

 let items=
 grammarItems(type);

 current={
  type,
  tense,
  index:0,
  correct:0,
  items:
   items.slice(
    0,
    type==="quiz"?100:50
   ),
  locked:false
 };

 renderGrammarQuestion();

}


function renderGrammarQuestion(){

 const x=
 current.items[current.index];

 const total=
 current.items.length;

 $("title").textContent=
 TENSES[current.tense].name;

 let options=[];

 if(current.type==="quiz"){

  const pool=
  current.items
  .map(x=>x.a)
  .filter(a=>a!==x.a);

  options=[
   x.a,
   ...pool
   .sort(()=>Math.random()-.5)
   .slice(0,3)
  ];

  options=
  [...new Set(options)]
  .sort(()=>Math.random()-.5);

 }


 $("page").innerHTML=`

 <div class="card">

  <div style="
   display:flex;
   justify-content:space-between">

   <span>
    ${
     current.type==="quiz"
     ?"📝 Quiz"
     :
     current.type==="verb"
     ?"✏️ Chia động từ"
     :
     "❌ Phủ định"
    }
   </span>

   <span>
    ${current.index+1}/${total}
   </span>

  </div>


  <div class="progress">

   <i style="
    width:${current.index/total*100}%">
   </i>

  </div>


  <h2>
   ${esc(x.q)}
  </h2>


  ${
   current.type==="quiz"

   ?

   options.map(
   o=>`

   <button
    class="option"
    onclick="grammarAnswer(this,${JSON.stringify(o)})">

    ${esc(o)}

   </button>

   `).join("")

   :

   `
   <input
    id="grammarInput"
    class="inp"
    placeholder="Nhập đáp án">

   <button
    class="btn"
    onclick="grammarTextAnswer()">

    ✓ Kiểm tra

   </button>
   `
  }


  <div
   id="feedback"
   class="muted">
  </div>

 </div>

 `;

}


async function grammarAnswer(el,value){

 if(current.locked)
  return;

 current.locked=true;

 const answer=
 current.items[current.index].a;

 const ok=
 value.toLowerCase()===
 answer.toLowerCase();

 if(ok){

  el.classList.add("good");

  current.correct++;

  await changeScore(10);

  $("feedback").innerHTML=
  "🎉 Chính xác! +10 điểm";

 }else{

  el.classList.add("bad");

  await changeScore(-5);

  $("feedback").innerHTML=
  "❌ Sai! Đáp án: <b>"+
  esc(answer)+
  "</b><br>-5 điểm";

 }

 setTimeout(nextGrammar,750);

}


async function grammarTextAnswer(){

 if(current.locked)
  return;

 current.locked=true;

 const value=
 $("grammarInput")
 .value
 .trim()
 .toLowerCase();

 const answer=
 current.items[current.index].a
 .toLowerCase();

 if(value===answer){

  current.correct++;

  await changeScore(10);

  $("feedback").innerHTML=
  "🎉 Chính xác! +10 điểm";

 }else{

  await changeScore(-5);

  $("feedback").innerHTML=
  "❌ Sai! Đáp án: <b>"+
  esc(current.items[current.index].a)+
  "</b><br>-5 điểm";

 }

 setTimeout(nextGrammar,750);

}


function nextGrammar(){

 current.index++;

 current.locked=false;

 if(current.index>=current.items.length){

  exerciseResult();

  return;

 }

 renderGrammarQuestion();

}


function exerciseResult(){

 $("page").innerHTML=`

 <div class="card center"
  style="padding:45px">

  <div style="font-size:65px">
   🏆
  </div>

  <h2>
   Hoàn thành bài!
  </h2>

  <h1>
   ${current.correct}/${current.items.length}
  </h1>

  <p class="muted">
   Bạn có thể làm lại bài để luyện thêm.
  </p>

  <button
   class="btn"
   onclick="startGrammar(
    '${current.type}',
    '${current.tense}'
   )">

   🔄 Làm lại

  </button>

 </div>

 `;

}


/* =========================================================
   SO SÁNH HƠN
   100 CÂU
========================================================= */

const COMPARATIVES=[

 ["tall","taller","cao"],
 ["short","shorter","thấp"],
 ["fast","faster","nhanh"],
 ["slow","slower","chậm"],
 ["small","smaller","nhỏ"],
 ["big","bigger","to"],
 ["hot","hotter","nóng"],
 ["cold","colder","lạnh"],
 ["long","longer","dài"],
 ["young","younger","trẻ"],
 ["old","older","già"],
 ["easy","easier","dễ"],
 ["happy","happier","vui"],
 ["busy","busier","bận"],
 ["pretty","prettier","xinh"],
 ["heavy","heavier","nặng"],
 ["funny","funnier","buồn cười"],
 ["early","earlier","sớm"],
 ["late","later","muộn"],
 ["good","better","tốt"],
 ["bad","worse","tệ"],
 ["far","farther","xa"],
 ["little","less","ít"],
 ["many","more","nhiều"],
 ["much","more","nhiều"],
 ["beautiful","more beautiful","đẹp"],
 ["expensive","more expensive","đắt"],
 ["interesting","more interesting","thú vị"],
 ["important","more important","quan trọng"],
 ["careful","more careful","cẩn thận"]
];


function comparePage(btn){

 nav(btn,"📈 So sánh hơn");

 $("page").innerHTML=`

 <div class="card">

  <h2>
   📈 So sánh hơn
  </h2>

  <h3>
   Cấu trúc
  </h3>

  <div class="card"
   style="background:#080d1b">

   <b>
    S + be + adjective-er + than + ...
   </b>

   <br><br>

   <b>
    S + be + more + adjective + than + ...
   </b>

  </div>


  <p class="muted">

   • Tính từ ngắn:
   tall → taller

   <br>

   • Tận cùng bằng y:
   happy → happier

   <br>

   • Một số từ gấp đôi phụ âm:
   big → bigger

   <br>

   • Tính từ dài:
   beautiful → more beautiful

   <br>

   • Bất quy tắc:
   good → better,
   bad → worse,
   little → less,
   many/much → more

  </p>


  <button
   class="btn"
   onclick="startCompare()">

   📝 Làm 100 câu

  </button>


  <div class="grid"
   style="margin-top:15px">

   ${COMPARATIVES.map(
   x=>`

   <div class="tile">

    <b>
     ${x[0]}
    </b>

    →
    
    <b>
     ${x[1]}
    </b>

    <p>
     ${x[2]}
    </p>

   </div>

   `).join("")}

  </div>

 </div>

 `;

}


function startCompare(){

 let items=[];

 for(let i=0;i<100;i++){

  const x=
  COMPARATIVES[
   i%COMPARATIVES.length
  ];

  let options=[
   x[1],
   x[0],
   x[0]+"er",
   "more "+x[0]
  ];

  options=
  [...new Set(options)]
  .sort(()=>Math.random()-.5);

  items.push({
   q:
   `${x[2]}: This car is ___ than that one. (${x[0]})`,
   a:x[1],
   opts:options
  });

 }

 current={
  type:"compare",
  index:0,
  correct:0,
  items,
  locked:false
 };

 renderCompare();

}


function renderCompare(){

 const x=
 current.items[current.index];

 $("title").textContent=
 "📈 So sánh hơn";

 $("page").innerHTML=`

 <div class="card">

  <div>
   ${current.index+1}/100
  </div>

  <div class="progress">

   <i style="
    width:${current.index}%">
   </i>

  </div>

  <h2>
   ${esc(x.q)}
  </h2>

  ${x.opts.map(
  o=>`

   <button
    class="option"
    onclick="compareAnswer(this,${JSON.stringify(o)})">

    ${esc(o)}

   </button>

  `).join("")}

  <div
   id="feedback"
   class="muted">
  </div>

 </div>

 `;

}


async function compareAnswer(el,value){

 if(current.locked)
  return;

 current.locked=true;

 const answer=
 current.items[current.index].a;

 const ok=
 value.toLowerCase()===
 answer.toLowerCase();

 if(ok){

  el.classList.add("good");

  current.correct++;

  await changeScore(10);

  $("feedback").innerHTML=
  "🎉 Chính xác! +10 điểm";

 }else{

  el.classList.add("bad");

  await changeScore(-5);

  $("feedback").innerHTML=
  "❌ Sai! Đáp án: <b>"+
  esc(answer)+
  "</b><br>-5 điểm";

 }

 setTimeout(()=>{

  current.index++;

  current.locked=false;

  if(current.index>=100)
   exerciseResult();
  else
   renderCompare();

 },750);

}

/* =========================================================
   ADMIN
========================================================= */

async function adminPage(btn){

 if(profile.role!=="admin"){

  alert("Bạn không có quyền admin.");

  return;

 }

 nav(btn,"🛡️ Quản lý người dùng");

 const {
  data,
  error
 } =
 await db
 .from("profiles")
 .select("*")
 .order("created_at",{ascending:false});


 if(error){

  $("page").innerHTML=`

  <div class="card">
   ❌ ${esc(error.message)}
  </div>

  `;

  return;

 }


 $("page").innerHTML=`

 <div class="card">

  <h2>
   👥 Người dùng
   (${data.length})
  </h2>

  <div class="scroll">

  <table>

   <thead>

    <tr>
     <th>Username</th>
     <th>Role</th>
     <th>Điểm</th>
     <th>Thao tác</th>
    </tr>

   </thead>

   <tbody>

   ${data.map(
   u=>`

   <tr>

    <td>
     ${esc(u.username)}
    </td>

    <td>
     <span class="badge">
      ${esc(u.role)}
     </span>
    </td>

    <td>
     ${Number(u.score||0)}
    </td>

    <td>

    ${
     u.id===profile.id

     ?

     "<small>Tài khoản hiện tại</small>"

     :

     `

     ${
      u.role==="admin"

      ?

      `
      <button
       class="btn2"
       onclick="changeRole('${u.id}','user')">

       ⬇️ Hạ cấp

      </button>
      `

      :

      `
      <button
       class="btn"
       onclick="changeRole('${u.id}','admin')">

       ⬆️ Cấp admin

      </button>
      `
     }


     <button
      class="btn2"
      onclick="resetUserScore('${u.id}')">

      🔄 Reset điểm

     </button>

     `

    }

    </td>

   </tr>

   `).join("")}

   </tbody>

  </table>

  </div>

 </div>

 `;

}


async function changeRole(id,role){

 if(!confirm(
  "Bạn có chắc muốn đổi role thành "+
  role+"?"
 ))
 return;


 const {
  error
 } =
 await db
 .from("profiles")
 .update({role})
 .eq("id",id);


 if(error){

  alert(error.message);

  return;

 }

 adminPage();

}


async function resetUserScore(id){

 if(!confirm(
  "Reset điểm người dùng này về 0?"
 ))
 return;


 const {
  error
 } =
 await db
 .from("profiles")
 .update({score:0})
 .eq("id",id);


 if(error){

  alert(error.message);

  return;

 }

 adminPage();

}
