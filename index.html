<html lang="vi">

<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#070b18;
    color:#fff;
}
button,input{font:inherit}

button{cursor:pointer}

.app{display:flex;min-height:100vh}

.sidebar{
    width:240px;
    position:fixed;
    left:0;top:0;bottom:0;
    overflow:auto;
    padding:18px 13px;
    background:#0d1328;
    border-right:1px solid #263252;
    z-index:20;
}

.logo{
    padding:10px;
    margin-bottom:15px;
    border-bottom:1px solid #263252;
}

.logo h1{
    margin:0;
    font-size:22px;
    background:linear-gradient(90deg,#20dcff,#8c5cff,#ff4db8);
    -webkit-background-clip:text;
    color:transparent;
}

.logo small{color:#8794b5}

.title{
    color:#667394;
    font-size:10px;
    font-weight:bold;
    margin:16px 8px 6px;
}

.nav{
    width:100%;
    border:0;
    background:transparent;
    color:#aeb9d1;
    padding:11px;
    border-radius:9px;
    text-align:left;
    margin:2px 0;
}

.nav:hover{
    background:#ffffff0a;
    color:white;
}

.nav.active{
    color:white;
    background:linear-gradient(90deg,#20dcff20,#875cff20);
    border-left:3px solid #20dcff;
}

.main{
    margin-left:240px;
    width:calc(100% - 240px);
    padding:25px;
}

.top{
    max-width:1100px;
    margin:auto auto 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.top h2{
    margin:0;
    font-size:24px;
}

.score{
    background:#111a32;
    border:1px solid #263252;
    padding:9px 15px;
    border-radius:20px;
}

.page{
    max-width:1100px;
    margin:auto;
}

.card{
    background:#10172d;
    border:1px solid #263252;
    border-radius:16px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 10px 30px #0003;
}

.hero{
    text-align:center;
    padding:45px 20px;
}

.hero .emoji{font-size:60px}

.hero h1{
    font-size:32px;
    margin:12px 0;
}

.hero p{
    color:#9ca9c7;
    line-height:1.7;
}

.primary,.secondary{
    border-radius:10px;
    padding:11px 17px;
    margin:3px;
}

.primary{
    border:0;
    color:white;
    background:linear-gradient(135deg,#17d8ff,#765bff,#ff3fae);
}

.secondary{
    color:white;
    background:#ffffff0b;
    border:1px solid #34405e;
}

.primary:hover{
    filter:brightness(1.12);
}

.secondary:hover{
    background:#ffffff14;
}

.formula{
    background:#080d1d;
    border:1px solid #202c49;
    border-radius:9px;
    padding:11px;
    margin:7px 0;
    color:#dce4f5;
}

.lesson h3{
    color:#20dcff;
    font-size:14px;
    margin-top:20px;
}

.lesson p{
    color:#bdc8df;
    line-height:1.6;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.tag{
    background:#ffffff0b;
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
    color:#cbd5e9;
}

.progress{
    height:7px;
    background:#050915;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 18px;
}

.progress div{
    height:100%;
    background:linear-gradient(90deg,#20dcff,#765bff,#ff3fae);
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:15px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.answer{
    border:1px solid #293654;
    background:#ffffff07;
    color:white;
    padding:13px;
    border-radius:10px;
    text-align:left;
}

.answer:hover{
    background:#ffffff12;
}

.correct{
    border-color:#39e58c!important;
    background:#39e58c18!important;
}

.wrong{
    border-color:#ff5268!important;
    background:#ff526818!important;
}

.feedback{
    min-height:24px;
    margin:12px 0;
    font-weight:bold;
}

.input{
    width:100%;
    padding:13px;
    background:#070c1b;
    color:white;
    border:1px solid #293654;
    border-radius:9px;
    outline:none;
    margin-bottom:10px;
}

.input:focus{
    border-color:#20dcff;
}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.vocab-card{
    padding:15px;
    background:#ffffff06;
    border:1px solid #263252;
    border-radius:12px;
    transition:.15s;
}

.vocab-card:hover{
    border-color:#20dcff;
    transform:translateY(-2px);
}

.vocab-card .icon{
    font-size:35px;
}

.vocab-card h3{
    font-size:14px;
    margin:7px 0;
}

.vocab-card p{
    font-size:11px;
    color:#8794b5;
}

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.level-card{
    padding:20px;
    border:1px solid #293654;
    border-radius:13px;
    background:#ffffff06;
    transition:.15s;
}

.level-card:hover{
    transform:translateY(-2px);
    border-color:#20dcff;
}

.level-card h3{
    margin:8px 0;
}

.level-card p{
    color:#8d9ab8;
    font-size:12px;
}

.vocab-image{
    height:230px;
    background:#080d1d;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:14px;
}

.vocab-image img{
    width:180px;
    height:180px;
    object-fit:contain;
}

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.match-item{
    border:1px solid #293654;
    background:#ffffff06;
    border-radius:10px;
    padding:10px;
    margin-bottom:7px;
    min-height:50px;
    display:flex;
    align-items:center;
    gap:10px;
}

.match-item.selected{
    border-color:#20dcff;
    background:#20dcff15;
}

.match-img{
    width:50px;
    height:50px;
    object-fit:contain;
}

.result{
    text-align:center;
    padding:35px;
}

.result-score{
    font-size:55px;
    color:#ffe66d;
    font-weight:bold;
    margin:10px;
}

.user-box{
    margin-top:15px;
    padding:15px;
    border:1px solid #263252;
    border-radius:10px;
    background:#ffffff05;
}

.auth-wrap{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth{
    width:100%;
    max-width:430px;
}

.auth h1{text-align:center}

.auth input{
    margin-bottom:9px;
}

.auth-error{
    color:#ff6678;
    min-height:22px;
    font-size:13px;
}

.auth-success{
    color:#39e58c;
    min-height:22px;
    font-size:13px;
}

.mobile{
    display:none;
    background:#ffffff08;
    border:1px solid #293654;
    color:white;
    border-radius:8px;
    padding:8px 11px;
}

.admin-user{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    margin:7px 0;
    border:1px solid #293654;
    border-radius:10px;
    background:#ffffff05;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    background:#20dcff18;
    color:#20dcff;
}

.badge.admin{
    color:#ffcf5c;
    background:#ffcf5c18;
}

@media(max-width:850px){

    .sidebar{
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:15px;
    }

    .mobile{
        display:block;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .vocab-grid{
        grid-template-columns:1fr 1fr;
    }

    .level-grid{
        grid-template-columns:1fr 1fr;
    }

    .match-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:480px){

    .vocab-grid,
    .level-grid{
        grid-template-columns:1fr;
    }

    .top h2{
        font-size:19px;
    }
}

function esc(value){
    return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-.5);
}

function codePoints(str){
    return [...str]
    .map(c=>c.codePointAt(0).toString(16))
    .join("-");
}

function emojiImage(emoji){
    return "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/"
    +codePoints(emoji)+".png";
}

function toggleMenu(){
    const s=document.getElementById("sidebar");

/* =========================================================
   AUTH
========================================================= */

async function getSession(){

    const {data,error} =
        await supabaseClient.auth.getSession();

    if(error){
        console.error(error);
        return null;
    }

    return data.session;
}


async function register(){

    const username =
        document.getElementById("regUser").value.trim();

    const password =
        document.getElementById("regPass").value;

    const errorBox =
        document.getElementById("authError");

    const successBox =
        document.getElementById("authSuccess");

    errorBox.textContent="";
    successBox.textContent="";

    if(username.length<3){
        errorBox.textContent=
        "Tên tài khoản phải có ít nhất 3 ký tự.";
        return;
    }

    if(password.length<6){
        errorBox.textContent=
        "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    const email =
        username.toLowerCase().replace(/[^a-z0-9]/g,"")
        +"@hocenglish.local";

    const {data,error} =
        await supabaseClient.auth.signUp({
            email:email,
            password:password,
            options:{
                data:{
                    username:username
                }
            }
        });

    if(error){
        errorBox.textContent=error.message;
        return;
    }

    if(data.user){

        await createProfile(
            data.user.id,
            username
        );
    }

    successBox.textContent=
    "Đăng ký thành công. Đang đăng nhập...";

    if(data.session){
        await loadProfile();
    }else{
        errorBox.textContent=
        "Tài khoản đã tạo. Nếu Supabase yêu cầu xác nhận email, hãy tắt Email Confirmation trong Authentication → Providers → Email để đăng nhập ngay.";
    }
}


async function login(){

    const username =
        document.getElementById("loginUser").value.trim();

    const password =
        document.getElementById("loginPass").value;

    const errorBox =
        document.getElementById("authError");

    errorBox.textContent="";

    if(!username || !password){
        errorBox.textContent=
        "Vui lòng nhập đầy đủ tài khoản và mật khẩu.";
        return;
    }

    const email =
        username.toLowerCase().replace(/[^a-z0-9]/g,"")
        +"@hocenglish.local";

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){
        errorBox.textContent=
        "Đăng nhập thất bại: "+error.message;
        return;
    }

    if(data.session){
        await loadProfile();
    }
}


async function logout(){

    await supabaseClient.auth.signOut();

    profile=null;

    renderAuth();
}


async function createProfile(id,username){

    const {error} =
        await supabaseClient
        .from("profiles")
        .upsert({
            id:id,
            username:username,
            role:"user",
            score:0
        });

    if(error){
        console.error("PROFILE ERROR:",error);
    }
}


async function loadProfile(){

    const session=await getSession();

    if(!session){
        renderAuth();
        return;
    }

    let {data,error} =
        await supabaseClient
        .from("profiles")
        .select("id,username,role,score")
        .eq("id",session.user.id)
        .maybeSingle();

    if(error){
        console.error(error);

        /*
           Nếu profile chưa tồn tại thì tạo.
        */

        await createProfile(
            session.user.id,
            session.user.user_metadata?.username ||
            session.user.email.split("@")[0]
        );

        const result =
            await supabaseClient
            .from("profiles")
            .select("id,username,role,score")
            .eq("id",session.user.id)
            .maybeSingle();

        data=result.data;
    }

    if(!data){

        await createProfile(
            session.user.id,
            session.user.user_metadata?.username ||
            "User"
        );

        const result =
            await supabaseClient
            .from("profiles")
            .select("id,username,role,score")
            .eq("id",session.user.id)
            .maybeSingle();

        data=result.data;
    }

    profile=data;

    renderApp();
}

async function addGlobal(points){

    if(!profile)return;

    profile.score=(profile.score||0)+points;

    const scoreBox=
        document.getElementById("globalScore");

    if(scoreBox)
        scoreBox.textContent=profile.score;

    const {error} =
        await supabaseClient
        .from("profiles")
        .update({
            score:profile.score
        })
        .eq("id",profile.id);

    if(error){
        console.error("SAVE SCORE ERROR:",error);
    }
}

function selectImage(el,id){

    document.querySelectorAll(
        "#imageList .match-item"
    ).forEach(x=>
        x.classList.remove("selected")
    );

    el.classList.add("selected");

    selectedImage={
        el:el,
        id:id
    };

    tryMatch();
}


function selectWord(el,id){

    document.querySelectorAll(
        "#wordList .match-item"
    ).forEach(x=>
        x.classList.remove("selected")
    );

    el.classList.add("selected");

    selectedWord={
        el:el,
        id:id
    };

    tryMatch();
}


async function tryMatch(){

    if(!selectedImage || !selectedWord)
        return;

    if(selectedImage.id===selectedWord.id){

        selectedImage.el.style.display="none";

        selectedWord.el.style.display="none";

        vocabScore+=10;

        await addGlobal(10);

        document.getElementById(
            "matchFeedback"
        ).innerHTML=
        "🎉 Đúng! +10 điểm";

    }else{

        document.getElementById(
            "matchFeedback"
        ).innerHTML=
        "❌ Chưa đúng, hãy thử lại.";

    }

    selectedImage=null;
    selectedWord=null;

    document.querySelectorAll(".match-item")
    .forEach(x=>
        x.classList.remove("selected")
    );

    checkMatchingFinished();
}


function checkMatchingFinished(){

    const remaining=[
        ...document.querySelectorAll(
            "#imageList .match-item"
        )
    ].filter(
        x=>x.style.display!=="none"
    );

    if(remaining.length===0){

        setTimeout(showVocabResult,500);

    }
}

        <div style="font-size:60px">
            🏆
        </div>

        <h2>Hoàn thành!</h2>

        <p>
            ${esc(vocab[vocabTopic].name)}
            -
            ${levelNames[vocabLevel]}
        </p>

        <div class="result-score">
            ${vocabScore}/200
        </div>

        <p style="color:#9ca9c7">
            Độ chính xác: ${percent}%
        </p>

        <button
            class="primary"
            onclick="startVocab('${vocabTopic}','${vocabLevel}')">

        </button>

        <button
            class="secondary"
            onclick="chooseLevel('${vocabTopic}')">

        </button>

    `;
}

/* =========================================================
   ADMIN
========================================================= */

async function adminPage(btn){

    if(profile?.role!=="admin"){
        alert("Bạn không có quyền admin.");
        return;
    }

    activeNone();

    if(btn)btn.classList.add("active");

    closeMenu();

    setTitle("🛡️ Quản lý tài khoản");

    document.getElementById("page").innerHTML=`

    <div class="card">

        <h2>🛡️ Quản lý tài khoản</h2>

        <p style="color:#9ca9c7">
            Danh sách tài khoản trong hệ thống.
        </p>

        <div id="adminUsers">
            Đang tải...
        </div>

    </div>
    `;

    await loadAdminUsers();
}


async function loadAdminUsers(){

    const box=
        document.getElementById("adminUsers");

    if(!box)return;

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("id,username,role,score")
        .order("score",{ascending:false});

    if(error){

        box.innerHTML=`
            <div class="auth-error">
                Không thể tải danh sách:
                ${esc(error.message)}
            </div>
        `;

        console.error(error);

        return;
    }

    if(!data || data.length===0){

        box.innerHTML=
        `<p style="color:#8794b5">
            Chưa có tài khoản.
        </p>`;

        return;
    }

    box.innerHTML=data.map(user=>`

        <div class="admin-user">

            <div>

                <b>👤 ${esc(user.username)}</b>

                <div style="
                    color:#8794b5;
                    font-size:12px;
                    margin-top:5px">

                    ⭐ ${user.score||0} điểm

                </div>

            </div>

            <div>

                <span class="badge
                    ${user.role==="admin"?"admin":""}">
                    ${user.role==="admin"
                        ?"ADMIN"
                        :"USER"}
                </span>

                ${user.id!==profile.id ? `

                <button
                    class="secondary"
                    style="margin-left:5px"
                    onclick="toggleUserRole(
                        '${user.id}',
                        '${user.role}'
                    )">

                    ${user.role==="admin"
                        ?"Hạ quyền"
                        :"Cấp admin"}

                </button>

                `:""}

            </div>

        </div>

    `).join("");
}


async function toggleUserRole(id,currentRole){

    if(profile?.role!=="admin"){
        alert("Không có quyền.");
        return;
    }

    const newRole=
        currentRole==="admin"
        ?"user"
        :"admin";

    const ok=confirm(
        newRole==="admin"
        ?"Cấp quyền ADMIN cho tài khoản này?"
        :"Hạ tài khoản này xuống USER?"
    );

    if(!ok)return;

    const {error} =
        await supabaseClient
        .from("profiles")
        .update({
            role:newRole
        })
        .eq("id",id);

    if(error){

        alert(
            "Không thể thay đổi role: "+
            error.message
        );

        return;
    }

    await loadAdminUsers();
}


/* =========================================================
   KHỞI ĐỘNG
========================================================= */

async function boot(){

    const session=await getSession();

    if(session){
        await loadProfile();
    }else{
        renderAuth();
    }

    supabaseClient.auth.onAuthStateChange(
        async (event,session)=>{

            if(event==="SIGNED_OUT"){
                profile=null;
                renderAuth();
            }

        }
    );
}

boot();

</script>
